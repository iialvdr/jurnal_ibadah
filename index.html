<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurnal Ibadah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { slate: { 850: '#1e293b' } } } }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="https://img.icons8.com/fluency/192/mosque.png">
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 dark:bg-slate-950 flex justify-center min-h-screen text-slate-800 dark:text-slate-200 transition-colors duration-300">

    <div id="appContainer" class="w-full max-w-md bg-white dark:bg-slate-900 shadow-2xl relative flex flex-col h-screen sm:h-auto sm:min-h-screen sm:rounded-[2rem] sm:my-8 overflow-hidden transition-colors duration-300">
        
        <div id="loginOverlay" class="absolute inset-0 z-50 bg-white dark:bg-slate-900 flex flex-col items-center justify-center p-8 transition-opacity duration-500">
            <div class="bg-emerald-100 dark:bg-emerald-900/30 p-6 rounded-full mb-6 animate-bounce-slow">
                <i data-lucide="mosque" class="w-16 h-16 text-emerald-600 dark:text-emerald-400"></i>
            </div>
            <h1 class="text-2xl font-bold mb-2 text-center">Jurnal Ibadah</h1>
            <p class="text-slate-500 dark:text-slate-400 text-center mb-8 text-sm">Catat ibadahmu, simpan selamanya.</p>
            <button id="googleLoginBtn" class="flex items-center gap-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 px-6 py-3 rounded-xl shadow-md transition-all active:scale-95 w-full justify-center">
                <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="currentColor" d="M21.35 11.1h-9.17v2.73h6.51c-.33 3.81-3.5 5.44-6.5 5.44C8.36 19.27 5 16.25 5 12c0-4.1 3.2-7.27 7.2-7.27 3.09 0 4.9 1.97 4.9 1.97L19 4.72S16.56 2 12.1 2C6.42 2 2.03 6.8 2.03 12c0 5.05 4.13 10 10.22 10 5.35 0 9.25-3.67 9.25-9.09 0-1.15-.15-1.81-.15-1.81Z"/></svg>
                <span>Masuk dengan Google</span>
            </button>
            <p id="loginStatus" class="mt-4 text-xs text-emerald-600 animate-pulse hidden">Menghubungkan ke Google...</p>
            <p id="errorMsg" class="mt-2 text-xs text-red-500 text-center hidden"></p>
        </div>

        <div id="appHeader" class="bg-gradient-to-br from-emerald-600 to-teal-700 dark:from-emerald-800 dark:to-teal-900 text-white p-6 pb-8 rounded-b-[2.5rem] shadow-xl z-10 relative shrink-0 transition-all duration-300 hidden-force">
            <div class="absolute top-0 right-0 w-40 h-40 bg-white/10 rounded-full -mr-10 -mt-10 blur-3xl pointer-events-none"></div>
            <div class="absolute bottom-0 left-0 w-24 h-24 bg-emerald-400/20 rounded-full -ml-8 -mb-4 blur-2xl pointer-events-none"></div>
            
            <div class="flex justify-between items-center mb-6 relative z-10">
                <div onclick="openProfile()" class="flex items-center gap-3 cursor-pointer hover:opacity-80 transition">
                    <img id="userPhoto" src="" alt="Profile" class="w-10 h-10 rounded-full border-2 border-white/30 shadow-sm bg-white/20">
                    <div>
                        <p class="text-[10px] text-emerald-100 uppercase tracking-wider">Ahlan Wa Sahlan</p>
                        <h2 id="userName" class="font-bold text-sm leading-tight">Pengguna</h2>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button onclick="toggleDarkMode()" id="themeBtn" class="bg-white/20 p-2 rounded-xl backdrop-blur-sm shadow-inner border border-white/10 hover:bg-white/30 transition"></button>
                </div>
            </div>

            <div class="flex justify-between items-end mb-4 relative z-10">
                <div>
                    <h1 class="text-2xl font-bold tracking-tight">Jurnal Ibadah</h1>
                    <div class="flex items-center gap-2 mt-1">
                        <button onclick="getLocation()" class="flex items-center gap-1 text-[10px] bg-black/20 px-2 py-1 rounded-md hover:bg-black/30 transition border border-white/5">
                            <i data-lucide="map-pin" class="w-3 h-3 text-emerald-300"></i>
                            <span id="locationText">Mencari Lokasi...</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="flex flex-col gap-2 mb-4 relative z-10">
                <div class="flex justify-between items-center bg-black/20 dark:bg-black/40 p-2 rounded-xl backdrop-blur-md border border-white/10 shadow-lg">
                    <button onclick="changeDate(-1)" class="p-1.5 hover:bg-white/10 rounded-lg transition text-white"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
                    <div class="text-center">
                        <span id="dateDisplay" class="font-bold text-sm block">Loading...</span>
                        <span id="hijriDisplay" class="text-[10px] text-emerald-200 font-medium block">...</span>
                    </div>
                    <button onclick="changeDate(1)" class="p-1.5 hover:bg-white/10 rounded-lg transition text-white"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
                </div>
                <button id="resetDateBtn" onclick="resetToToday()" class="hidden mx-auto text-[10px] bg-white/20 hover:bg-white/30 text-emerald-50 py-1 px-3 rounded-full border border-white/10">Kembali ke Hari Ini</button>
            </div>

            <div id="progressContainer">
                <div class="flex justify-between text-xs mb-1.5 text-emerald-50 font-medium">
                    <span>Target Harian</span>
                    <span id="progressText">0%</span>
                </div>
                <div class="w-full bg-black/20 rounded-full h-2 overflow-hidden backdrop-blur-sm">
                    <div id="progressBar" class="h-full rounded-full transition-all duration-1000 ease-out bg-emerald-300" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <div class="flex-1 px-5 py-6 overflow-y-auto bg-slate-50 dark:bg-slate-950 relative hidden-force" id="mainContent">
            <div id="dataLoading" class="absolute inset-0 bg-white/80 dark:bg-slate-950/80 z-20 flex flex-col items-center justify-center backdrop-blur-[2px] hidden">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-emerald-600"></div>
                <p class="text-xs text-slate-500 mt-2">Menyinkronkan Data...</p>
            </div>
            <div id="prayerList" class="space-y-3 pb-20"></div>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('PWA Error:', err));
            });
        }
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
