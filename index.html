<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Jurnal Ibadah</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { slate: { 850: '#1e293b' } } } }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="shortcut icon" href="favicon/favicon.ico">
    
    <link rel="stylesheet" href="style.css">
    
    <style>
        #mainContent { -webkit-overflow-scrolling: touch; scrollbar-width: none; }
        #mainContent::-webkit-scrollbar { display: none; }
        body { margin: 0; padding: 0; }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 flex justify-center items-center h-[100dvh] text-slate-800 dark:text-slate-200 transition-colors duration-300 overflow-hidden relative">

    <div id="splashScreen" class="fixed inset-0 z-[100] bg-slate-100 dark:bg-slate-950 flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="relative">
            <div class="w-16 h-16 border-4 border-slate-200 dark:border-slate-800 rounded-full"></div>
            <div class="absolute top-0 w-16 h-16 border-4 border-emerald-500 rounded-full border-t-transparent animate-spin"></div>
            <div class="absolute inset-0 flex items-center justify-center">
                <img src="logo.png" class="w-10 h-10 rounded-full object-cover shadow-sm animate-pulse" alt="Logo">
            </div>
        </div>
        <p class="mt-4 text-sm font-medium text-slate-500 dark:text-slate-400 animate-pulse tracking-widest">MEMUAT...</p>
    </div>

    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="blob w-96 h-96 bg-emerald-400/20 rounded-full top-[-10%] right-[-20%] delay-2000 blur-3xl"></div>
        <div class="blob w-96 h-96 bg-teal-500/20 rounded-full bottom-[-10%] left-[-20%] delay-4000 blur-3xl"></div>
        <div class="blob w-64 h-64 bg-yellow-300/10 rounded-full top-[40%] left-[20%] blur-3xl"></div>
    </div>

    <div class="relative z-10 w-full h-full md:max-w-6xl md:h-[90vh] md:rounded-[2.5rem] md:border md:border-white/40 md:dark:border-slate-700/30 md:shadow-2xl md:backdrop-blur-xl bg-white/60 dark:bg-slate-900/60 overflow-hidden flex transition-all duration-500">

        <div class="hidden md:flex flex-col w-64 border-r border-white/20 dark:border-slate-700/30 p-6 bg-white/20 dark:bg-slate-800/20 backdrop-blur-md">
            <div class="flex items-center gap-3 mb-10 px-2">
                <img src="logo.png" class="w-10 h-10 rounded-full object-cover shadow-sm">
                <div>
                    <h1 class="font-bold text-lg leading-none text-slate-800 dark:text-white">Jurnal</h1>
                    <p class="text-[10px] text-emerald-600 dark:text-emerald-400 font-medium tracking-widest uppercase">Ibadah App</p>
                </div>
            </div>

            <div class="space-y-2 flex-1">
                <button onclick="goHome()" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/40 dark:hover:bg-white/10 transition text-sm font-medium text-slate-700 dark:text-slate-200 group">
                    <i data-lucide="layout-dashboard" class="w-5 h-5 text-slate-400 group-hover:text-emerald-500 transition"></i>
                    Dashboard
                </button>
                <button onclick="openTracker()" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/40 dark:hover:bg-white/10 transition text-sm font-medium text-slate-700 dark:text-slate-200 group">
                    <i data-lucide="list-checks" class="w-5 h-5 text-slate-400 group-hover:text-emerald-500 transition"></i>
                    Jurnal Harian
                </button>
                <button onclick="openTasbih()" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/40 dark:hover:bg-white/10 transition text-sm font-medium text-slate-700 dark:text-slate-200 group">
                    <i data-lucide="grip" class="w-5 h-5 text-slate-400 group-hover:text-blue-500 transition"></i>
                    Tasbih Digital
                </button>
                <button onclick="openProfile()" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/40 dark:hover:bg-white/10 transition text-sm font-medium text-slate-700 dark:text-slate-200 group">
                    <i data-lucide="user" class="w-5 h-5 text-slate-400 group-hover:text-amber-500 transition"></i>
                    Profil & Statistik
                </button>
            </div>
        </div>

        <div class="flex-1 relative h-full overflow-hidden flex flex-col" id="appContainer">
            
            <div id="appHeader" class="bg-gradient-to-br from-emerald-600/90 to-teal-700/90 dark:from-emerald-900/90 dark:to-teal-950/90 backdrop-blur-md text-white 
                pt-[calc(1.5rem+env(safe-area-inset-top))] px-6 pb-8 
                md:rounded-none md:pt-8 shadow-lg z-20 relative shrink-0 transition-all duration-300 hidden-force">
                
                <div class="flex justify-between items-center mb-6">
                    <button onclick="goHome()" class="flex items-center gap-3 cursor-pointer hover:opacity-80 transition group bg-white/10 px-3 py-2 rounded-full border border-white/10 backdrop-blur-sm">
                        <i data-lucide="arrow-left" class="w-5 h-5"></i>
                        <span class="text-sm font-bold pr-1">Kembali</span>
                    </button>
                    <h2 class="text-sm font-bold uppercase tracking-widest opacity-80">Jurnal Harian</h2>
                </div>

                <div class="flex flex-col gap-2 mb-4">
                    <div class="flex justify-between items-center bg-black/20 p-2 rounded-xl backdrop-blur-md border border-white/10 shadow-lg">
                        <button onclick="changeDate(-1)" class="p-1.5 hover:bg-white/10 rounded-lg transition text-white"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
                        <div class="text-center">
                            <span id="dateDisplay" class="font-bold text-sm block">Loading...</span>
                            <span id="hijriDisplay" class="text-[10px] text-emerald-200 font-medium block">...</span>
                        </div>
                        <button onclick="changeDate(1)" class="p-1.5 hover:bg-white/10 rounded-lg transition text-white"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
                    </div>
                    <button id="resetDateBtn" onclick="resetToToday()" class="hidden mx-auto text-[10px] bg-white/20 hover:bg-white/30 text-emerald-50 py-1 px-3 rounded-full border border-white/10 backdrop-blur-sm">Kembali ke Hari Ini</button>
                </div>

                <div id="progressContainer">
                    <div class="flex justify-between text-xs mb-1.5 text-emerald-50 font-medium">
                        <span>Target Harian</span>
                        <span id="progressText">0%</span>
                    </div>
                    <div class="w-full bg-black/20 rounded-full h-2 overflow-hidden backdrop-blur-sm">
                        <div id="progressBar" class="h-full rounded-full transition-all duration-1000 ease-out bg-emerald-300" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <div class="flex-1 px-5 py-6 overflow-y-auto relative hidden-force scroll-smooth min-h-0" id="mainContent">
                <div id="dataLoading" class="absolute inset-0 z-20 flex flex-col items-center justify-center bg-white/50 dark:bg-slate-900/50 backdrop-blur-sm hidden">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-emerald-600"></div>
                </div>
                <div id="prayerList" class="space-y-3 pb-[calc(8rem+env(safe-area-inset-bottom))]"></div>
            </div>

        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(console.error); });
        }
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
