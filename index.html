<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jurnal Ibadah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { slate: { 850: '#1e293b' } } } }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="https://img.icons8.com/fluency/192/mosque.png">
    
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* Memastikan scroll lancar di iOS */
        #mainContent {
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none; /* Sembunyikan scrollbar biar bersih */
        }
        #mainContent::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 flex justify-center h-[100dvh] text-slate-800 dark:text-slate-200 transition-colors duration-300 overflow-hidden relative">

    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="blob w-96 h-96 bg-emerald-400/20 rounded-full top-[-10%] right-[-20%] delay-2000 blur-3xl"></div>
        <div class="blob w-96 h-96 bg-teal-500/20 rounded-full bottom-[-10%] left-[-20%] delay-4000 blur-3xl"></div>
        <div class="blob w-64 h-64 bg-yellow-300/10 rounded-full top-[40%] left-[20%] blur-3xl"></div>
    </div>

    <div id="appContainer" class="relative z-10 w-full max-w-md h-[100dvh] sm:h-auto sm:min-h-[90vh] sm:rounded-[2.5rem] sm:my-8 flex flex-col overflow-hidden transition-all duration-300
        bg-white/60 dark:bg-slate-900/60 backdrop-blur-xl border border-white/40 dark:border-slate-700/30 shadow-2xl">
        
        <div id="loginOverlay" class="absolute inset-0 z-50 flex flex-col items-center justify-center p-8 transition-all duration-500 bg-white/40 dark:bg-slate-900/40 backdrop-blur-md">
            <div class="w-full bg-white/70 dark:bg-slate-900/70 border border-white/50 dark:border-slate-700/50 shadow-xl rounded-3xl p-8 flex flex-col items-center text-center">
                <span class="text-[10px] font-bold tracking-widest text-emerald-600 dark:text-emerald-400 uppercase mb-6 bg-emerald-100/50 dark:bg-emerald-900/30 px-3 py-1 rounded-full border border-emerald-200/50">
                    Assalamu'alaikum
                </span>
                <div class="relative mb-6 group">
                    <div class="absolute inset-0 bg-emerald-500 blur-xl opacity-20 group-hover:opacity-40 transition duration-500 rounded-full"></div>
                    <div class="relative bg-gradient-to-br from-emerald-500 to-teal-600 p-5 rounded-2xl shadow-lg transform group-hover:scale-110 transition duration-300">
                        <i data-lucide="mosque" class="w-10 h-10 text-white"></i>
                    </div>
                </div>
                <h1 class="text-3xl font-bold text-slate-800 dark:text-white mb-2">Jurnal Ibadah</h1>
                <p class="text-slate-500 dark:text-slate-400 text-sm mb-8 leading-relaxed">"Catat ibadahmu, raih keberkahan-Nya."</p>
                <button id="googleLoginBtn" class="w-full bg-white dark:bg-slate-800 border-2 border-slate-100 dark:border-slate-700 hover:border-emerald-500 dark:hover:border-emerald-500 text-slate-700 dark:text-slate-200 font-bold py-3.5 px-4 rounded-xl transition-all shadow-sm hover:shadow-emerald-500/20 active:scale-95 flex items-center justify-center gap-3">
                    <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="currentColor" d="M21.35 11.1h-9.17v2.73h6.51c-.33 3.81-3.5 5.44-6.5 5.44C8.36 19.27 5 16.25 5 12c0-4.1 3.2-7.27 7.2-7.27 3.09 0 4.9 1.97 4.9 1.97L19 4.72S16.56 2 12.1 2C6.42 2 2.03 6.8 2.03 12c0 5.05 4.13 10 10.22 10 5.35 0 9.25-3.67 9.25-9.09 0-1.15-.15-1.81-.15-1.81Z"/></svg>
                    <span>Masuk dengan Google</span>
                </button>
                <p id="loginStatus" class="mt-4 text-xs text-emerald-600 animate-pulse hidden">Menghubungkan...</p>
                <p id="errorMsg" class="mt-2 text-xs text-red-500 hidden"></p>
            </div>
        </div>

        <div id="appHeader" class="bg-gradient-to-br from-emerald-600/90 to-teal-700/90 dark:from-emerald-900/90 dark:to-teal-950/90 backdrop-blur-md text-white p-6 pb-8 rounded-b-[2.5rem] shadow-lg z-20 relative shrink-0 transition-all duration-300 hidden-force">
            <div class="flex justify-between items-center mb-6">
                <div onclick="openProfile()" class="flex items-center gap-3 cursor-pointer hover:opacity-80 transition group">
                    <img id="userPhoto" src="" alt="Profile" class="w-10 h-10 rounded-full border-2 border-white/30 shadow-sm bg-white/20 group-hover:scale-105 transition">
                    <div>
                        <p class="text-[10px] text-emerald-100 uppercase tracking-wider">Ahlan Wa Sahlan</p>
                        <h2 id="userName" class="font-bold text-sm leading-tight">Pengguna</h2>
                    </div>
                </div>
                <button onclick="toggleDarkMode()" id="themeBtn" class="bg-white/20 p-2 rounded-xl backdrop-blur-sm shadow-inner border border-white/10 hover:bg-white/30 transition"></button>
            </div>

            <div class="flex justify-between items-end mb-4">
                <div>
                    <h1 class="text-2xl font-bold tracking-tight">Jurnal Ibadah</h1>
                    <div class="flex items-center gap-2 mt-1">
                        <button onclick="getLocation()" class="flex items-center gap-1 text-[10px] bg-black/20 px-2 py-1 rounded-md hover:bg-black/30 transition border border-white/5 backdrop-blur-sm">
                            <i data-lucide="map-pin" class="w-3 h-3 text-emerald-300"></i>
                            <span id="locationText">Mencari Lokasi...</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="flex flex-col gap-2 mb-4">
                <div class="flex justify-between items-center bg-black/20 p-2 rounded-xl backdrop-blur-md border border-white/10 shadow-lg">
                    <button onclick="changeDate(-1)" class="p-1.5 hover:bg-white/10 rounded-lg transition text-white"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
                    <div class="text-center">
                        <span id="dateDisplay" class="font-bold text-sm block">Loading...</span>
                        <span id="hijriDisplay" class="text-[10px] text-emerald-200 font-medium block">...</span>
                    </div>
                    <button onclick="changeDate(1)" class="p-1.5 hover:bg-white/10 rounded-lg transition text-white"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
                </div>
                <button id="resetDateBtn" onclick="resetToToday()" class="hidden mx-auto text-[10px] bg-white/20 hover:bg-white/30 text-emerald-50 py-1 px-3 rounded-full border border-white/10 backdrop-blur-sm">Kembali ke Hari Ini</button>
            </div>

            <div id="progressContainer">
                <div class="flex justify-between text-xs mb-1.5 text-emerald-50 font-medium">
                    <span>Target Harian</span>
                    <span id="progressText">0%</span>
                </div>
                <div class="w-full bg-black/20 rounded-full h-2 overflow-hidden backdrop-blur-sm">
                    <div id="progressBar" class="h-full rounded-full transition-all duration-1000 ease-out bg-emerald-300" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <div class="flex-1 px-5 py-6 overflow-y-auto relative hidden-force scroll-smooth" id="mainContent">
            <div id="dataLoading" class="absolute inset-0 z-20 flex flex-col items-center justify-center bg-white/50 dark:bg-slate-900/50 backdrop-blur-sm hidden">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-emerald-600"></div>
            </div>
            
            <div id="prayerList" class="space-y-3 pb-32"></div>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(console.error); });
        }
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
