<div id="asmaulHusnaView" class="hidden-force flex flex-col h-full absolute inset-0 z-50 transition-all duration-300 overflow-y-auto bg-slate-100 dark:bg-slate-950 no-scrollbar">
    
    <div class="fixed top-0 left-0 right-0 h-80 bg-gradient-to-b from-emerald-500/10 via-emerald-500/5 to-transparent pointer-events-none z-0"></div>

    <div id="asmaHeader" class="sticky top-0 z-50 px-5 pt-[calc(1.5rem+env(safe-area-inset-top))] pb-3 md:px-8 md:pt-6">
        <div class="glass-pill flex items-center justify-between p-2 rounded-full bg-white/70 dark:bg-slate-900/70 backdrop-blur-xl border border-white/40 dark:border-slate-700/50 shadow-sm w-full max-w-7xl mx-auto">
            <button onclick="vibrateSoft(); goBack()" class="w-10 h-10 rounded-full flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-black/5 dark:hover:bg-white/10 transition active:scale-90 group">
                <i data-lucide="arrow-left" class="w-5 h-5 group-hover:-translate-x-0.5 transition"></i>
            </button>
            <h2 class="text-sm font-bold text-slate-800 dark:text-white tracking-tight text-center flex-1 truncate px-2">Asmaul Husna</h2>
            <div class="w-10"></div> 
        </div>
    </div>

    <div class="relative z-10 w-full mx-auto">
        
        <div id="asmaSearchContainer" class="sticky top-[85px] z-40 px-5 pt-2 pb-4 md:px-8 md:max-w-7xl md:mx-auto md:w-full transition-transform duration-500 ease-in-out will-change-transform">
            <div id="asmaSearchWrapper" class="relative group" style="will-change: transform;">
                <div class="relative bg-white/80 dark:bg-slate-900/80 backdrop-blur-md rounded-[1.8rem] border border-white dark:border-slate-800 flex items-center px-5 py-4 transition-all duration-300 group-focus-within:ring-4 group-focus-within:ring-emerald-500/10 shadow-sm">
                    <i data-lucide="search" class="w-5 h-5 text-slate-400 group-focus-within:text-emerald-500 transition-colors"></i>
                    <input type="text" id="asmaSearchInput" onkeyup="searchAsma(this.value)" placeholder="Cari nama Allah..." class="w-full bg-transparent border-none focus:ring-0 text-sm font-bold text-slate-700 dark:text-white placeholder:text-slate-400 ml-4 outline-none">
                </div>
            </div>
        </div>

        <div class="px-5 pb-4 scroll-smooth no-scrollbar md:px-8 max-w-7xl mx-auto" id="asmaListContainer">
            <div id="asmaList" class="space-y-3 md:grid md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 md:gap-4 md:space-y-0">
                </div>
        </div>
    </div>
    
    <div id="asmaDetailModal" class="fixed inset-0 z-[200] flex items-end sm:items-center justify-center invisible pointer-events-none p-0 sm:p-6">
        <div id="asmaBackdrop" class="absolute inset-0 bg-slate-950/60 backdrop-blur-md opacity-0 transition-opacity duration-500 ease-in-out" onclick="closeAsmaDetail()"></div>
        
        <div id="asmaDetailContent" class="relative w-full sm:w-full sm:max-w-2xl md:max-w-3xl max-h-[90vh] md:max-h-[80vh] flex flex-col bg-white dark:bg-slate-950 rounded-t-[3rem] sm:rounded-[3rem] shadow-2xl border border-white/20 dark:border-slate-800 transform translate-y-full transition-transform duration-500 ease-[cubic-bezier(0.32,0.72,0,1)] overflow-hidden">
            
            <div class="w-12 h-1.5 bg-slate-200 dark:bg-slate-800 rounded-full mx-auto mt-6 mb-2 shrink-0 sm:hidden"></div>
            
            <div class="absolute top-5 right-6 z-20">
                <button onclick="vibrateSoft(); closeAsmaDetail()" class="w-10 h-10 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center text-slate-500 hover:text-rose-500 transition active:scale-90 shadow-sm shrink-0">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="flex-1 overflow-y-auto p-6 md:p-10 no-scrollbar relative flex flex-col items-center">
                <div class="absolute top-0 left-1/2 -translate-x-1/2 w-64 h-64 bg-emerald-500/10 rounded-full blur-3xl -mt-10 pointer-events-none"></div>
                
                <div class="relative z-10 mb-6 md:mb-8">
                    <div class="w-16 h-16 md:w-20 md:h-20 rounded-[2rem] bg-emerald-50 dark:bg-emerald-900/30 flex items-center justify-center border-4 border-white dark:border-slate-800 shadow-lg">
                        <span id="detailNumber" class="text-2xl md:text-3xl font-black text-emerald-600 dark:text-emerald-400">1</span>
                    </div>
                </div>

                <div class="w-full grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-10 items-center relative z-10">
                    
                    <div class="flex flex-col items-center justify-center">
                        <div class="p-6 md:p-8 rounded-[2.5rem] bg-emerald-500/[0.03] border border-emerald-500/10 w-full flex items-center justify-center shadow-inner">
                            <h2 id="detailArabic" class="font-quran text-5xl md:text-6xl text-slate-800 dark:text-white leading-tight">...</h2>
                        </div>
                    </div>

                    <div class="flex flex-col text-center md:text-left space-y-3">
                        <div>
                            <h3 id="detailLatin" class="text-3xl md:text-4xl font-black text-emerald-600 dark:text-emerald-400 tracking-tight leading-tight">...</h3>
                            <div class="h-1 w-16 bg-emerald-200 dark:bg-emerald-800 mx-auto md:mx-0 mt-3 mb-1 rounded-full"></div>
                        </div>
                        
                        <div class="w-full">
                            <p id="detailMeaning" class="text-base md:text-lg font-medium text-slate-500 dark:text-slate-400 leading-relaxed">...</p>
                        </div>
                    </div>

                </div>
            </div>

            <div class="p-5 md:px-10 md:pb-8 bg-slate-50/50 dark:bg-slate-900/30 border-t border-slate-100 dark:border-slate-800 shrink-0">
                <div class="flex items-center justify-between gap-4 max-w-lg mx-auto md:max-w-none">
                    <button onclick="vibrateSoft(); changeAsma(-1)" id="btnPrevAsma" class="flex-1 py-3.5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 font-bold text-xs md:text-sm hover:border-emerald-500/30 transition-all active:scale-95 disabled:opacity-30 flex items-center justify-center gap-2 group shadow-sm">
                        <i data-lucide="chevron-left" class="w-4 h-4 md:w-5 md:h-5 group-hover:-translate-x-1 transition"></i> Sebelumnya
                    </button>
                    <button onclick="vibrateSoft(); changeAsma(1)" id="btnNextAsma" class="flex-1 py-3.5 rounded-2xl bg-emerald-500 text-white font-bold text-xs md:text-sm shadow-xl shadow-emerald-500/20 hover:bg-emerald-600 transition-all active:scale-95 disabled:opacity-30 flex items-center justify-center gap-2 group">
                        Selanjutnya <i data-lucide="chevron-right" class="w-4 h-4 md:w-5 md:h-5 group-hover:translate-x-1 transition"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
