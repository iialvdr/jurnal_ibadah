<div id="asmaulHusnaView" class="hidden-force flex flex-col h-full absolute inset-0 z-50 transition-all duration-300 overflow-hidden bg-slate-100 dark:bg-slate-950">

        <button onclick="goBack()" class="w-11 h-11 rounded-2xl bg-white dark:bg-slate-900 flex items-center justify-center text-slate-500 dark:text-slate-400 shadow-sm border border-slate-200 dark:border-slate-800 active:scale-95 transition hover:text-emerald-600 group"><i data-lucide="arrow-left" class="w-5 h-5 group-hover:-translate-x-0.5 transition"></i></button>
        <h2 class="text-xl font-black text-slate-800 dark:text-white tracking-tight">Asmaul Husna</h2>
        <div class="w-11"></div> 
    </div>

    <div class="px-6 pt-4 pb-2 z-20 transition-all duration-300">
        <div class="relative group" style="transform: translate3d(0,0,0);">
            <div class="relative bg-white dark:bg-slate-900 rounded-[1.5rem] shadow-sm border border-slate-200 dark:border-slate-800 flex items-center px-4 py-3.5 transition-colors duration-200 ease-out group-focus-within:border-emerald-500 hover:border-emerald-300 dark:hover:border-emerald-700">
                <i data-lucide="search" class="w-5 h-5 text-slate-400 group-focus-within:text-emerald-500 transition-colors"></i>
                <input type="text" id="asmaSearchInput" onkeyup="searchAsma(this.value)" placeholder="Cari nama Allah..." class="w-full bg-transparent border-none focus:ring-0 text-sm font-bold text-slate-700 dark:text-white placeholder:text-slate-400 ml-3 h-full outline-none">
            </div>
        </div>
    </div>

    <div class="flex-1 overflow-y-auto p-6 pt-2 space-y-2 scroll-smooth pb-32 no-scrollbar" id="asmaListContainer" style="transform: translate3d(0,0,0); backface-visibility: hidden; will-change: transform;">
        <div id="asmaList" class="space-y-2">
            <div class="animate-pulse bg-white dark:bg-slate-900 p-4 rounded-[1.5rem] border border-slate-200 dark:border-slate-800 flex items-center gap-4"><div class="w-12 h-12 rounded-2xl bg-slate-200 dark:bg-slate-800 shrink-0"></div><div class="flex-1 space-y-2"><div class="h-3 bg-slate-200 dark:bg-slate-800 rounded w-24"></div><div class="h-2 bg-slate-200 dark:bg-slate-800 rounded w-16"></div></div></div>
            <div class="animate-pulse bg-white dark:bg-slate-900 p-4 rounded-[1.5rem] border border-slate-200 dark:border-slate-800 flex items-center gap-4"><div class="w-12 h-12 rounded-2xl bg-slate-200 dark:bg-slate-800 shrink-0"></div><div class="flex-1 space-y-2"><div class="h-3 bg-slate-200 dark:bg-slate-800 rounded w-20"></div><div class="h-2 bg-slate-200 dark:bg-slate-800 rounded w-12"></div></div></div>
            <div class="animate-pulse bg-white dark:bg-slate-900 p-4 rounded-[1.5rem] border border-slate-200 dark:border-slate-800 flex items-center gap-4"><div class="w-12 h-12 rounded-2xl bg-slate-200 dark:bg-slate-800 shrink-0"></div><div class="flex-1 space-y-2"><div class="h-3 bg-slate-200 dark:bg-slate-800 rounded w-28"></div><div class="h-2 bg-slate-200 dark:bg-slate-800 rounded w-14"></div></div></div>
            <div class="animate-pulse bg-white dark:bg-slate-900 p-4 rounded-[1.5rem] border border-slate-200 dark:border-slate-800 flex items-center gap-4"><div class="w-12 h-12 rounded-2xl bg-slate-200 dark:bg-slate-800 shrink-0"></div><div class="flex-1 space-y-2"><div class="h-3 bg-slate-200 dark:bg-slate-800 rounded w-20"></div><div class="h-2 bg-slate-200 dark:bg-slate-800 rounded w-12"></div></div></div>
            <div class="animate-pulse bg-white dark:bg-slate-900 p-4 rounded-[1.5rem] border border-slate-200 dark:border-slate-800 flex items-center gap-4"><div class="w-12 h-12 rounded-2xl bg-slate-200 dark:bg-slate-800 shrink-0"></div><div class="flex-1 space-y-2"><div class="h-3 bg-slate-200 dark:bg-slate-800 rounded w-24"></div><div class="h-2 bg-slate-200 dark:bg-slate-800 rounded w-16"></div></div></div>
            <div class="animate-pulse bg-white dark:bg-slate-900 p-4 rounded-[1.5rem] border border-slate-200 dark:border-slate-800 flex items-center gap-4"><div class="w-12 h-12 rounded-2xl bg-slate-200 dark:bg-slate-800 shrink-0"></div><div class="flex-1 space-y-2"><div class="h-3 bg-slate-200 dark:bg-slate-800 rounded w-20"></div><div class="h-2 bg-slate-200 dark:bg-slate-800 rounded w-12"></div></div></div>
            <div class="animate-pulse bg-white dark:bg-slate-900 p-4 rounded-[1.5rem] border border-slate-200 dark:border-slate-800 flex items-center gap-4"><div class="w-12 h-12 rounded-2xl bg-slate-200 dark:bg-slate-800 shrink-0"></div><div class="flex-1 space-y-2"><div class="h-3 bg-slate-200 dark:bg-slate-800 rounded w-24"></div><div class="h-2 bg-slate-200 dark:bg-slate-800 rounded w-16"></div></div></div>
            <div class="animate-pulse bg-white dark:bg-slate-900 p-4 rounded-[1.5rem] border border-slate-200 dark:border-slate-800 flex items-center gap-4"><div class="w-12 h-12 rounded-2xl bg-slate-200 dark:bg-slate-800 shrink-0"></div><div class="flex-1 space-y-2"><div class="h-3 bg-slate-200 dark:bg-slate-800 rounded w-20"></div><div class="h-2 bg-slate-200 dark:bg-slate-800 rounded w-12"></div></div></div>
        </div>
    </div>

    <div id="asmaDetailModal" class="absolute inset-0 z-[60] flex items-center justify-center bg-slate-900/90 invisible opacity-0 pointer-events-none transition-opacity duration-300 ease-out">
        <div class="bg-white dark:bg-slate-900 w-[85%] max-w-sm p-8 rounded-[2.5rem] shadow-2xl border border-white/20 dark:border-slate-800 transform scale-90 transition-transform duration-300 ease-out will-change-transform relative overflow-hidden" id="asmaDetailContent">
            <div class="absolute top-0 right-0 w-64 h-64 bg-emerald-500/10 rounded-full blur-3xl -mr-20 -mt-20 pointer-events-none"></div>
            <button onclick="closeAsmaDetail()" class="absolute top-6 right-6 p-2 bg-slate-100 dark:bg-slate-800 rounded-full text-slate-500 hover:text-red-500 transition active:scale-90 z-20"><i data-lucide="x" class="w-5 h-5"></i></button>
            <div class="flex flex-col items-center text-center relative z-10 pt-2">
                <div class="w-24 h-24 rounded-full bg-emerald-50 dark:bg-emerald-900/30 flex items-center justify-center mb-6 border-4 border-emerald-100 dark:border-emerald-800/50 shadow-inner"><span id="detailNumber" class="text-3xl font-black text-emerald-600 dark:text-emerald-400">1</span></div>
                <h2 id="detailArabic" class="font-quran text-6xl mb-4 text-slate-800 dark:text-white drop-shadow-sm leading-relaxed">...</h2>
                <h3 id="detailLatin" class="text-2xl font-black text-emerald-600 dark:text-emerald-400 mb-3 tracking-tight">...</h3>
                <p id="detailMeaning" class="text-base font-medium text-slate-500 dark:text-slate-400 leading-relaxed px-2 mb-6">...</p>
                <div class="flex items-center justify-between w-full gap-4 mt-2">
                    <button onclick="vibrateSoft(); changeAsma(-1)" id="btnPrevAsma" class="flex-1 py-3.5 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-bold text-xs hover:bg-slate-200 dark:hover:bg-slate-700 transition active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 group"><i data-lucide="chevron-left" class="w-4 h-4 group-hover:-translate-x-0.5 transition"></i> Sebelumnya</button>
                    <button onclick="vibrateSoft(); changeAsma(1)" id="btnNextAsma" class="flex-1 py-3.5 rounded-2xl bg-emerald-500 text-white font-bold text-xs shadow-lg shadow-emerald-500/30 hover:bg-emerald-600 transition active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 group">Selanjutnya <i data-lucide="chevron-right" class="w-4 h-4 group-hover:translate-x-0.5 transition"></i></button>
