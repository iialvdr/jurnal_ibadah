<div id="changelogView" class="hidden-force flex flex-col h-full absolute inset-0 z-50 transition-all duration-300 overflow-hidden bg-slate-100 dark:bg-slate-950">
    
    <div class="px-6 pb-4 pt-[calc(2rem+env(safe-area-inset-top))] flex justify-between items-center relative shrink-0 z-30 bg-slate-100/90 dark:bg-slate-950/90 backdrop-blur-md border-b border-slate-200/50 dark:border-slate-800/50">
        <button onclick="goBack()" class="w-11 h-11 rounded-2xl bg-white dark:bg-slate-900 flex items-center justify-center text-slate-500 dark:text-slate-400 shadow-sm border border-slate-200 dark:border-slate-800 active:scale-95 transition hover:text-emerald-600 group">
            <i data-lucide="arrow-left" class="w-5 h-5 group-hover:-translate-x-0.5 transition"></i>
        </button>
        <h2 class="text-xl font-black text-slate-800 dark:text-white tracking-tight">Riwayat Update</h2>
        <div class="w-11"></div> 
    </div>

    <div class="flex-1 overflow-y-auto p-6 scroll-smooth pb-10 custom-scrollbar relative">
        
        <div id="changelogLoading" class="space-y-8 ml-3 border-l-2 border-slate-200 dark:border-slate-800 pl-8 relative">
            <div class="space-y-3">
                <div class="absolute -left-[1.3rem] w-10 h-10 rounded-2xl bg-slate-200 dark:bg-slate-800 border-4 border-slate-100 dark:border-slate-950"></div>
                <div class="h-4 w-24 bg-slate-200 dark:bg-slate-800 rounded"></div>
                <div class="h-32 w-full bg-slate-200 dark:bg-slate-800 rounded-[1.5rem]"></div>
            </div>
            <div class="space-y-3">
                <div class="absolute -left-[1.3rem] w-10 h-10 rounded-2xl bg-slate-200 dark:bg-slate-800 border-4 border-slate-100 dark:border-slate-950"></div>
                <div class="h-4 w-24 bg-slate-200 dark:bg-slate-800 rounded"></div>
                <div class="h-32 w-full bg-slate-200 dark:bg-slate-800 rounded-[1.5rem]"></div>
            </div>
        </div>

        <div class="hidden relative border-l-2 border-slate-200 dark:border-slate-800 ml-3 space-y-8" id="changelogList"></div>

        <div id="changelogEmpty" class="hidden flex-col items-center justify-center pt-20 text-slate-400">
            <i data-lucide="server-off" class="w-12 h-12 mb-3 opacity-50"></i>
            <p class="text-sm font-medium" id="changelogMsg">Memuat data...</p>
        </div>
    </div>
</div>
