<div id="changelogView" class="hidden-force flex flex-col h-full absolute inset-0 z-50 transition-all duration-300 overflow-y-auto bg-slate-100 dark:bg-slate-950 no-scrollbar">
    
    <div class="fixed top-0 left-0 right-0 h-80 bg-gradient-to-b from-emerald-500/10 via-emerald-500/5 to-transparent pointer-events-none z-0"></div>

    <div class="sticky top-0 z-[100] px-5 pt-[calc(1.5rem+env(safe-area-inset-top))] pb-3 md:px-8 md:pt-6">
        <div class="glass-pill flex items-center justify-between p-2 rounded-full bg-white/70 dark:bg-slate-900/70 backdrop-blur-xl border border-white/40 dark:border-slate-700/50 shadow-sm w-full max-w-7xl mx-auto">
            <button onclick="vibrateSoft(); goBack()" class="w-10 h-10 rounded-full flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-black/5 dark:hover:bg-white/10 transition active:scale-90 group">
                <i data-lucide="arrow-left" class="w-5 h-5 group-hover:-translate-x-0.5 transition"></i>
            </button>
            <h2 class="text-sm font-bold text-slate-800 dark:text-white tracking-tight text-center flex-1 truncate px-2">Riwayat Update</h2>
            <div class="w-10"></div> 
        </div>
    </div>

    <div class="relative z-10 px-5 pt-4 pb-12 w-full max-w-7xl mx-auto md:px-8">

        <div class="bento-card mb-6 md:mb-8 relative overflow-hidden rounded-[2rem] bg-white dark:bg-slate-900 p-6 md:p-8 shadow-xl border border-white dark:border-slate-800">
            <div class="absolute top-0 right-0 w-32 h-32 bg-emerald-500/10 rounded-full blur-3xl -mr-10 -mt-10"></div>
            <div class="absolute -left-8 bottom-0 w-28 h-28 bg-teal-500/10 rounded-full blur-3xl"></div>
            <div class="relative z-10 flex flex-col md:flex-row items-center md:items-center gap-5 md:gap-8">
                <div class="w-16 h-16 md:w-20 md:h-20 rounded-2xl bg-emerald-500 text-white flex items-center justify-center shadow-lg shadow-emerald-500/30">
                    <i data-lucide="history" class="w-8 h-8 md:w-9 md:h-9"></i>
                </div>
                <div class="flex-1 text-center md:text-left">
                    <h3 class="text-xl md:text-2xl font-black text-slate-800 dark:text-white tracking-tight">Riwayat Update</h3>
                    <p class="text-xs md:text-sm text-slate-500 dark:text-slate-400 mt-1 max-w-xl">Catatan perubahan dan peningkatan terbaru di Jurnal Ibadah.</p>
                </div>
            </div>
        </div>

        <div id="changelogLoading" class="space-y-6 md:space-y-8 ml-3 border-l-2 border-slate-200 dark:border-slate-800 pl-8 relative">
            <div class="space-y-4">
                <div class="absolute -left-[1.4rem] w-10 h-10 rounded-full bg-slate-200 dark:bg-slate-800 border-4 border-slate-100 dark:border-slate-950 animate-pulse"></div>
                <div class="h-4 w-24 bg-slate-200 dark:bg-slate-800 rounded-full animate-pulse"></div>
                <div class="h-28 w-full bg-white/50 dark:bg-slate-900/50 rounded-[2rem] border border-slate-200 dark:border-slate-800 animate-pulse"></div>
            </div>
            <div class="space-y-4">
                <div class="absolute -left-[1.4rem] w-10 h-10 rounded-full bg-slate-200 dark:bg-slate-800 border-4 border-slate-100 dark:border-slate-950 animate-pulse"></div>
                <div class="h-4 w-24 bg-slate-200 dark:bg-slate-800 rounded-full animate-pulse"></div>
                <div class="h-28 w-full bg-white/50 dark:bg-slate-900/50 rounded-[2rem] border border-slate-200 dark:border-slate-800 animate-pulse"></div>
            </div>
        </div>

        <div class="hidden relative border-l-2 border-emerald-500/20 dark:border-emerald-500/10 ml-3 space-y-8 md:space-y-10 pb-10" id="changelogList">
            </div>

        <div id="changelogEmpty" class="hidden flex flex-col items-center justify-center pt-16 text-slate-400">
            <div class="w-20 h-20 bg-white dark:bg-slate-900 rounded-[2rem] shadow-sm border border-slate-200 dark:border-slate-800 flex items-center justify-center mb-6">
                <i data-lucide="git-branch" class="w-10 h-10 opacity-30"></i>
            </div>
            <p class="text-[10px] font-black uppercase tracking-[0.2em]" id="changelogMsg">Memuat data...</p>
        </div>
    </div>
</div>
