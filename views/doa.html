<div id="doaView" class="hidden-force flex flex-col h-full absolute inset-0 z-50 transition-all duration-300 overflow-hidden bg-slate-100 dark:bg-slate-950">
    
    <div class="px-6 pb-3 pt-[calc(2rem+env(safe-area-inset-top))] flex justify-between items-center relative shrink-0 z-30 bg-slate-100/90 dark:bg-slate-950/90 backdrop-blur-md">
        <button onclick="goBack()" class="w-10 h-10 rounded-xl bg-white dark:bg-slate-900 flex items-center justify-center text-slate-500 dark:text-slate-400 shadow-sm border border-slate-200 dark:border-slate-800 active:scale-95 transition hover:text-emerald-600 group">
            <i data-lucide="arrow-left" class="w-5 h-5 group-hover:-translate-x-0.5 transition"></i>
        </button>
        <h2 class="text-lg font-black text-slate-800 dark:text-white tracking-tight">Kumpulan Doa</h2>
        <div class="w-10"></div> 
    </div>

    <div class="flex-1 relative overflow-hidden flex flex-col">
        
        <div class="px-6 pb-2 pt-1 z-20 space-y-2">
            <div class="relative group">
                <div class="absolute inset-0 bg-emerald-500/20 rounded-xl blur-md opacity-0 group-hover:opacity-100 transition duration-500"></div>
                <div class="relative bg-white dark:bg-slate-900 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 flex items-center px-3 py-2.5 transition group-focus-within:border-emerald-500 group-focus-within:ring-1 group-focus-within:ring-emerald-500/50">
                    <i data-lucide="search" class="w-4 h-4 text-slate-400 group-focus-within:text-emerald-500 transition"></i>
                    <input type="text" id="doaSearchInput" onkeyup="searchDoa(this.value)" placeholder="Cari doa..." class="w-full bg-transparent border-none focus:ring-0 text-xs font-bold text-slate-700 dark:text-white placeholder:text-slate-400 ml-2 h-full outline-none">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2 relative z-30">
                
                <div class="relative" id="filterGrupWrapper">
                    <button onclick="toggleFilter('grup')" id="btnGrupFilter" class="w-full bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 text-[10px] font-bold py-2 px-3 rounded-lg flex justify-between items-center outline-none active:scale-95 transition border border-transparent focus:border-emerald-500">
                        <span id="labelGrup" class="truncate mr-2">Semua Kategori</span>
                        <i data-lucide="chevron-down" class="w-3 h-3 text-slate-500 shrink-0 transition-transform duration-200" id="iconGrup"></i>
                    </button>
                    <div id="listGrup" class="hidden absolute top-full left-0 right-0 mt-1 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl shadow-xl z-50 max-h-40 overflow-y-auto p-1 origin-top animate-[zoomIn_0.1s_ease-out]">
                        </div>
                </div>

                <div class="relative" id="filterTagWrapper">
                    <button onclick="toggleFilter('tag')" id="btnTagFilter" class="w-full bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 text-[10px] font-bold py-2 px-3 rounded-lg flex justify-between items-center outline-none active:scale-95 transition border border-transparent focus:border-emerald-500">
                        <span id="labelTag" class="truncate mr-2">Semua Tag</span>
                        <i data-lucide="chevron-down" class="w-3 h-3 text-slate-500 shrink-0 transition-transform duration-200" id="iconTag"></i>
                    </button>
                    <div id="listTag" class="hidden absolute top-full left-0 right-0 mt-1 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl shadow-xl z-50 max-h-40 overflow-y-auto p-1 origin-top animate-[zoomIn_0.1s_ease-out]">
                        </div>
                </div>
            </div>
        </div>

        <div id="doaLoading" class="hidden absolute inset-0 top-24 z-10 flex flex-col items-center justify-center bg-slate-100/50 dark:bg-slate-950/50 backdrop-blur-sm">
            <div class="animate-spin rounded-full h-6 w-6 border-2 border-slate-200 border-t-emerald-500 mb-2"></div>
            <p class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Mengambil Data...</p>
        </div>
        
        <div id="doaListContainer" class="flex-1 overflow-y-auto p-6 pt-2 space-y-2 scroll-smooth pb-32">
            </div>
    </div>

    <div id="doaDetailModal" class="absolute inset-0 z-[60] flex items-end sm:items-center justify-center bg-slate-900/60 backdrop-blur-sm hidden-force opacity-0 transition-all duration-300">
        <div class="bg-white dark:bg-slate-900 w-full sm:w-[90%] sm:max-w-md h-[85%] sm:h-auto sm:max-h-[80%] flex flex-col rounded-t-[2.5rem] sm:rounded-[2rem] shadow-2xl border-t sm:border border-white/20 dark:border-slate-800 transform translate-y-full sm:translate-y-20 transition-all duration-300" id="doaDetailContent">
            
            <div class="px-6 py-4 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center shrink-0">
                <h3 id="modalDoaTitle" class="text-lg font-black text-slate-800 dark:text-white truncate pr-4">Detail Doa</h3>
                <button onclick="closeDoaDetail()" class="p-2 bg-slate-100 dark:bg-slate-800 rounded-full text-slate-500 hover:text-red-500 transition active:scale-90">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="flex-1 overflow-y-auto p-6 space-y-6 custom-scrollbar">
                <div class="text-center space-y-4">
                    <p id="modalDoaArab" class="font-quran text-3xl leading-[2.6] text-slate-800 dark:text-white" dir="rtl">...</p>
                </div>
                
                <div class="space-y-4 bg-slate-50 dark:bg-slate-800/50 p-5 rounded-2xl border border-slate-100 dark:border-slate-800">
                    <div>
                        <p class="text-[10px] font-bold text-emerald-600 dark:text-emerald-400 uppercase tracking-wider mb-1">Latin</p>
                        <p id="modalDoaLatin" class="text-sm font-medium text-slate-600 dark:text-slate-300 italic leading-relaxed">...</p>
                    </div>
                    <div>
                        <p class="text-[10px] font-bold text-emerald-600 dark:text-emerald-400 uppercase tracking-wider mb-1">Artinya</p>
                        <p id="modalDoaIndo" class="text-sm text-slate-700 dark:text-slate-200 leading-relaxed">...</p>
                    </div>
                    <div id="modalDoaSource" class="pt-2 border-t border-slate-200 dark:border-slate-700 hidden">
                        <p class="text-[10px] text-slate-400 font-medium">Riwayat: -</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
