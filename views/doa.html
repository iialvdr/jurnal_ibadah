<div id="doaView" class="hidden-force flex flex-col h-full absolute inset-0 z-50 transition-all duration-300 overflow-y-auto bg-slate-100 dark:bg-slate-950 no-scrollbar">
    
    <div class="fixed top-0 left-0 right-0 h-80 bg-gradient-to-b from-emerald-500/10 via-emerald-500/5 to-transparent pointer-events-none z-0"></div>

    <div id="doaHeader" class="sticky top-0 z-50 px-5 pt-[calc(1.5rem+env(safe-area-inset-top))] pb-3 md:px-8 md:pt-6">
        <div class="glass-pill flex items-center justify-between p-2 rounded-full bg-white/70 dark:bg-slate-900/70 backdrop-blur-xl border border-white/40 dark:border-slate-700/50 shadow-sm w-full max-w-7xl mx-auto">
            <button onclick="vibrateSoft(); goBack()" class="w-10 h-10 rounded-full flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-black/5 dark:hover:bg-white/10 transition active:scale-90 group">
                <i data-lucide="arrow-left" class="w-5 h-5 group-hover:-translate-x-0.5 transition"></i>
            </button>
            <h2 class="text-sm font-bold text-slate-800 dark:text-white tracking-tight text-center flex-1 truncate px-2">Kumpulan Doa</h2>
            <div class="w-10"></div> 
        </div>
    </div>

    <div class="flex-1 relative z-10">
        
        <div id="doaSearchContainer" class="sticky top-[85px] z-40 px-5 pt-2 pb-4 space-y-4 md:px-8 md:max-w-7xl md:mx-auto md:w-full transition-transform duration-500 ease-in-out will-change-transform">
            
            <div id="doaSearchWrapper" class="relative group" style="will-change: transform;">
                <div class="relative bg-white/80 dark:bg-slate-900/80 backdrop-blur-md rounded-[1.8rem] border border-white dark:border-slate-800 flex items-center px-5 py-4 transition-all duration-300 group-focus-within:ring-4 group-focus-within:ring-emerald-500/10 shadow-sm">
                    <i data-lucide="search" class="w-5 h-5 text-slate-400 group-focus-within:text-emerald-500 transition-colors"></i>
                    <input type="text" id="doaSearchInput" onkeyup="searchDoa(this.value)" placeholder="Cari doa sehari-hari..." class="w-full bg-transparent border-none focus:ring-0 text-sm font-bold text-slate-700 dark:text-white placeholder:text-slate-400 ml-4 outline-none">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3 relative z-30">
                <div class="relative" id="filterGrupWrapper">
                    <button type="button" onclick="vibrateSoft(); toggleFilter(event, 'grup')" id="btnGrupFilter" class="w-full bg-white/60 dark:bg-slate-900/60 backdrop-blur-sm text-slate-600 dark:text-slate-300 text-[11px] font-bold py-3.5 px-5 rounded-2xl flex justify-between items-center outline-none active:scale-95 transition border border-white/50 dark:border-slate-800 hover:bg-white dark:hover:bg-slate-800">
                        <span id="labelGrup" class="truncate mr-2">Kategori</span>
                        <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 shrink-0 transition-transform duration-300" id="iconGrup"></i>
                    </button>
                    <div id="listGrup" class="hidden absolute top-full left-0 right-0 mt-3 bg-white/95 dark:bg-slate-900/95 backdrop-blur-xl border border-white dark:border-slate-800 rounded-2xl shadow-2xl z-50 max-h-64 overflow-y-auto p-2 origin-top transition-all duration-300 opacity-0 scale-95 no-scrollbar"></div>
                </div>

                <div class="relative" id="filterTagWrapper">
                    <button type="button" onclick="vibrateSoft(); toggleFilter(event, 'tag')" id="btnTagFilter" class="w-full bg-white/60 dark:bg-slate-900/60 backdrop-blur-sm text-slate-600 dark:text-slate-300 text-[11px] font-bold py-3.5 px-5 rounded-2xl flex justify-between items-center outline-none active:scale-95 transition border border-white/50 dark:border-slate-800 hover:bg-white dark:hover:bg-slate-800">
                        <span id="labelTag" class="truncate mr-2">Tagar</span>
                        <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 shrink-0 transition-transform duration-300" id="iconTag"></i>
                    </button>
                    <div id="listTag" class="hidden absolute top-full left-0 right-0 mt-3 bg-white/95 dark:bg-slate-900/95 backdrop-blur-xl border border-white dark:border-slate-800 rounded-2xl shadow-2xl z-50 max-h-64 overflow-y-auto p-2 origin-top transition-all duration-300 opacity-0 scale-95 no-scrollbar"></div>
                </div>
            </div>
        </div>

        <div id="doaLoading" class="hidden-force space-y-3 px-5 pt-2 pb-4 md:px-8 md:grid md:grid-cols-2 lg:grid-cols-3 md:gap-4 md:space-y-0 md:content-start max-w-7xl mx-auto"></div>
        <div id="doaListContainer" class="px-5 pt-2 space-y-3 scroll-smooth pb-4 no-scrollbar md:px-8 md:grid md:grid-cols-2 lg:grid-cols-3 md:gap-4 md:space-y-0 md:content-start max-w-7xl mx-auto"></div>
    </div>

    <div id="doaDetailModal" class="fixed inset-0 z-[200] flex items-end sm:items-center justify-center invisible pointer-events-none">
        <div id="doaBackdrop" class="absolute inset-0 bg-slate-950/60 backdrop-blur-md opacity-0 transition-opacity duration-500" onclick="closeDoaDetail()"></div>
        <div id="doaDetailContent" class="relative w-full sm:w-[90%] sm:max-w-lg max-h-[85vh] flex flex-col bg-white dark:bg-slate-950 rounded-t-[3rem] sm:rounded-[3rem] shadow-2xl border-t border-white/20 dark:border-slate-800 transform translate-y-full transition-transform duration-500 ease-[cubic-bezier(0.32,0.72,0,1)] overflow-hidden pb-[env(safe-area-inset-bottom)]">
            <div class="w-12 h-1.5 bg-slate-200 dark:bg-slate-800 rounded-full mx-auto mt-6 mb-2 shrink-0"></div>
            <div class="px-8 py-4 flex justify-between items-center shrink-0 border-b border-slate-50 dark:border-slate-900/30">
                <h3 id="modalDoaTitle" class="text-xl font-black text-slate-800 dark:text-white truncate pr-6">Detail Doa</h3>
                <button onclick="vibrateSoft(); closeDoaDetail()" class="w-10 h-10 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center text-slate-500 transition active:scale-90 shrink-0">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="flex-1 overflow-y-auto p-6 space-y-8 no-scrollbar">
                <div class="text-center p-6 rounded-[2.5rem] bg-emerald-500/[0.03] dark:bg-emerald-500/[0.02] border border-emerald-500/10">
                    <p id="modalDoaArab" class="font-quran text-2xl md:text-3xl leading-relaxed text-slate-800 dark:text-white" dir="rtl">...</p>
                </div>
                <div class="space-y-6 bg-slate-50 dark:bg-slate-900/50 p-6 rounded-[2rem] border border-white dark:border-slate-800">
                    <div>
                        <p class="text-[10px] font-bold text-emerald-600 dark:text-emerald-400 uppercase tracking-[0.2em] mb-2">Transliterasi</p>
                        <p id="modalDoaLatin" class="text-sm font-medium text-slate-600 dark:text-slate-400 italic leading-relaxed">...</p>
                    </div>
                    <div class="pt-6 border-t border-slate-200/50 dark:border-slate-800">
                        <p class="text-[10px] font-bold text-emerald-600 dark:text-emerald-400 uppercase tracking-[0.2em] mb-2">Terjemahan</p>
                        <p id="modalDoaIndo" class="text-sm text-slate-700 dark:text-slate-200 leading-relaxed font-medium">...</p>
                    </div>
                    
                    <div id="modalDoaSource" class="pt-5 border-t border-slate-200/50 dark:border-slate-800 mt-2 hidden">
                        <div class="flex items-start gap-2.5">
                            <div class="w-5 h-5 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center shrink-0">
                                <i data-lucide="info" class="w-3 h-3 text-slate-400"></i>
                            </div>
                            <div class="flex-1 min-w-0">
                                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Sumber Doa</p>
                                <p id="sourceText" class="text-[11px] font-medium text-slate-500 dark:text-slate-400 leading-relaxed break-words whitespace-normal"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
