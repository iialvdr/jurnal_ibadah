<div id="doaView" class="hidden-force flex flex-col h-full absolute inset-0 z-50 transition-all duration-300 overflow-hidden bg-slate-100 dark:bg-slate-950">
    
    <div class="fixed top-0 left-0 right-0 h-48 bg-gradient-to-b from-emerald-500/10 via-emerald-500/5 to-transparent pointer-events-none z-0"></div>

    <div class="px-5 pt-[calc(1.5rem+env(safe-area-inset-top))] pb-3 flex justify-between items-center relative shrink-0 z-30">
        <button onclick="goBack()" class="w-10 h-10 rounded-full bg-white/80 dark:bg-slate-900/80 backdrop-blur-md flex items-center justify-center text-slate-600 dark:text-slate-300 shadow-sm border border-white/50 dark:border-slate-700 active:scale-95 transition hover:text-rose-600 group">
            <i data-lucide="arrow-left" class="w-5 h-5 group-hover:-translate-x-0.5 transition"></i>
        </button>
        <h2 class="text-lg font-bold text-slate-800 dark:text-white tracking-tight">Kumpulan Doa</h2>
        <div class="w-10"></div> 
    </div>

    <div class="flex-1 relative overflow-hidden flex flex-col z-10">
        
        <div class="px-5 pt-2 pb-2 z-20 space-y-3">
            <div id="doaSearchWrapper" class="relative group" style="will-change: transform;">
                <div class="relative bg-white dark:bg-slate-900 rounded-[1.2rem] shadow-sm border border-slate-200 dark:border-slate-800 flex items-center px-4 py-3 transition-colors duration-200 ease-out group-focus-within:border-emerald-500 hover:border-emerald-300 dark:hover:border-emerald-700">
                    <i data-lucide="search" class="w-4 h-4 text-slate-400 group-focus-within:text-emerald-500 transition-colors"></i>
                    <input type="text" id="doaSearchInput" onkeyup="searchDoa(this.value)" placeholder="Cari doa sehari-hari..." class="w-full bg-transparent border-none focus:ring-0 text-sm font-bold text-slate-700 dark:text-white placeholder:text-slate-400 ml-3 h-full outline-none">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3 relative z-30">
                <div class="relative" id="filterGrupWrapper">
                    <button type="button" onclick="toggleFilter(event, 'grup')" id="btnGrupFilter" class="w-full bg-slate-200/80 dark:bg-slate-800/80 backdrop-blur-sm text-slate-600 dark:text-slate-300 text-[10px] font-bold py-2.5 px-4 rounded-xl flex justify-between items-center outline-none active:scale-95 transition border border-transparent focus:border-emerald-500 hover:bg-slate-300/50 dark:hover:bg-slate-700/50">
                        <span id="labelGrup" class="truncate mr-2">Kategori</span>
                        <i data-lucide="chevron-down" class="w-3 h-3 text-slate-400 shrink-0 transition-transform duration-200" id="iconGrup"></i>
                    </button>
                    <div id="listGrup" class="hidden absolute top-full left-0 right-0 mt-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl shadow-xl z-50 max-h-56 overflow-y-auto p-1 origin-top transition-all duration-200 ease-out opacity-0 scale-95 will-change-transform"></div>
                </div>

                <div class="relative" id="filterTagWrapper">
                    <button type="button" onclick="toggleFilter(event, 'tag')" id="btnTagFilter" class="w-full bg-slate-200/80 dark:bg-slate-800/80 backdrop-blur-sm text-slate-600 dark:text-slate-300 text-[10px] font-bold py-2.5 px-4 rounded-xl flex justify-between items-center outline-none active:scale-95 transition border border-transparent focus:border-emerald-500 hover:bg-slate-300/50 dark:hover:bg-slate-700/50">
                        <span id="labelTag" class="truncate mr-2">Tagar</span>
                        <i data-lucide="chevron-down" class="w-3 h-3 text-slate-400 shrink-0 transition-transform duration-200" id="iconTag"></i>
                    </button>
                    <div id="listTag" class="hidden absolute top-full left-0 right-0 mt-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl shadow-xl z-50 max-h-56 overflow-y-auto p-1 origin-top transition-all duration-200 ease-out opacity-0 scale-95 will-change-transform"></div>
                </div>
            </div>
        </div>

        <div id="doaLoading" class="absolute inset-x-0 bottom-0 top-[8.5rem] z-20 px-5 pt-2 pb-4 space-y-2 overflow-y-auto no-scrollbar">
            <div class="animate-pulse bg-white dark:bg-slate-900 p-4 rounded-[1.5rem] border border-slate-200 dark:border-slate-800 flex items-center gap-4"><div class="w-10 h-10 rounded-full bg-slate-200 dark:bg-slate-800 shrink-0"></div><div class="flex-1 space-y-2"><div class="h-2 bg-slate-200 dark:bg-slate-800 rounded w-16"></div><div class="h-3 bg-slate-200 dark:bg-slate-800 rounded w-3/4"></div></div></div>
            <div class="animate-pulse bg-white dark:bg-slate-900 p-4 rounded-[1.5rem] border border-slate-200 dark:border-slate-800 flex items-center gap-4"><div class="w-10 h-10 rounded-full bg-slate-200 dark:bg-slate-800 shrink-0"></div><div class="flex-1 space-y-2"><div class="h-2 bg-slate-200 dark:bg-slate-800 rounded w-20"></div><div class="h-3 bg-slate-200 dark:bg-slate-800 rounded w-2/3"></div></div></div>
            <div class="animate-pulse bg-white dark:bg-slate-900 p-4 rounded-[1.5rem] border border-slate-200 dark:border-slate-800 flex items-center gap-4"><div class="w-10 h-10 rounded-full bg-slate-200 dark:bg-slate-800 shrink-0"></div><div class="flex-1 space-y-2"><div class="h-2 bg-slate-200 dark:bg-slate-800 rounded w-12"></div><div class="h-3 bg-slate-200 dark:bg-slate-800 rounded w-4/5"></div></div></div>
        </div>
        
        <div id="doaListContainer" class="flex-1 overflow-y-auto px-5 pt-2 space-y-2.5 scroll-smooth pb-24 no-scrollbar"></div>
    </div>

    <div id="doaDetailModal" class="fixed inset-0 z-[100] flex items-end justify-center invisible pointer-events-none">
        
        <div id="doaBackdrop" class="absolute inset-0 bg-slate-950/60 backdrop-blur-sm opacity-0 transition-opacity duration-500 ease-in-out" onclick="closeDoaDetail()"></div>

        <div id="doaDetailContent" class="relative w-full sm:w-[90%] sm:max-w-md max-h-[85vh] flex flex-col bg-white dark:bg-slate-950 rounded-t-[2.5rem] rounded-b-none shadow-[0_-10px_40px_-15px_rgba(0,0,0,0.3)] border-t border-x border-b-0 border-white/20 dark:border-slate-800 transform translate-y-full transition-transform duration-500 ease-[cubic-bezier(0.32,0.72,0,1)] will-change-transform overflow-hidden pb-[env(safe-area-inset-bottom)] -mb-[2px]">
            
            <div class="w-12 h-1.5 bg-slate-200 dark:bg-slate-800 rounded-full mx-auto mt-5 mb-2 shrink-0"></div>

            <div class="px-6 py-3 flex justify-between items-center shrink-0 border-b border-slate-50 dark:border-slate-900/50">
                <h3 id="modalDoaTitle" class="text-lg font-black text-slate-800 dark:text-white truncate pr-4">Detail Doa</h3>
                <button onclick="closeDoaDetail()" class="p-2 bg-slate-100 dark:bg-slate-800 rounded-full text-slate-500 hover:text-red-500 transition active:scale-90">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <div class="flex-1 overflow-y-auto p-6 pb-12 space-y-6 custom-scrollbar bg-slate-50/50 dark:bg-slate-950">
                <div class="text-center space-y-4">
                    <p id="modalDoaArab" class="font-quran text-3xl leading-[2.6] text-slate-800 dark:text-white" dir="rtl">...</p>
                </div>
                <div class="space-y-4 bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-100 dark:border-slate-800 shadow-sm">
                    <div>
                        <p class="text-[10px] font-bold text-emerald-600 dark:text-emerald-400 uppercase tracking-wider mb-1">Latin</p>
                        <p id="modalDoaLatin" class="text-sm font-medium text-slate-600 dark:text-slate-300 italic leading-relaxed">...</p>
                    </div>
                    <div>
                        <p class="text-[10px] font-bold text-emerald-600 dark:text-emerald-400 uppercase tracking-wider mb-1">Artinya</p>
                        <p id="modalDoaIndo" class="text-sm text-slate-700 dark:text-slate-200 leading-relaxed">...</p>
                    </div>
                    <div id="modalDoaSource" class="pt-2 border-t border-slate-200 dark:border-slate-700 hidden">
                        <p class="text-[10px] text-slate-400 font-medium">Riwayat: -</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
