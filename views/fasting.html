<div id="fastingView" class="hidden-force flex flex-col h-full absolute inset-0 z-50 overflow-hidden bg-slate-100 dark:bg-slate-950 transition-all duration-300">
    <div class="fixed top-0 left-0 right-0 h-48 bg-gradient-to-b from-emerald-500/10 via-emerald-500/5 to-transparent pointer-events-none z-0"></div>

    <div class="px-5 pt-[calc(1.5rem+env(safe-area-inset-top))] pb-3 shrink-0 relative z-30 flex justify-between items-center md:px-8 md:pt-6">
        <button onclick="goBack()" class="w-10 h-10 rounded-full bg-white/80 dark:bg-slate-900/80 backdrop-blur-md flex items-center justify-center text-slate-600 dark:text-slate-300 shadow-sm border border-white/50 dark:border-slate-700 active:scale-95 transition hover:text-amber-600 group">
            <i data-lucide="arrow-left" class="w-5 h-5 group-hover:-translate-x-0.5 transition"></i>
        </button>
        <h2 class="text-lg font-bold text-slate-800 dark:text-white tracking-tight">Kalender Puasa</h2>
        <div class="w-10"></div> 
    </div>

    <div class="flex-1 overflow-y-auto px-5 pb-8 md:pb-6 scroll-smooth no-scrollbar flex flex-col gap-6 relative z-10 md:px-8 md:grid md:grid-cols-12 md:gap-8 md:content-start md:space-y-0">
        
        <div class="contents md:flex md:flex-col md:col-span-7 lg:col-span-8 md:gap-6">
            <div class="order-1 md:order-none w-full">
                <div class="flex items-center justify-between px-1 mb-2">
                    <h3 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Status Hari Ini</h3>
                    <span id="fastingHijriDate" class="text-[10px] font-bold text-emerald-600 bg-emerald-50 dark:bg-emerald-900/20 px-2 py-0.5 rounded-md">--</span>
                </div>
                <div id="fastingPageTodayContainer"></div>
            </div>

            <div class="order-3 md:order-none w-full">
                <h3 class="px-1 text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3">30 Hari Mendatang</h3>
                <div id="fastingLoading" class="space-y-3 pb-6 md:grid md:grid-cols-2 md:gap-4 md:space-y-0 hidden-force"></div>
                <div id="upcomingFastingList" class="space-y-3 pb-6 md:grid md:grid-cols-2 md:gap-4 md:space-y-0"></div>
            </div>
        </div>

        <div class="contents md:flex md:flex-col md:col-span-5 lg:col-span-4">
            <div class="order-2 md:order-none w-full">
                <h3 class="px-1 text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3">Niat Cepat</h3>
                <div class="grid grid-cols-2 gap-3 md:grid-cols-1">
                    <button onclick="vibrateSoft(); openNiatModal('senin,kamis')" class="bg-white dark:bg-slate-900 p-4 rounded-[1.5rem] border border-slate-200 dark:border-slate-800 text-left hover:border-emerald-400/50 dark:hover:border-emerald-700 transition shadow-sm active:scale-[0.98] group relative overflow-hidden">
                        <div class="absolute right-0 top-0 w-16 h-16 bg-emerald-500/5 rounded-bl-[2rem] -mr-2 -mt-2 transition group-hover:bg-emerald-500/10"></div>
                        <div class="w-9 h-9 rounded-full bg-emerald-100 dark:bg-emerald-900/30 text-emerald-600 flex items-center justify-center mb-3 group-hover:scale-110 transition">
                            <i data-lucide="calendar-check" class="w-4 h-4"></i>
                        </div>
                        <p class="font-bold text-slate-700 dark:text-white text-sm">Senin & Kamis</p>
                        <p class="text-[10px] text-slate-400 mt-0.5">Sunnah Mingguan</p>
                    </button>
                    
                    <button onclick="vibrateSoft(); openNiatModal('ayyamul_bidh')" class="bg-white dark:bg-slate-900 p-4 rounded-[1.5rem] border border-slate-200 dark:border-slate-800 text-left hover:border-blue-400/50 dark:hover:border-blue-700 transition shadow-sm active:scale-[0.98] group relative overflow-hidden">
                        <div class="absolute right-0 top-0 w-16 h-16 bg-blue-500/5 rounded-bl-[2rem] -mr-2 -mt-2 transition group-hover:bg-blue-500/10"></div>
                        <div class="w-9 h-9 rounded-full bg-blue-100 dark:bg-blue-900/30 text-blue-600 flex items-center justify-center mb-3 group-hover:scale-110 transition">
                            <i data-lucide="moon" class="w-4 h-4"></i>
                        </div>
                        <p class="font-bold text-slate-700 dark:text-white text-sm">Ayyamul Bidh</p>
                        <p class="text-[10px] text-slate-400 mt-0.5">Pertengahan Bulan</p>
                    </button>
                    
                    <button onclick="vibrateSoft(); openNiatModal('ramadhan')" class="bg-white dark:bg-slate-900 p-4 rounded-[1.5rem] border border-slate-200 dark:border-slate-800 text-left hover:border-amber-400/50 dark:hover:border-amber-700 transition shadow-sm active:scale-[0.98] group relative overflow-hidden">
                        <div class="absolute right-0 top-0 w-16 h-16 bg-amber-500/5 rounded-bl-[2rem] -mr-2 -mt-2 transition group-hover:bg-amber-500/10"></div>
                        <div class="w-9 h-9 rounded-full bg-amber-100 dark:bg-amber-900/30 text-amber-600 flex items-center justify-center mb-3 group-hover:scale-110 transition">
                            <i data-lucide="sun" class="w-4 h-4"></i>
                        </div>
                        <p class="font-bold text-slate-700 dark:text-white text-sm">Ramadhan</p>
                        <p class="text-[10px] text-slate-400 mt-0.5">Puasa Wajib</p>
                    </button>
                    
                    <button onclick="vibrateSoft(); openNiatModal('syawal,arafah,asyura')" class="bg-white dark:bg-slate-900 p-4 rounded-[1.5rem] border border-slate-200 dark:border-slate-800 text-left hover:border-purple-400/50 dark:hover:border-purple-700 transition shadow-sm active:scale-[0.98] group relative overflow-hidden">
                        <div class="absolute right-0 top-0 w-16 h-16 bg-purple-500/5 rounded-bl-[2rem] -mr-2 -mt-2 transition group-hover:bg-purple-500/10"></div>
                        <div class="w-9 h-9 rounded-full bg-purple-50 dark:bg-purple-900/30 text-purple-600 flex items-center justify-center mb-3 group-hover:scale-110 transition">
                            <i data-lucide="book-open" class="w-4 h-4"></i>
                        </div>
                        <p class="font-bold text-slate-700 dark:text-white text-sm">Lainnya</p>
                        <p class="text-[10px] text-slate-400 mt-0.5">Kumpulan Niat</p>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="niatModal" class="fixed inset-0 z-[100] flex items-end sm:items-center justify-center invisible pointer-events-none">
        <div id="niatBackdrop" class="absolute inset-0 bg-slate-950/60 backdrop-blur-sm opacity-0 transition-opacity duration-500 ease-in-out" onclick="closeNiatModal()"></div>
        <div id="niatModalContent" class="relative w-full sm:w-[90%] sm:max-w-md max-h-[85vh] flex flex-col bg-white dark:bg-slate-950 rounded-t-[2.5rem] sm:rounded-[2.5rem] shadow-[0_-10px_40px_-15px_rgba(0,0,0,0.3)] border-t border-x sm:border-b border-white/20 dark:border-slate-800 transform translate-y-full sm:translate-y-10 sm:scale-95 transition-transform duration-500 ease-[cubic-bezier(0.32,0.72,0,1)] will-change-transform overflow-hidden pb-[env(safe-area-inset-bottom)] -mb-[2px]">
            <div class="w-12 h-1.5 bg-slate-200 dark:bg-slate-800 rounded-full mx-auto mt-5 mb-2 shrink-0"></div>
            <div class="px-6 py-3 flex justify-between items-center shrink-0 border-b border-slate-50 dark:border-slate-900/50">
                <div>
                    <h3 class="text-lg font-black text-slate-800 dark:text-white">Bacaan Niat</h3>
                    <p class="text-xs text-slate-400">Lafalkan niat sebelum fajar</p>
                </div>
                <button onclick="closeNiatModal()" class="p-2 bg-slate-100 dark:bg-slate-800 rounded-full text-slate-500 hover:text-slate-700 transition active:scale-90">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div id="niatListContainer" class="flex-1 overflow-y-auto p-6 pb-12 space-y-4 no-scrollbar bg-slate-50/50 dark:bg-slate-950"></div>
        </div>
    </div>
</div>
