<div id="fastingView" class="hidden-force flex flex-col h-full absolute inset-0 z-50 transition-all duration-300 overflow-y-auto bg-slate-100 dark:bg-slate-950 no-scrollbar">

    <div class="sticky top-0 z-50 px-5 pt-[calc(1.5rem+env(safe-area-inset-top))] pb-3 md:px-8 md:pt-6">

            <button onclick="vibrateSoft(); goBack()" class="w-10 h-10 rounded-full flex items-center justify-center text-slate-600 dark:text-slate-300 transition active:scale-90">

        <div class="order-2 md:order-1 md:col-span-12 mb-6">
            <div class="flex items-center justify-between px-1 mb-3">
                <h3 class="text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Status Hari Ini</h3>
                <span id="fastingHijriDate" class="text-xs font-bold text-emerald-600 dark:text-emerald-400 transition-all">--</span>
            </div>
            <div id="fastingPageTodayContainer" class="w-full"></div>
        </div>

        <div class="order-1 md:order-3 md:col-span-5 lg:col-span-4 flex flex-col gap-4 mb-8 md:mb-0 md:sticky md:top-24">

            <div class="grid grid-cols-2 gap-3 md:grid-cols-1 md:gap-4">
                <button onclick="vibrateSoft(); openNiatModal('senin,kamis')" class="bento-card bg-white dark:bg-slate-900 p-4 rounded-[2rem] text-left border border-white dark:border-slate-800 shadow-sm relative overflow-hidden h-[110px] md:h-[120px] flex flex-col justify-center transition-all active:scale-95 group">
                    <div class="absolute -right-2 -top-2 opacity-10 group-hover:opacity-20"><i data-lucide="calendar-check" class="w-16 h-16 text-emerald-500"></i></div>
                    <div class="w-9 h-9 rounded-xl bg-emerald-50 dark:bg-emerald-900/20 text-emerald-600 flex items-center justify-center mb-2 relative z-10"><i data-lucide="calendar-check" class="w-4 h-4"></i></div>

                    <p class="text-[10px] text-slate-400 font-medium relative z-10">Sunnah Mingguan</p>
                </button>
                <button onclick="vibrateSoft(); openNiatModal('ayyamul_bidh')" class="bento-card bg-white dark:bg-slate-900 p-4 rounded-[2rem] text-left border border-white dark:border-slate-800 shadow-sm relative overflow-hidden h-[110px] md:h-[120px] flex flex-col justify-center transition-all active:scale-95 group">
                    <div class="absolute -right-2 -top-2 opacity-10 group-hover:opacity-20"><i data-lucide="moon" class="w-16 h-16 text-blue-500"></i></div>
                    <div class="w-9 h-9 rounded-xl bg-blue-50 dark:bg-blue-900/20 text-blue-600 flex items-center justify-center mb-2 relative z-10"><i data-lucide="moon" class="w-4 h-4"></i></div>
                    <p class="font-bold text-slate-800 dark:text-white text-sm relative z-10">Ayyamul Bidh</p>
                    <p class="text-[10px] text-slate-400 font-medium relative z-10">Pertengahan Bulan</p>
                </button>
                <button onclick="vibrateSoft(); openNiatModal('ramadhan')" class="bento-card bg-white dark:bg-slate-900 p-4 rounded-[2rem] text-left border border-white dark:border-slate-800 shadow-sm relative overflow-hidden h-[110px] md:h-[120px] flex flex-col justify-center transition-all active:scale-95 group">

                    <p class="font-bold text-slate-800 dark:text-white text-sm relative z-10">Ramadhan</p>
                    <p class="text-[10px] text-slate-400 font-medium relative z-10">Puasa Wajib</p>
                </button>
                <button onclick="vibrateSoft(); openNiatModal('syawal,arafah,asyura')" class="bento-card bg-white dark:bg-slate-900 p-4 rounded-[2rem] text-left border border-white dark:border-slate-800 shadow-sm relative overflow-hidden h-[110px] md:h-[120px] flex flex-col justify-center transition-all active:scale-95 group">

                    <p class="text-[10px] text-slate-400 font-medium relative z-10">Kumpulan Niat</p>
                </button>

        </div>

        <div class="order-3 md:order-2 md:col-span-7 lg:col-span-8 flex flex-col gap-6">
            <h3 class="px-1 text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-4">30 Hari Mendatang</h3>
            <div id="upcomingFastingList" class="space-y-3 pb-2 md:grid md:grid-cols-2 md:gap-4 md:space-y-0"></div>
        </div>

    <div id="niatModal" class="fixed inset-0 z-[200] flex items-end sm:items-center justify-center invisible pointer-events-none">

        <div id="niatModalContent" class="relative w-full sm:w-[90%] sm:max-w-md max-h-[85vh] flex flex-col bg-white dark:bg-slate-950 rounded-t-[3rem] sm:rounded-[3rem] shadow-2xl border-t border-white/20 dark:border-slate-800 transform translate-y-full transition-transform duration-500 ease-[cubic-bezier(0.32,0.72,0,1)] overflow-hidden pb-[env(safe-area-inset-bottom)]">
            <div class="w-12 h-1.5 bg-slate-200 dark:bg-slate-800 rounded-full mx-auto mt-6 mb-2 shrink-0"></div>
            <div class="px-8 py-4 flex justify-between items-center shrink-0 border-b border-slate-50 dark:border-slate-900/30">
                <div>
                    <h3 class="text-xl font-black text-slate-800 dark:text-white">Bacaan Niat</h3>
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-0.5">Lafalkan sebelum fajar</p>
                </div>

            </div>
            <div id="niatListContainer" class="flex-1 overflow-y-auto p-6 pb-8 space-y-4 no-scrollbar bg-slate-50/50 dark:bg-slate-950"></div>
