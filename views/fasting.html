<div id="fastingView" class="hidden-force flex flex-col h-full absolute inset-0 z-50 transition-all duration-300 overflow-y-auto bg-slate-100 dark:bg-slate-950 no-scrollbar">
    
    <div class="fixed top-0 left-0 right-0 h-80 bg-gradient-to-b from-emerald-500/10 via-emerald-500/5 to-transparent pointer-events-none z-0"></div>

    <div class="sticky top-0 z-50 px-5 pt-[calc(1.5rem+env(safe-area-inset-top))] pb-3 md:px-8 md:pt-6">
        <div class="glass-pill flex items-center justify-between p-2 rounded-full bg-white/70 dark:bg-slate-900/70 backdrop-blur-xl border border-white/40 dark:border-slate-700/50 shadow-sm w-full max-w-7xl mx-auto">
            <button onclick="vibrateSoft(); goBack()" class="w-10 h-10 rounded-full flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-black/5 dark:hover:bg-white/10 transition active:scale-90 group">
                <i data-lucide="arrow-left" class="w-5 h-5 group-hover:-translate-x-0.5 transition"></i>
            </button>
            <h2 class="text-sm font-black text-slate-800 dark:text-white tracking-tight text-center flex-1">Kalender Puasa</h2>
            <div class="w-10"></div> 
        </div>
    </div>

    <div class="relative z-10 px-5 pt-2 pb-10 w-full max-w-7xl mx-auto flex flex-col gap-8 md:gap-10" id="fastingContent">
        
        <!-- === SECTION 1: KONDISI HARI INI === -->
        <div>
            <div class="flex items-center justify-between px-2 mb-3">
                <h3 class="text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-[0.2em]">Kondisi Ibadah</h3>
                <span id="fastingHijriDate" class="text-[10px] font-bold text-emerald-600 dark:text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-full">--</span>
            </div>
            <div id="fastingPageTodayContainer" class="w-full"></div>
        </div>

        <!-- === SECTION 2: KAMUS NIAT PUASA (Searchable Encyclopedia) === -->
        <div>
            <div class="flex items-center justify-between px-2 mb-4">
                <div>
                    <h3 class="text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-[0.2em]">Kamus Niat Puasa</h3>
                    <p class="text-[9px] text-slate-400 dark:text-slate-500 mt-0.5">Cari dan temukan niat puasa yang kamu butuhkan</p>
                </div>
                <span id="niatResultCount" class="text-[9px] font-bold text-emerald-600 dark:text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-full hidden">16 niat</span>
            </div>

            <!-- Search Bar -->
            <div id="niatSearchWrapper" class="relative group mb-4">
                <div class="relative bg-white/80 dark:bg-slate-900/80 backdrop-blur-md rounded-[1.8rem] border border-white dark:border-slate-800 flex items-center px-5 py-4 transition-all duration-300 group-focus-within:ring-4 group-focus-within:ring-emerald-500/10 shadow-sm">
                    <i data-lucide="search" class="w-5 h-5 text-slate-400 group-focus-within:text-emerald-500 transition-colors shrink-0"></i>
                    <input type="text" id="niatSearchInput" placeholder="Cari niat puasa... (cth: senin, ramadhan, daud)" class="w-full bg-transparent border-none focus:ring-0 text-sm font-bold text-slate-700 dark:text-white placeholder:text-slate-400 ml-4 outline-none">
                    <button id="niatSearchClear" class="hidden w-7 h-7 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-400 hover:text-slate-600 active:scale-90 transition shrink-0 ml-2">
                        <i data-lucide="x" class="w-3.5 h-3.5"></i>
                    </button>
                </div>
            </div>

            <!-- Category Filter Tabs -->
            <div class="flex gap-2 overflow-x-auto no-scrollbar px-1 pb-4" id="niatCategoryTabs">
                <button data-niat-cat="semua" class="niat-tab-active shrink-0 px-4 py-2.5 rounded-2xl text-[10px] font-black uppercase tracking-widest transition-all active:scale-95 border" onclick="vibrateSoft(); filterNiatByCategory('semua')">
                    <span class="flex items-center gap-1.5">
                        <i data-lucide="layers" class="w-3.5 h-3.5"></i>
                        Semua
                    </span>
                </button>
                <button data-niat-cat="wajib" class="niat-tab shrink-0 px-4 py-2.5 rounded-2xl text-[10px] font-black uppercase tracking-widest transition-all active:scale-95 border" onclick="vibrateSoft(); filterNiatByCategory('wajib')">
                    <span class="flex items-center gap-1.5">
                        <i data-lucide="shield-check" class="w-3.5 h-3.5"></i>
                        Wajib
                    </span>
                </button>
                <button data-niat-cat="reguler" class="niat-tab shrink-0 px-4 py-2.5 rounded-2xl text-[10px] font-black uppercase tracking-widest transition-all active:scale-95 border" onclick="vibrateSoft(); filterNiatByCategory('reguler')">
                    <span class="flex items-center gap-1.5">
                        <i data-lucide="repeat" class="w-3.5 h-3.5"></i>
                        Sunnah Rutin
                    </span>
                </button>
                <button data-niat-cat="khusus" class="niat-tab shrink-0 px-4 py-2.5 rounded-2xl text-[10px] font-black uppercase tracking-widest transition-all active:scale-95 border" onclick="vibrateSoft(); filterNiatByCategory('khusus')">
                    <span class="flex items-center gap-1.5">
                        <i data-lucide="calendar-heart" class="w-3.5 h-3.5"></i>
                        Sunnah Khusus
                    </span>
                </button>
                <button data-niat-cat="lainnya" class="niat-tab shrink-0 px-4 py-2.5 rounded-2xl text-[10px] font-black uppercase tracking-widest transition-all active:scale-95 border" onclick="vibrateSoft(); filterNiatByCategory('lainnya')">
                    <span class="flex items-center gap-1.5">
                        <i data-lucide="bookmark" class="w-3.5 h-3.5"></i>
                        Lainnya
                    </span>
                </button>
            </div>

            <!-- Niat Cards Grid -->
            <div id="niatCardsGrid" class="grid grid-cols-2 gap-3 md:grid-cols-3 lg:grid-cols-4 md:gap-4">
                <!-- Cards will be populated by JS -->
            </div>

            <!-- Empty State -->
            <div id="niatEmptyState" class="hidden py-12 text-center">
                <div class="w-16 h-16 rounded-3xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="search-x" class="w-7 h-7 text-slate-300 dark:text-slate-600"></i>
                </div>
                <p class="text-sm font-bold text-slate-400 dark:text-slate-500">Niat tidak ditemukan</p>
                <p class="text-[10px] text-slate-400 dark:text-slate-600 mt-1">Coba kata kunci lain atau pilih kategori berbeda</p>
            </div>
        </div>

        <!-- === SECTION 3: JADWAL 30 HARI MENDATANG === -->
        <div>
            <h3 class="px-2 text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-4">30 Hari Mendatang</h3>
            <div id="upcomingFastingList" class="space-y-3 pb-2 md:grid md:grid-cols-2 md:gap-4 md:space-y-0"></div>
        </div>
    </div>

    <!-- === NIAT DETAIL MODAL === -->
    <div id="niatModal" class="fixed inset-0 z-[200] flex items-end sm:items-center justify-center invisible pointer-events-none">
        <div id="niatBackdrop" class="absolute inset-0 bg-slate-950/60 backdrop-blur-md opacity-0 transition-opacity duration-500" onclick="closeNiatModal()"></div>
        <div id="niatModalContent" class="relative w-full sm:w-[90%] sm:max-w-md max-h-[85vh] flex flex-col bg-white dark:bg-slate-950 rounded-t-[2.5rem] sm:rounded-[2.5rem] shadow-2xl border-t border-white/20 dark:border-slate-800 transform translate-y-full sm:translate-y-10 sm:scale-95 sm:opacity-0 transition-all duration-500 ease-[cubic-bezier(0.32,0.72,0,1)] overflow-hidden pb-[env(safe-area-inset-bottom)]">
            <div class="w-12 h-1.5 bg-slate-200 dark:bg-slate-800 rounded-full mx-auto mt-4 mb-2 shrink-0"></div>
            <div class="px-6 py-4 flex justify-between items-center shrink-0">
                <div>
                    <h3 class="text-lg font-black text-slate-800 dark:text-white">Bacaan Niat</h3>
                    <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mt-0.5">Disunnahkan sebelum fajar</p>
                </div>
                <button onclick="vibrateSoft(); closeNiatModal()" class="w-9 h-9 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center text-slate-500 active:scale-90 shrink-0"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <div id="niatListContainer" class="flex-1 overflow-y-auto p-4 pb-8 space-y-4 no-scrollbar"></div>
        </div>
    </div>
</div>
