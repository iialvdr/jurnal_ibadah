<div id="hadithView" class="hidden-force flex flex-col h-full absolute inset-0 z-50 transition-all duration-300 overflow-y-auto bg-slate-100 dark:bg-slate-950 no-scrollbar">
    
    <div class="fixed top-0 left-0 right-0 h-80 bg-gradient-to-b from-emerald-500/10 via-emerald-500/5 to-transparent pointer-events-none z-0"></div>

    <div class="sticky top-0 z-50 px-5 pt-[calc(1.5rem+env(safe-area-inset-top))] pb-3 md:px-8 md:pt-6">
        <div class="glass-pill flex items-center justify-between p-2 rounded-full bg-white/70 dark:bg-slate-900/70 backdrop-blur-xl border border-white/40 dark:border-slate-700/50 shadow-sm w-full max-w-7xl mx-auto">
            <button onclick="vibrateSoft(); goBackHadith()" class="w-10 h-10 rounded-full flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-black/5 dark:hover:bg-white/10 transition active:scale-90 group">
                <i data-lucide="arrow-left" class="w-5 h-5 group-hover:-translate-x-0.5 transition"></i>
            </button>
            <h2 id="hadithHeaderTitle" class="text-sm font-black text-slate-800 dark:text-white tracking-tight text-center flex-1">Perpustakaan Hadits</h2>
            <div class="w-10"></div> 
        </div>
    </div>

    <div class="relative z-10 px-5 pt-2 pb-20 w-full max-w-7xl mx-auto">
        <div id="hadithSearchBox" class="hidden mb-6">
            <div class="relative group">
                <input type="number" id="hadithNumberInput" placeholder="Cari nomor hadits..." 
                    class="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl py-4 pl-12 pr-4 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all shadow-sm">
                <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400 group-focus-within:text-emerald-500 transition-colors"></i>
                <button onclick="searchHadithByNumber()" class="absolute right-3 top-1/2 -translate-y-1/2 bg-emerald-500 text-white px-4 py-1.5 rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-emerald-600 transition-colors">Cari</button>
            </div>
        </div>

        <div id="booksGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <div class="h-32 rounded-[2rem] bg-white dark:bg-slate-900 animate-pulse border border-white dark:border-slate-800"></div>
            <div class="h-32 rounded-[2rem] bg-white dark:bg-slate-900 animate-pulse border border-white dark:border-slate-800"></div>
            <div class="h-32 rounded-[2rem] bg-white dark:bg-slate-900 animate-pulse border border-white dark:border-slate-800"></div>
            <div class="h-32 rounded-[2rem] bg-white dark:bg-slate-900 animate-pulse border border-white dark:border-slate-800"></div>
        </div>

        <div id="hadithListContainer" class="hidden space-y-4"></div>

        <div id="hadithPagination" class="hidden mt-10 flex flex-wrap items-center justify-center gap-1.5 md:gap-2">
            </div>
    </div>
</div>
