<div id="homeView" class="hidden-force flex flex-col h-full absolute inset-0 z-40 overflow-y-auto bg-transparent no-scrollbar">
    
    <div class="fixed top-0 left-0 right-0 h-28 bg-gradient-to-b from-slate-100/90 via-slate-100/50 to-transparent dark:from-slate-950/90 dark:via-slate-950/50 pointer-events-none z-40"></div>

    <div class="sticky top-0 z-50 pt-[calc(1rem+env(safe-area-inset-top))] px-4 pb-2">
        <div class="glass-pill flex items-center justify-between p-2 pl-3 rounded-full bg-white/70 dark:bg-slate-900/70 backdrop-blur-xl border border-white/40 dark:border-slate-700/50 shadow-lg shadow-slate-200/20 dark:shadow-black/20 transition-all duration-300">
            
            <div class="flex items-center gap-3" onclick="vibrateSoft(); openProfile()">
                <div class="relative group cursor-pointer">
                    <div class="absolute -inset-1 bg-gradient-to-tr from-emerald-400 to-teal-500 rounded-full opacity-0 group-hover:opacity-50 blur transition duration-500"></div>
                    <img id="homeUserPhoto" src="" referrerpolicy="no-referrer" class="relative w-10 h-10 rounded-full object-cover border-2 border-white dark:border-slate-800 bg-slate-200">
                    <div class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-white dark:border-slate-900 rounded-full"></div>
                </div>
                <div class="flex flex-col justify-center">
                    <h1 id="homeUserName" class="text-sm font-bold text-slate-800 dark:text-white leading-tight truncate max-w-[150px]">Valdi</h1>
                    <p id="hijriDisplay" class="text-[10px] font-medium text-slate-500 dark:text-slate-400 leading-tight">Loading...</p>
                </div>
            </div>

            <div class="flex items-center gap-1 pr-1">
                <button onclick="vibrateSoft(); toggleDarkMode()" class="w-9 h-9 rounded-full hover:bg-black/5 dark:hover:bg-white/10 flex items-center justify-center text-slate-600 dark:text-slate-400 transition active:scale-95">
                    <i data-lucide="moon" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </div>

    <div class="px-5 pt-4 pb-6 space-y-5 relative z-0">
        
        <div class="relative w-full group cursor-pointer" onclick="vibrateSoft(); refreshLocation()">
            <div class="bento-card bg-slate-900 dark:bg-black rounded-[2rem] p-6 text-white border border-slate-800 relative overflow-hidden shadow-2xl shadow-emerald-900/20">
                
                <div class="absolute inset-0 opacity-40">
                    <div class="absolute top-[-50%] left-[-20%] w-[150%] h-[150%] bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-emerald-500/30 via-transparent to-transparent animate-spin-slow"></div>
                    <div class="absolute bottom-[-20%] right-[-20%] w-[100%] h-[100%] bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-teal-500/20 via-transparent to-transparent"></div>
                </div>

                <div class="relative z-10 flex flex-col items-center text-center">
                    <div class="mb-2.5 flex items-center gap-2 bg-white/10 px-2.5 py-0.5 rounded-full backdrop-blur-md border border-white/5">
                        <i id="locIcon" data-lucide="map-pin" class="w-3 h-3 text-emerald-300"></i>
                        <span id="homeLocationText" class="text-[10px] font-bold text-slate-300 uppercase tracking-wider">Mencari Lokasi...</span>
                    </div>

                    <h2 id="nextPrayerName" class="text-5xl font-black tracking-tighter bg-clip-text text-transparent bg-gradient-to-b from-white to-slate-400 leading-tight py-2">...</h2>
                    <p id="nextPrayerTime" class="text-lg font-medium text-emerald-400 mt-1 font-mono tracking-wide">--:--</p>

                    <div class="mt-4 bg-emerald-500/20 border border-emerald-500/30 px-4 py-1.5 rounded-xl flex items-center gap-2">
                        <i data-lucide="timer" class="w-3.5 h-3.5 text-emerald-400"></i>
                        <span id="countdownTimer" class="text-xs font-mono font-bold text-emerald-100">--:--:--</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="space-y-3">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest px-2">Jadwal Sholat</h3>
            <div id="todayPrayerGrid" class="grid grid-cols-5 gap-2">
                 <div class="h-14 rounded-2xl bg-white dark:bg-slate-800 animate-pulse"></div>
                 <div class="h-14 rounded-2xl bg-white dark:bg-slate-800 animate-pulse delay-75"></div>
                 <div class="h-14 rounded-2xl bg-white dark:bg-slate-800 animate-pulse delay-100"></div>
                 <div class="h-14 rounded-2xl bg-white dark:bg-slate-800 animate-pulse delay-150"></div>
                 <div class="h-14 rounded-2xl bg-white dark:bg-slate-800 animate-pulse delay-200"></div>
            </div>
        </div>

        <div class="space-y-4">
            <div id="homeFastingContainer" class="hidden"></div>
            <div id="homeLastReadContainer" class="hidden"></div>
        </div>

        <div>
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest px-2 mb-3">Menu Utama</h3>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="vibrateSoft(); openTracker()" class="bento-card bg-white dark:bg-slate-900 p-5 rounded-[2rem] text-left group hover:border-emerald-500/30 transition-colors">
                    <div class="flex justify-between items-start mb-6">
                        <div class="w-10 h-10 rounded-2xl bg-emerald-100 dark:bg-emerald-900/30 text-emerald-600 flex items-center justify-center">
                            <i data-lucide="list-checks" class="w-5 h-5"></i>
                        </div>
                        <div class="w-2 h-2 rounded-full bg-emerald-500"></div>
                    </div>
                    <h4 class="font-bold text-slate-800 dark:text-slate-100 text-lg">Jurnal</h4>
                    <p class="text-[11px] text-slate-500 mt-1">Checklist Harian</p>
                </button>

                <button onclick="vibrateSoft(); openQuran()" class="bento-card bg-white dark:bg-slate-900 p-5 rounded-[2rem] text-left group hover:border-purple-500/30 transition-colors">
                    <div class="flex justify-between items-start mb-6">
                        <div class="w-10 h-10 rounded-2xl bg-purple-100 dark:bg-purple-900/30 text-purple-600 flex items-center justify-center">
                            <i data-lucide="book-open" class="w-5 h-5"></i>
                        </div>
                        <i data-lucide="arrow-up-right" class="w-4 h-4 text-slate-300"></i>
                    </div>
                    <h4 class="font-bold text-slate-800 dark:text-slate-100 text-lg">Al-Qur'an</h4>
                    <p class="text-[11px] text-slate-500 mt-1">Baca & Terjemah</p>
                </button>

                <button onclick="vibrateSoft(); openTasbih()" class="bento-card bg-white dark:bg-slate-900 p-4 rounded-[1.8rem] flex flex-col items-center justify-center text-center gap-2 group hover:border-blue-500/30 transition-colors">
                    <i data-lucide="grip" class="w-6 h-6 text-blue-500 group-hover:scale-110 transition"></i>
                    <span class="text-xs font-bold text-slate-700 dark:text-slate-200">Tasbih</span>
                </button>

                <button onclick="vibrateSoft(); openQibla()" class="bento-card bg-white dark:bg-slate-900 p-4 rounded-[1.8rem] flex flex-col items-center justify-center text-center gap-2 group hover:border-teal-500/30 transition-colors">
                    <i data-lucide="compass" class="w-6 h-6 text-teal-500 group-hover:rotate-45 transition"></i>
                    <span class="text-xs font-bold text-slate-700 dark:text-slate-200">Kiblat</span>
                </button>

                <button onclick="vibrateSoft(); openFasting()" class="col-span-2 bento-card bg-white dark:bg-slate-900 p-4 rounded-[1.8rem] flex items-center px-5 gap-4 group hover:border-amber-500/30 transition-colors">
                    <div class="w-9 h-9 rounded-full bg-amber-100 dark:bg-amber-900/30 text-amber-600 dark:text-amber-500 flex items-center justify-center shrink-0">
                        <i data-lucide="utensils-crossed" class="w-4 h-4"></i>
                    </div>
                    <div class="flex-1 text-left">
                        <h4 class="font-bold text-slate-800 dark:text-slate-100 text-sm">Kalender Puasa</h4>
                        <p class="text-[10px] text-slate-500">Senin Kamis & Ayyamul Bidh</p>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-slate-300 group-hover:text-amber-500 transition"></i>
                </button>

                <button onclick="vibrateSoft(); openDoa()" class="col-span-2 bento-card bg-white dark:bg-slate-900 p-4 rounded-[1.8rem] flex items-center px-5 gap-4 group hover:border-rose-500/30 transition-colors">
                    <div class="w-9 h-9 rounded-full bg-rose-100 dark:bg-rose-900/30 text-rose-500 flex items-center justify-center shrink-0">
                        <i data-lucide="book-heart" class="w-4 h-4"></i>
                    </div>
                    <div class="flex-1 text-left">
                        <h4 class="font-bold text-slate-800 dark:text-slate-100 text-sm">Kumpulan Doa</h4>
                        <p class="text-[10px] text-slate-500">Doa harian & tahlil</p>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-slate-300 group-hover:text-rose-500 transition"></i>
                </button>

                <button onclick="vibrateSoft(); openAsma()" class="col-span-2 bento-card bg-white dark:bg-slate-900 p-4 rounded-[1.8rem] flex items-center px-5 gap-4 group hover:border-indigo-500/30 transition-colors">
                    <div class="w-9 h-9 rounded-full bg-indigo-100 dark:bg-indigo-900/30 text-indigo-500 flex items-center justify-center shrink-0">
                        <i data-lucide="grid" class="w-4 h-4"></i>
                    </div>
                    <div class="flex-1 text-left">
                        <h4 class="font-bold text-slate-800 dark:text-slate-100 text-sm">Asmaul Husna</h4>
                        <p class="text-[10px] text-slate-500">99 Nama Allah</p>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-slate-300 group-hover:text-indigo-500 transition"></i>
                </button>
            </div>
        </div>

        <div class="text-center opacity-40">
            <p id="homeFooterVersion" class="text-[9px] font-bold text-slate-500 tracking-widest uppercase">Jurnal Ibadah App</p>
        </div>
    </div>
</div>
