<div id="homeView" class="hidden-force flex flex-col h-full absolute inset-0 z-40 overflow-y-auto pb-32 pt-[calc(2rem+env(safe-area-inset-top))] bg-slate-100 dark:bg-slate-950 no-scrollbar">
    
    <div class="px-6 pb-6 flex justify-between items-end">
        <div>
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm mb-3">
                <span class="relative flex h-2 w-2">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                </span>
                <span class="text-[10px] font-bold tracking-[0.1em] text-emerald-700 dark:text-emerald-400 uppercase">Assalamu'alaikum</span>
            </div>
            <h1 id="homeUserName" class="text-3xl font-black text-slate-800 dark:text-white leading-tight tracking-tight">Hamba Allah</h1>
        </div>
        
        <div class="flex items-center gap-3">
            <button onclick="vibrateSoft(); toggleDarkMode()" class="w-11 h-11 rounded-2xl bg-white dark:bg-slate-900 flex items-center justify-center text-slate-600 dark:text-slate-400 shadow-md border border-slate-200 dark:border-slate-800 active:scale-95 transition hover:text-amber-500 group">
                <i data-lucide="moon" class="w-5 h-5 group-hover:rotate-12 transition"></i>
            </button>
            
            <div onclick="vibrateSoft(); openProfile()" class="relative group cursor-pointer ml-1">
                <img id="homeUserPhoto" src="" referrerpolicy="no-referrer" class="relative w-11 h-11 rounded-2xl border-2 border-white dark:border-slate-800 object-cover shadow-lg group-hover:scale-105 group-hover:border-emerald-500 transition transform duration-300">
            </div>
        </div>
    </div>

    <div class="px-6 mb-8">
        <div class="relative w-full group cursor-pointer transition-transform duration-300 hover:scale-[1.02] active:scale-[0.98] will-change-transform" onclick="vibrateSoft(); refreshLocation()">
            
            <div class="relative bg-gradient-to-br from-emerald-500 to-teal-600 rounded-[1.8rem] p-7 text-white shadow-2xl shadow-emerald-500/30 ring-1 ring-white/20 overflow-hidden">
                <div class="absolute top-0 right-0 w-48 h-48 bg-white/10 rounded-full -mr-20 -mt-20 blur-3xl"></div>
                <div class="absolute bottom-0 left-0 w-40 h-40 bg-emerald-400/20 rounded-full -ml-16 -mb-16 blur-2xl"></div>
                
                <div class="relative z-10">
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="inline-flex items-center gap-1.5 bg-black/20 px-2.5 py-1 rounded-lg border border-white/10 mb-2 backdrop-blur-md">
                                <i data-lucide="clock" class="w-3 h-3 text-emerald-200"></i>
                                <span class="text-[10px] font-bold text-emerald-50 tracking-wide uppercase">Waktu Berikutnya</span>
                            </div>
                            <h2 id="nextPrayerName" class="text-4xl font-black tracking-tighter mb-0 drop-shadow-sm">...</h2>
                            <div class="flex items-baseline gap-2 mt-1">
                                <p id="nextPrayerTime" class="text-xl font-medium font-mono opacity-90 tracking-wide">--:--</p>
                                <p id="countdownTimer" class="text-xs font-bold text-emerald-100 bg-white/20 px-2 py-0.5 rounded-md backdrop-blur-sm">
                                    - : - : -
                                </p>
                            </div>
                        </div>
                        <div class="w-12 h-12 bg-white/20 backdrop-blur-md rounded-2xl border border-white/20 flex items-center justify-center shadow-lg group-hover:rotate-12 transition duration-300">
                             <i id="locIcon" data-lucide="map-pin" class="w-6 h-6 text-white drop-shadow-md"></i>
                        </div>
                    </div>
                    <div class="mt-6 flex items-center gap-2 opacity-90 group-hover:opacity-100 transition">
                        <span id="homeLocationText" class="text-xs font-bold truncate max-w-[200px]">Mencari Lokasi...</span>
                        <i data-lucide="chevron-right" class="w-3 h-3"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="homeFastingContainer" class="px-6 mb-4 hidden"></div>
    <div id="homeLastReadContainer" class="px-6 mb-6 hidden"></div>
    
    <div class="px-6 mb-8">
        <div class="flex items-center justify-between mb-4 px-1">
             <h3 class="text-sm font-bold text-slate-800 dark:text-slate-200 flex items-center gap-2 uppercase tracking-wide">
                <i data-lucide="calendar-days" class="w-4 h-4 text-emerald-600"></i> Jadwal Hari Ini
             </h3>
             <span id="hijriDisplay" class="text-[10px] font-bold text-slate-600 dark:text-slate-400 bg-white dark:bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-800 shadow-sm">
                 Loading...
             </span>
        </div>
        
        <div id="todayPrayerGrid" class="grid grid-cols-5 gap-2">
            <div class="flex flex-col items-center justify-center py-2 px-1 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm animate-pulse">
                <div class="h-2 w-8 bg-slate-200 dark:bg-slate-800 rounded mb-2"></div><div class="h-3 w-10 bg-slate-200 dark:bg-slate-800 rounded mb-2"></div><div class="h-4 w-4 rounded-full bg-slate-200 dark:bg-slate-800"></div>
            </div>
            <div class="flex flex-col items-center justify-center py-2 px-1 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm animate-pulse delay-75">
                <div class="h-2 w-8 bg-slate-200 dark:bg-slate-800 rounded mb-2"></div><div class="h-3 w-10 bg-slate-200 dark:bg-slate-800 rounded mb-2"></div><div class="h-4 w-4 rounded-full bg-slate-200 dark:bg-slate-800"></div>
            </div>
            <div class="flex flex-col items-center justify-center py-2 px-1 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm animate-pulse delay-150">
                <div class="h-2 w-8 bg-slate-200 dark:bg-slate-800 rounded mb-2"></div><div class="h-3 w-10 bg-slate-200 dark:bg-slate-800 rounded mb-2"></div><div class="h-4 w-4 rounded-full bg-slate-200 dark:bg-slate-800"></div>
            </div>
            <div class="flex flex-col items-center justify-center py-2 px-1 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm animate-pulse delay-200">
                <div class="h-2 w-8 bg-slate-200 dark:bg-slate-800 rounded mb-2"></div><div class="h-3 w-10 bg-slate-200 dark:bg-slate-800 rounded mb-2"></div><div class="h-4 w-4 rounded-full bg-slate-200 dark:bg-slate-800"></div>
            </div>
            <div class="flex flex-col items-center justify-center py-2 px-1 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm animate-pulse delay-300">
                <div class="h-2 w-8 bg-slate-200 dark:bg-slate-800 rounded mb-2"></div><div class="h-3 w-10 bg-slate-200 dark:bg-slate-800 rounded mb-2"></div><div class="h-4 w-4 rounded-full bg-slate-200 dark:bg-slate-800"></div>
            </div>
        </div>
    </div>

    <div class="px-6 grid grid-cols-2 gap-5 pb-10">
        <button onclick="vibrateSoft(); openTracker()" class="relative group bg-white dark:bg-slate-900 p-5 rounded-[2rem] border border-slate-200 dark:border-slate-800 shadow-lg hover:shadow-xl hover:shadow-emerald-500/10 hover:border-emerald-200 transition-all duration-300 text-left active:scale-95">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-emerald-400 to-emerald-600 shadow-lg shadow-emerald-500/30 flex items-center justify-center text-white mb-4 group-hover:scale-110 transition duration-300">
                <i data-lucide="list-checks" class="w-7 h-7"></i>
            </div>
            <h3 class="font-black text-slate-800 dark:text-slate-100 text-lg">Jurnal</h3>
            <p class="text-xs text-slate-500 font-medium mt-1">Checklist Harian</p>
        </button>

        <button onclick="vibrateSoft(); openTasbih()" class="relative group bg-white dark:bg-slate-900 p-5 rounded-[2rem] border border-slate-200 dark:border-slate-800 shadow-lg hover:shadow-xl hover:shadow-blue-500/10 hover:border-blue-200 transition-all duration-300 text-left active:scale-95">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-blue-400 to-blue-600 shadow-lg shadow-blue-500/30 flex items-center justify-center text-white mb-4 group-hover:scale-110 transition duration-300">

        </button>

        <button onclick="vibrateSoft(); openQuran()" class="relative group bg-white dark:bg-slate-900 p-5 rounded-[2rem] border border-slate-200 dark:border-slate-800 shadow-lg hover:shadow-xl hover:shadow-purple-500/10 hover:border-purple-200 transition-all duration-300 text-left active:scale-95">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-purple-400 to-purple-600 shadow-lg shadow-purple-500/30 flex items-center justify-center text-white mb-4 group-hover:scale-110 transition duration-300">
                <i data-lucide="book-open" class="w-7 h-7"></i>
            </div>
            <h3 class="font-black text-slate-800 dark:text-slate-100 text-lg">Al-Qur'an</h3>

        </button>

        <button onclick="vibrateSoft(); openQibla()" class="relative group bg-white dark:bg-slate-900 p-5 rounded-[2rem] border border-slate-200 dark:border-slate-800 shadow-lg hover:shadow-xl hover:shadow-teal-500/10 hover:border-teal-200 transition-all duration-300 text-left active:scale-95">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-teal-400 to-teal-600 shadow-lg shadow-teal-500/30 flex items-center justify-center text-white mb-4 group-hover:scale-110 transition duration-300">
                <i data-lucide="compass" class="w-7 h-7"></i>
            </div>
            <h3 class="font-black text-slate-800 dark:text-slate-100 text-lg">Kiblat</h3>
            <p class="text-xs text-slate-500 font-medium mt-1">Arah Ka'bah</p>
        </button>
        
        <button onclick="vibrateSoft(); openDoa()" class="relative group bg-white dark:bg-slate-900 p-5 rounded-[2rem] border border-slate-200 dark:border-slate-800 shadow-lg hover:shadow-xl hover:shadow-pink-500/10 hover:border-pink-200 transition-all duration-300 text-left active:scale-95">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-pink-400 to-rose-500 shadow-lg shadow-pink-500/30 flex items-center justify-center text-white mb-4 group-hover:scale-110 transition duration-300">
                <i data-lucide="book-heart" class="w-7 h-7"></i>
            </div>
            <h3 class="font-black text-slate-800 dark:text-slate-100 text-lg">Doa</h3>
            <p class="text-xs text-slate-500 font-medium mt-1">Harian & Tahlil</p>
        </button>

        <button onclick="vibrateSoft(); openAsma()" class="relative group bg-white dark:bg-slate-900 p-5 rounded-[2rem] border border-slate-200 dark:border-slate-800 shadow-lg hover:shadow-xl hover:shadow-indigo-500/10 hover:border-indigo-200 transition-all duration-300 text-left active:scale-95">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-indigo-400 to-violet-500 shadow-lg shadow-indigo-500/30 flex items-center justify-center text-white mb-4 group-hover:scale-110 transition duration-300">
                <i data-lucide="grid" class="w-7 h-7"></i>
            </div>
            <h3 class="font-black text-slate-800 dark:text-slate-100 text-lg">Asmaul Husna</h3>
            <p class="text-xs text-slate-500 font-medium mt-1">99 Nama Allah</p>
        </button>
        
        <button onclick="vibrateSoft(); openProfile()" class="col-span-2 relative group bg-white dark:bg-slate-900 p-5 rounded-[2rem] border border-slate-200 dark:border-slate-800 shadow-lg hover:shadow-xl hover:shadow-amber-500/10 hover:border-amber-200 transition-all duration-300 text-left flex items-center gap-5 active:scale-95">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-amber-400 to-amber-600 shadow-lg shadow-amber-500/30 flex items-center justify-center text-white shrink-0 group-hover:rotate-12 transition duration-300">
                <i data-lucide="user" class="w-7 h-7"></i>
            </div>
            
            <div class="relative z-10 flex-1">
                <h3 class="font-black text-slate-800 dark:text-slate-100 text-lg">Profil Saya</h3>
                <p class="text-xs text-slate-500 font-medium mt-1">Statistik & Akun</p>
            </div>
            
            <div class="bg-slate-50 dark:bg-slate-800 p-2.5 rounded-xl text-slate-400 group-hover:translate-x-1 transition relative z-10 border border-slate-100 dark:border-slate-700">
                <i data-lucide="chevron-right" class="w-5 h-5"></i>
            </div>
        </button>

    <div class="text-center pb-8 opacity-60">
        <div class="w-12 h-1 bg-slate-300 dark:bg-slate-800 rounded-full mx-auto mb-2"></div>
        <p class="text-[10px] font-bold text-slate-400 dark:text-slate-600 tracking-widest uppercase">Jurnal Ibadah App</p>
    </div>
</div>
