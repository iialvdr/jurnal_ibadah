<div id="homeView" class="hidden-force flex flex-col h-full absolute inset-0 z-40 overflow-y-auto bg-slate-100 dark:bg-slate-950 no-scrollbar transition-colors duration-300">
    
    <div class="fixed top-0 left-0 right-0 h-80 bg-gradient-to-b from-emerald-500/10 via-emerald-500/5 to-transparent pointer-events-none z-0"></div>

    <div class="sticky top-0 z-50 px-5 pt-[calc(1.5rem+env(safe-area-inset-top))] pb-3 md:px-8 md:pt-6">
        <div class="glass-pill flex items-center justify-between p-2 pl-3 rounded-full bg-white/70 dark:bg-slate-900/70 backdrop-blur-xl border border-white/40 dark:border-slate-700/50 shadow-sm w-full max-w-7xl mx-auto">
            <div class="flex items-center gap-3 cursor-pointer group" onclick="vibrateSoft(); openProfile()">
                <div class="relative">
                    <img id="homeUserPhoto" src="https://ui-avatars.com/api/?name=User&background=10b981&color=fff" referrerpolicy="no-referrer" class="w-10 h-10 rounded-full object-cover border-2 border-white dark:border-slate-800 bg-slate-200 transition-transform group-hover:scale-105">
                    <div class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-white dark:border-slate-900 rounded-full"></div>
                </div>
                <div class="flex flex-col justify-center">
                    <h1 id="homeUserName" class="text-sm font-bold text-slate-800 dark:text-white leading-tight truncate max-w-[150px]">Assalamualaikum</h1>
                    <p id="hijriDisplay" class="text-[10px] font-medium text-slate-500 dark:text-slate-400 leading-tight">Memuat...</p>
                </div>
            </div>
            <div class="flex items-center gap-1 pr-1">
                <button onclick="vibrateSoft(); toggleDarkMode()" class="w-9 h-9 rounded-full hover:bg-black/5 dark:hover:bg-white/10 flex items-center justify-center text-slate-600 dark:text-slate-400 transition active:scale-90">
                    <i data-lucide="moon" class="w-5 h-5 dark:hidden"></i>
                    <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
                </button>
            </div>
        </div>
    </div>

    <div class="px-5 pt-1 pb-6 space-y-5 relative z-10 md:px-8 max-w-7xl mx-auto w-full md:grid md:grid-cols-12 md:gap-6 md:space-y-0 md:items-start">
        
        <div class="flex flex-col gap-4 w-full md:col-span-5 lg:col-span-4 md:sticky md:top-24">
            <div id="homeLocationCard" class="relative w-full group cursor-pointer" onclick="vibrateSoft(); refreshLocation()">
                <div class="bento-card hover-emerald bg-slate-900 dark:bg-black rounded-[2rem] p-6 text-white border border-slate-800 relative overflow-hidden shadow-lg shadow-emerald-900/20">
                    <div class="absolute top-[-50%] left-[-20%] w-[150%] h-[150%] bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-emerald-500/20 via-transparent to-transparent opacity-50"></div>
                    <div class="relative z-10 flex flex-col items-center text-center">
                        <div class="mb-3 flex items-center gap-2 bg-white/10 px-3 py-0.5 rounded-full backdrop-blur-md border border-white/5">
                            <i id="locIcon" data-lucide="map-pin" class="w-3 h-3 text-emerald-300"></i>
                            <span id="homeLocationText" class="text-[10px] font-bold text-slate-300 uppercase tracking-wider">Mencari...</span>
                        </div>
                        <h2 id="nextPrayerName" class="text-4xl font-black tracking-tighter text-white leading-tight py-1">...</h2>
                        <p id="nextPrayerTime" class="text-lg font-medium text-emerald-400 font-mono tracking-wide">--:--</p>
                        <div class="mt-4 bg-emerald-500/10 border border-emerald-500/20 px-3 py-1.5 rounded-xl flex items-center gap-2">
                            <i data-lucide="timer" class="w-3.5 h-3.5 text-emerald-400"></i>
                            <span id="countdownTimer" class="text-xs font-mono font-bold text-emerald-100">--:--:--</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-white/60 dark:bg-slate-900/60 backdrop-blur-sm p-1.5 rounded-2xl border border-white/50 dark:border-slate-800 md:bg-white md:dark:bg-slate-900 shadow-sm">
                <div id="todayPrayerGrid" class="grid grid-cols-5 gap-1 md:flex md:flex-col md:gap-2">
                     </div>
            </div>
        </div>

        <div class="flex flex-col gap-4 w-full md:col-span-7 lg:col-span-8">
            <div class="space-y-3">
                <div id="homeHadithContainer" class="w-full transition-all duration-300"></div>
                <div id="homeFastingContainer" class="hidden w-full transition-all duration-300"></div>
                <div id="homeLastReadContainer" class="hidden w-full transition-all duration-300"></div>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4">
                <button onclick="vibrateSoft(); openTracker()" class="col-span-2 bento-card hover-emerald bg-white dark:bg-slate-900 p-5 rounded-[2rem] text-left group h-[120px] flex flex-col justify-center border border-white dark:border-slate-800 shadow-sm relative overflow-hidden">
                    <div class="absolute right-[-10px] top-[-10px] opacity-10 group-hover:opacity-20 transition-opacity"><i data-lucide="list-checks" class="w-24 h-24 text-emerald-500"></i></div>
                    <div class="flex items-center gap-4 relative z-10">
                        <div class="w-12 h-12 rounded-2xl bg-emerald-100 dark:bg-emerald-900/30 text-emerald-600 flex items-center justify-center shrink-0 border border-emerald-100 dark:border-emerald-800/30"><i data-lucide="list-checks" class="w-6 h-6"></i></div>
                        <div>
                            <h4 class="font-bold text-slate-800 dark:text-slate-100 text-lg leading-tight">Jurnal Ibadah</h4>
                            <p class="text-[11px] font-medium text-slate-500 mt-0.5">Checklist harian</p>
                        </div>
                    </div>
                </button>

                <button onclick="vibrateSoft(); openQuran()" class="col-span-2 bento-card hover-purple bg-white dark:bg-slate-900 p-5 rounded-[2rem] text-left group h-[120px] flex flex-col justify-center border border-white dark:border-slate-800 shadow-sm relative overflow-hidden">
                    <div class="absolute right-[-10px] top-[-10px] opacity-10 group-hover:opacity-20 transition-opacity"><i data-lucide="book-open" class="w-24 h-24 text-purple-500"></i></div>
                    <div class="flex items-center gap-4 relative z-10">
                        <div class="w-12 h-12 rounded-2xl bg-purple-100 dark:bg-purple-900/30 text-purple-600 flex items-center justify-center shrink-0 border border-purple-100 dark:border-purple-800/30"><i data-lucide="book-open" class="w-6 h-6"></i></div>
                        <div>
                            <h4 class="font-bold text-slate-800 dark:text-slate-100 text-lg leading-tight">Al-Qur'an</h4>
                            <p class="text-[11px] font-medium text-slate-500 mt-0.5">Baca & terjemah</p>
                        </div>
                    </div>
                </button>

                <button onclick="vibrateSoft(); openHadith()" class="bento-card hover-rose bg-white dark:bg-slate-900 p-4 rounded-2xl flex flex-col items-center justify-center text-center gap-2 group h-[105px] border border-white dark:border-slate-800 shadow-sm">
                    <i data-lucide="library" class="w-6 h-6 text-rose-500 transition-transform group-hover:scale-110"></i>
                    <span class="text-[10px] font-bold text-slate-700 dark:text-slate-200 tracking-wider">Hadits</span>
                </button>
                <button onclick="vibrateSoft(); openQibla()" class="bento-card hover-teal bg-white dark:bg-slate-900 p-4 rounded-2xl flex flex-col items-center justify-center text-center gap-2 group h-[105px] border border-white dark:border-slate-800 shadow-sm">
                    <i data-lucide="compass" class="w-6 h-6 text-teal-500 transition-transform group-hover:scale-110"></i>
                    <span class="text-[10px] font-bold text-slate-700 dark:text-slate-200 tracking-wider">Kiblat</span>
                </button>
                <button onclick="vibrateSoft(); openTasbih()" class="bento-card hover-blue bg-white dark:bg-slate-900 p-4 rounded-2xl flex flex-col items-center justify-center text-center gap-2 group h-[105px] border border-white dark:border-slate-800 shadow-sm">
                    <i data-lucide="grip" class="w-6 h-6 text-blue-500 transition-transform group-hover:scale-110"></i>
                    <span class="text-[10px] font-bold text-slate-700 dark:text-slate-200 tracking-wider">Tasbih</span>
                </button>
                <button onclick="vibrateSoft(); openZakat()" class="bento-card hover-emerald bg-white dark:bg-slate-900 p-4 rounded-2xl flex flex-col items-center justify-center text-center gap-2 group h-[105px] border border-white dark:border-slate-800 shadow-sm">
                    <i data-lucide="calculator" class="w-6 h-6 text-emerald-500 transition-transform group-hover:scale-110"></i>
                    <span class="text-[10px] font-bold text-slate-700 dark:text-slate-200 tracking-wider">Zakat</span>
                </button>

                <button onclick="vibrateSoft(); openFasting()" class="col-span-2 bento-card hover-amber bg-white dark:bg-slate-900 p-4 px-6 rounded-[2rem] flex items-center gap-4 group h-[85px] border border-white dark:border-slate-800 shadow-sm">
                    <div class="w-10 h-10 rounded-full bg-amber-100 dark:bg-amber-900/30 text-amber-500 flex items-center justify-center shrink-0 border border-amber-100 dark:border-amber-800/30"><i data-lucide="utensils-crossed" class="w-5 h-5"></i></div>
                    <div class="flex-1 text-left"><h4 class="font-bold text-slate-800 dark:text-slate-100 text-sm">Jadwal Puasa</h4></div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-slate-300"></i>
                </button>

                <button onclick="vibrateSoft(); openDoa()" class="col-span-2 bento-card hover-rose bg-white dark:bg-slate-900 p-4 px-6 rounded-[2rem] flex items-center gap-4 group h-[85px] border border-white dark:border-slate-800 shadow-sm">
                    <div class="w-10 h-10 rounded-full bg-rose-100 dark:bg-rose-900/30 text-rose-500 flex items-center justify-center shrink-0 border border-rose-100 dark:border-rose-800/30"><i data-lucide="book-heart" class="w-5 h-5"></i></div>
                    <div class="flex-1 text-left"><h4 class="font-bold text-slate-800 dark:text-slate-100 text-sm">Kumpulan Doa</h4></div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-slate-300"></i>
                </button>

                <button onclick="vibrateSoft(); openAsma()" class="col-span-2 bento-card hover-indigo bg-white dark:bg-slate-900 p-4 px-6 rounded-[2rem] flex items-center gap-4 group h-[85px] border border-white dark:border-slate-800 shadow-sm">
                    <div class="w-10 h-10 rounded-full bg-indigo-100 dark:bg-indigo-900/30 text-indigo-500 flex items-center justify-center shrink-0 border border-indigo-100 dark:border-indigo-800/30"><i data-lucide="grid" class="w-5 h-5"></i></div>
                    <div class="flex-1 text-left"><h4 class="font-bold text-slate-800 dark:text-slate-100 text-sm">Asmaul Husna</h4></div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-slate-300"></i>
                </button>

                <button onclick="vibrateSoft(); openFaq()" class="col-span-2 bento-card hover-slate bg-white dark:bg-slate-900 p-4 px-6 rounded-[2rem] flex items-center gap-4 group h-[85px] border border-white dark:border-slate-800 shadow-sm">
                    <div class="w-10 h-10 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 flex items-center justify-center shrink-0 border border-slate-100 dark:border-slate-700/50"><i data-lucide="help-circle" class="w-5 h-5"></i></div>
                    <div class="flex-1 text-left"><h4 class="font-bold text-slate-800 dark:text-slate-100 text-sm">Bantuan & FAQ</h4></div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-slate-300"></i>
                </button>
            </div>
        </div>
    </div>

    <div data-tip-key="home" data-tip-view="homeView" data-tip-target="#homeLocationCard" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-[120] opacity-0 translate-y-4 transition-all duration-300 pointer-events-auto w-[90vw] max-w-sm">
        <div class="bg-white/95 dark:bg-slate-900/95 backdrop-blur-xl border border-white/40 dark:border-slate-800 rounded-2xl p-4 shadow-2xl">
            <div class="flex items-start gap-3">
                <div class="w-8 h-8 rounded-xl bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 flex items-center justify-center shrink-0">
                    <i data-lucide="sparkles" class="w-4 h-4"></i>
                </div>
                <div class="flex-1">
                    <p class="text-[9px] font-black text-emerald-600 dark:text-emerald-400 uppercase tracking-widest">Tip Cepat</p>
                    <p class="text-xs font-bold text-slate-700 dark:text-slate-200 mt-1">Ketuk kartu lokasi untuk refresh jadwal sholat dan kota.</p>
                </div>
            </div>
            <button data-tip-dismiss class="mt-3 w-full py-2 rounded-xl bg-emerald-500 text-white text-[10px] font-black uppercase tracking-widest active:scale-95 transition">Mengerti</button>
        </div>
    </div>
</div>
