<div id="homeView" class="hidden-force flex flex-col h-full absolute inset-0 z-40 transition-all duration-300 overflow-y-auto pb-32 pt-[calc(2rem+env(safe-area-inset-top))] bg-slate-100 dark:bg-slate-950">
    
    <div class="px-6 pb-6 flex justify-between items-end">
        <div>
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm mb-3">
                <span class="relative flex h-2 w-2">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                </span>
                <span class="text-[10px] font-bold tracking-[0.1em] text-emerald-700 dark:text-emerald-400 uppercase">Assalamu'alaikum</span>
            </div>
            <h1 id="homeUserName" class="text-3xl font-black text-slate-800 dark:text-white leading-tight tracking-tight">Hamba Allah</h1>
        </div>
        
        <div class="flex items-center gap-3">
            <button onclick="toggleDarkMode()" class="w-11 h-11 rounded-2xl bg-white dark:bg-slate-900 flex items-center justify-center text-slate-600 dark:text-slate-400 shadow-md border border-slate-200 dark:border-slate-800 active:scale-95 transition hover:text-amber-500 group">
                <i data-lucide="moon" class="w-5 h-5 group-hover:rotate-12 transition"></i>
            </button>
            
            <div onclick="openProfile()" class="relative group cursor-pointer ml-1">
                <div class="absolute inset-0 bg-emerald-500/30 rounded-2xl blur-md opacity-0 group-hover:opacity-100 transition duration-500"></div>
                <img id="homeUserPhoto" src="" referrerpolicy="no-referrer" class="relative w-11 h-11 rounded-2xl border-2 border-white dark:border-slate-800 object-cover shadow-lg hover:scale-105 transition transform">
            </div>
        </div>
    </div>

    <div class="px-6 mb-8">
        <div class="relative w-full group cursor-pointer" onclick="refreshLocation()">
            <div class="absolute -inset-1 bg-gradient-to-r from-emerald-400 to-teal-500 rounded-[2rem] blur opacity-30 group-hover:opacity-50 transition duration-500"></div>
            <div class="relative bg-gradient-to-br from-emerald-500 to-teal-600 rounded-[1.8rem] p-7 text-white shadow-2xl shadow-emerald-500/30 overflow-hidden ring-1 ring-white/20">
                <div class="absolute top-0 right-0 w-48 h-48 bg-white/10 rounded-full -mr-20 -mt-20 blur-3xl"></div>
                <div class="absolute bottom-0 left-0 w-40 h-40 bg-emerald-400/20 rounded-full -ml-16 -mb-16 blur-2xl"></div>
                <div class="relative z-10">
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="inline-flex items-center gap-1.5 bg-black/20 px-2.5 py-1 rounded-lg border border-white/10 mb-2 backdrop-blur-md">
                                <i data-lucide="clock" class="w-3 h-3 text-emerald-200"></i>
                                <span class="text-[10px] font-bold text-emerald-50 tracking-wide uppercase">Waktu Berikutnya</span>
                            </div>
                            <h2 id="nextPrayerName" class="text-4xl font-black tracking-tighter mb-0 drop-shadow-sm">...</h2>
                            <p id="nextPrayerTime" class="text-xl font-medium font-mono opacity-90 tracking-wide mt-1">--:--</p>
                        </div>
                        <div class="w-12 h-12 bg-white/20 backdrop-blur-md rounded-2xl border border-white/20 flex items-center justify-center shadow-lg group-hover:scale-110 transition">
                             <i id="locIcon" data-lucide="map-pin" class="w-6 h-6 text-white drop-shadow-md"></i>
                        </div>
                    </div>
                    <div class="mt-6 flex items-center gap-2 opacity-90 group-hover:opacity-100 transition">
                        <span id="homeLocationText" class="text-xs font-bold truncate max-w-[200px]">Mencari Lokasi...</span>
                        <i data-lucide="chevron-right" class="w-3 h-3"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="homeLastReadContainer" class="px-6 mb-6 hidden animate-[slideUp_0.5s_ease-out]">
        </div>

    <div class="px-6 mb-8">
        <div class="flex items-center justify-between mb-4 px-1">
             <h3 class="text-sm font-bold text-slate-800 dark:text-slate-200 flex items-center gap-2 uppercase tracking-wide">
                <i data-lucide="calendar-days" class="w-4 h-4 text-emerald-600"></i> Jadwal Hari Ini
             </h3>
             <span id="hijriDisplay" class="text-[10px] font-bold text-slate-600 dark:text-slate-400 bg-white dark:bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-800 shadow-sm">Loading...</span>
        </div>
        <div id="todayPrayerGrid" class="grid grid-cols-5 gap-2">
            <div class="animate-pulse bg-white dark:bg-slate-800 h-24 rounded-2xl col-span-5 border border-slate-200 dark:border-slate-800 shadow-sm"></div>
        </div>
    </div>

    <div class="px-6 grid grid-cols-2 gap-5 pb-10">
        <button onclick="openTracker()" class="relative group bg-white dark:bg-slate-900 p-5 rounded-[2rem] border border-slate-200 dark:border-slate-800 shadow-lg hover:shadow-xl hover:shadow-emerald-500/10 hover:border-emerald-200 transition-all duration-300 text-left active:scale-95">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-emerald-400 to-emerald-600 shadow-lg shadow-emerald-500/30 flex items-center justify-center text-white mb-4 group-hover:scale-110 transition duration-300">
                <i data-lucide="list-checks" class="w-7 h-7"></i>
            </div>
            <h3 class="font-black text-slate-800 dark:text-slate-100 text-lg">Jurnal</h3>
            <p class="text-xs text-slate-500 font-medium mt-1">Checklist Harian</p>
        </button>

        <button onclick="openTasbih()" class="relative group bg-white dark:bg-slate-900 p-5 rounded-[2rem] border border-slate-200 dark:border-slate-800 shadow-lg hover:shadow-xl hover:shadow-blue-500/10 hover:border-blue-200 transition-all duration-300 text-left active:scale-95">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-blue-400 to-blue-600 shadow-lg shadow-blue-500/30 flex items-center justify-center text-white mb-4 group-hover:scale-110 transition duration-300">
                <i data-lucide="grip" class="w-7 h-7"></i>
            </div>
            <h3 class="font-black text-slate-800 dark:text-slate-100 text-lg">Tasbih</h3>
            <p class="text-xs text-slate-500 font-medium mt-1">Counter Dzikir</p>
        </button>

        <button onclick="openQuran()" class="relative group bg-white dark:bg-slate-900 p-5 rounded-[2rem] border border-slate-200 dark:border-slate-800 shadow-lg hover:shadow-xl hover:shadow-purple-500/10 hover:border-purple-200 transition-all duration-300 text-left active:scale-95">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-purple-400 to-purple-600 shadow-lg shadow-purple-500/30 flex items-center justify-center text-white mb-4 group-hover:scale-110 transition duration-300">
                <i data-lucide="book-open" class="w-7 h-7"></i>
            </div>
            <h3 class="font-black text-slate-800 dark:text-slate-100 text-lg">Al-Qur'an</h3>
            <p class="text-xs text-slate-500 font-medium mt-1">Baca & Terjemah</p>
        </button>

        <button onclick="openQibla()" class="relative group bg-white dark:bg-slate-900 p-5 rounded-[2rem] border border-slate-200 dark:border-slate-800 shadow-lg hover:shadow-xl hover:shadow-teal-500/10 hover:border-teal-200 transition-all duration-300 text-left active:scale-95">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-teal-400 to-teal-600 shadow-lg shadow-teal-500/30 flex items-center justify-center text-white mb-4 group-hover:scale-110 transition duration-300">
                <i data-lucide="compass" class="w-7 h-7"></i>
            </div>
            <h3 class="font-black text-slate-800 dark:text-slate-100 text-lg">Kiblat</h3>
            <p class="text-xs text-slate-500 font-medium mt-1">Arah Ka'bah</p>
        </button>
        
        <button onclick="openDoa()" class="relative group bg-white dark:bg-slate-900 p-5 rounded-[2rem] border border-slate-200 dark:border-slate-800 shadow-lg hover:shadow-xl hover:shadow-pink-500/10 hover:border-pink-200 transition-all duration-300 text-left active:scale-95">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-pink-400 to-rose-500 shadow-lg shadow-pink-500/30 flex items-center justify-center text-white mb-4 group-hover:scale-110 transition duration-300">
                <i data-lucide="book-heart" class="w-7 h-7"></i>
            </div>
            <h3 class="font-black text-slate-800 dark:text-slate-100 text-lg">Doa</h3>
            <p class="text-xs text-slate-500 font-medium mt-1">Harian & Tahlil</p>
        </button>

        <button onclick="openAsma()" class="relative group bg-white dark:bg-slate-900 p-5 rounded-[2rem] border border-slate-200 dark:border-slate-800 shadow-lg hover:shadow-xl hover:shadow-indigo-500/10 hover:border-indigo-200 transition-all duration-300 text-left active:scale-95">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-indigo-400 to-violet-500 shadow-lg shadow-indigo-500/30 flex items-center justify-center text-white mb-4 group-hover:scale-110 transition duration-300">
                <i data-lucide="grid" class="w-7 h-7"></i>
            </div>
            <h3 class="font-black text-slate-800 dark:text-slate-100 text-lg">Asmaul Husna</h3>
            <p class="text-xs text-slate-500 font-medium mt-1">99 Nama Allah</p>
        </button>
        
        <button onclick="openProfile()" class="col-span-2 relative group bg-white dark:bg-slate-900 p-5 rounded-[2rem] border border-slate-200 dark:border-slate-800 shadow-lg hover:shadow-xl hover:shadow-amber-500/10 hover:border-amber-200 transition-all duration-300 text-left flex items-center gap-5 active:scale-95">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-amber-400 to-amber-600 shadow-lg shadow-amber-500/30 flex items-center justify-center text-white shrink-0 group-hover:rotate-12 transition duration-300">
                <i data-lucide="user" class="w-7 h-7"></i>
            </div>
            
            <div class="relative z-10 flex-1">
                <h3 class="font-black text-slate-800 dark:text-slate-100 text-lg">Profil Saya</h3>
                <p class="text-xs text-slate-500 font-medium mt-1">Statistik & Akun</p>
            </div>
            
            <div class="bg-slate-50 dark:bg-slate-800 p-2.5 rounded-xl text-slate-400 group-hover:translate-x-1 transition relative z-10 border border-slate-100 dark:border-slate-700">
                <i data-lucide="chevron-right" class="w-5 h-5"></i>
            </div>
        </button>
    </div>
    
    <div class="text-center pb-8 opacity-60">
        <div class="w-12 h-1 bg-slate-300 dark:bg-slate-800 rounded-full mx-auto mb-2"></div>
        <p class="text-[10px] font-bold text-slate-400 dark:text-slate-600 tracking-widest uppercase">Jurnal Ibadah App</p>
    </div>

    <div id="exitAppModal" class="absolute inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm hidden-force opacity-0 transition-all duration-300">
        <div class="bg-white dark:bg-slate-900 w-[80%] max-w-xs p-6 rounded-[2rem] shadow-2xl border border-white/20 dark:border-slate-800 transform scale-90 transition-all duration-300" id="exitAppContent">
            <div class="flex flex-col items-center text-center">
                <div class="w-16 h-16 bg-red-50 dark:bg-red-900/20 text-red-500 rounded-full flex items-center justify-center mb-4 shadow-inner animate-pulse">
                    <i data-lucide="door-open" class="w-8 h-8"></i>
                </div>
                <h3 class="text-xl font-black text-slate-800 dark:text-white mb-2">Keluar Aplikasi?</h3>
                <p class="text-sm text-slate-500 dark:text-slate-400 mb-8 leading-relaxed">Kamu yakin ingin menutup aplikasi Jurnal Ibadah?</p>
                <div class="flex gap-3 w-full">
                    <button id="cancelExitBtn" class="flex-1 py-3.5 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-bold text-sm transition active:scale-95 hover:bg-slate-200 dark:hover:bg-slate-700">Batal</button>
                    <button id="confirmExitBtn" class="flex-1 py-3.5 rounded-2xl bg-red-500 hover:bg-red-600 text-white font-bold text-sm shadow-lg shadow-red-500/30 transition active:scale-95">Ya, Keluar</button>
                </div>
            </div>
        </div>
    </div>
</div>
