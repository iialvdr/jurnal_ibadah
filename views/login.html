<div
  id="loginOverlay"
  class="absolute inset-0 z-[100] flex flex-col items-center justify-center p-5 transition-all duration-500 bg-slate-100 dark:bg-slate-950 overflow-hidden"
>

  <!-- Toast (matches auth.js showToast structure) -->
  <div
    id="floatingToast"
    class="fixed top-[calc(env(safe-area-inset-top)+1rem)] left-1/2 -translate-x-1/2 z-[200] transition-all duration-500 transform opacity-0 -translate-y-10 pointer-events-none"
  >
    <div
      class="flex items-center gap-3 px-5 py-4 bg-rose-500/90 dark:bg-rose-600/90 backdrop-blur-xl shadow-2xl rounded-2xl border border-white/20 min-w-[260px] max-w-[90vw]"
    >
      <div class="shrink-0 bg-white/20 p-2 rounded-full">
        <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
      </div>
      <div class="flex-1">
        <h4 class="text-[10px] font-black uppercase tracking-widest text-white mb-0.5">Perhatian</h4>
        <p id="toastMessage" class="text-[11px] font-semibold text-white/95 leading-snug">Pesan error akan muncul di sini.</p>
      </div>
    </div>
  </div>

  <!-- Background gradient glow -->
  <div class="fixed top-0 left-0 right-0 h-80 bg-gradient-to-b from-emerald-500/10 via-emerald-500/5 to-transparent pointer-events-none z-0"></div>

  <!-- Card container -->
  <div class="relative z-10 w-full" style="max-width: 320px;">

    <!-- Logo & branding -->
    <div class="flex flex-col items-center text-center mb-5">
      <div class="relative mb-3">
        <div class="absolute -inset-2 bg-emerald-400/15 dark:bg-emerald-500/10 rounded-full blur-xl"></div>
        <img
          src="img/favicon/android-chrome-192x192.png"
          class="relative w-14 h-14 rounded-full object-contain shadow-lg border-2 border-white dark:border-slate-800 bg-white"
          alt="Logo"
        />
      </div>
      <h1 class="text-xl font-black text-slate-800 dark:text-white tracking-tighter">Jurnal Ibadah</h1>
      <p class="text-[10px] font-medium text-slate-400 mt-0.5">Teman setia ibadah harianmu</p>
    </div>

    <!-- Main form card (bento-card style) -->
    <div class="bento-card bg-white dark:bg-slate-900 rounded-[2rem] p-5 border border-white dark:border-slate-800 shadow-sm">

      <!-- Tab toggle (glass-pill, sama dengan navbar home) -->
      <div id="toggleContainer" class="glass-pill relative w-full bg-white/70 dark:bg-slate-900/70 backdrop-blur-xl p-1 rounded-2xl mb-5 flex items-center border border-white/40 dark:border-slate-700/50 shadow-sm">
        <div
          id="authGlider"
          class="absolute top-1 left-1 h-[calc(100%-8px)] w-[calc(50%-4px)] bg-white dark:bg-slate-800 rounded-xl shadow-md transition-all duration-300 ease-in-out translate-x-0"
        ></div>
        <button
          onclick="toggleAuth(false)"
          class="relative z-10 flex-1 py-2.5 text-[10px] font-black uppercase tracking-widest text-slate-800 dark:text-white transition-colors duration-300"
        >
          Masuk
        </button>
        <button
          onclick="toggleAuth(true)"
          class="relative z-10 flex-1 py-2.5 text-[10px] font-black uppercase tracking-widest text-slate-400 transition-colors duration-300"
        >
          Daftar
        </button>
      </div>

      <!-- Auth forms (sliding track) -->
      <div id="authWindow" class="w-full overflow-hidden">
        <div
          id="authTrack"
          class="flex w-[200%] transition-transform duration-300 ease-in-out translate-x-0"
        >

          <!-- Login Form -->
          <div class="w-1/2 flex flex-col items-center px-1">
            <div class="w-full space-y-2.5">
              <input
                type="email"
                id="emailLogin"
                class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl px-5 py-3.5 text-xs font-bold text-slate-800 dark:text-white focus:outline-none focus:border-emerald-500 transition shadow-inner"
                placeholder="EMAIL"
              />
              <div class="relative">
                <input
                  type="password"
                  id="passwordLogin"
                  class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl px-5 pr-11 py-3.5 text-xs font-bold text-slate-800 dark:text-white focus:outline-none focus:border-emerald-500 transition shadow-inner"
                  placeholder="PASSWORD"
                />
                <button
                  type="button"
                  id="togglePasswordLogin"
                  aria-label="Tampilkan password"
                  class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-emerald-500 transition"
                >
                  <svg id="iconEyeLogin" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>
                  </svg>
                  <svg id="iconEyeOffLogin" class="w-4 h-4 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.8 21.8 0 0 1 5.06-5.94"/>
                    <path d="M1 1l22 22"/>
                    <path d="M9.9 4.24A10.94 10.94 0 0 1 12 5c7 0 11 7 11 7a21.8 21.8 0 0 1-4.12 4.84"/>
                    <path d="M14.12 14.12a3 3 0 0 1-4.24-4.24"/>
                  </svg>
                </button>
              </div>
              <button
                id="btnLoginAction"
                class="w-full py-3.5 rounded-2xl bg-emerald-500 text-white font-black text-[10px] uppercase tracking-widest hover:bg-emerald-600 transition active:scale-95 shadow-lg shadow-emerald-500/20"
              >
                Masuk Sekarang
              </button>
              <button
                id="forgotPasswordBtn"
                class="w-full text-[9px] font-black text-slate-400 hover:text-emerald-500 transition uppercase tracking-wider text-center"
              >
                Lupa Password?
              </button>
            </div>
          </div>

          <!-- Signup Form -->
          <div class="w-1/2 flex flex-col items-center px-1">
            <div class="w-full space-y-2.5">
              <input
                type="email"
                id="emailSignup"
                class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl px-5 py-3.5 text-xs font-bold text-slate-800 dark:text-white focus:outline-none focus:border-emerald-500 transition shadow-inner"
                placeholder="EMAIL BARU"
              />
              <div class="relative">
                <input
                  type="password"
                  id="passwordSignup"
                  class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl px-5 pr-11 py-3.5 text-xs font-bold text-slate-800 dark:text-white focus:outline-none focus:border-emerald-500 transition shadow-inner"
                  placeholder="BUAT PASSWORD"
                />
                <button
                  type="button"
                  id="togglePasswordSignup"
                  aria-label="Tampilkan password"
                  class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-emerald-500 transition"
                >
                  <svg id="iconEyeSignup" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>
                  </svg>
                  <svg id="iconEyeOffSignup" class="w-4 h-4 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.8 21.8 0 0 1 5.06-5.94"/>
                    <path d="M1 1l22 22"/>
                    <path d="M9.9 4.24A10.94 10.94 0 0 1 12 5c7 0 11 7 11 7a21.8 21.8 0 0 1-4.12 4.84"/>
                    <path d="M14.12 14.12a3 3 0 0 1-4.24-4.24"/>
                  </svg>
                </button>
              </div>
              <button
                id="btnSignupAction"
                class="w-full py-3.5 rounded-2xl bg-emerald-500 text-white font-black text-[10px] uppercase tracking-widest hover:bg-emerald-600 transition active:scale-95 shadow-lg shadow-emerald-500/20"
              >
                Buat Akun Baru
              </button>
            </div>
          </div>

        </div>
      </div>

      <!-- Divider -->
      <div class="w-full mt-4">
        <div class="flex items-center gap-3 my-3 opacity-20">
          <div class="h-[1px] flex-1 bg-slate-400"></div>
          <span class="text-[8px] font-black uppercase">Atau</span>
          <div class="h-[1px] flex-1 bg-slate-400"></div>
        </div>

        <p class="text-center text-[9px] font-bold text-slate-400 dark:text-slate-500 mb-2 tracking-wide">
          Ingin lebih praktis? Gunakan akun Google
        </p>

        <!-- Google button -->
        <button
          id="googleLoginBtn"
          class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 py-3 rounded-xl transition active:scale-95 flex items-center justify-center gap-2.5"
        >
          <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          <span class="text-[11px] font-bold text-slate-700 dark:text-white">Masuk via Google</span>
        </button>
      </div>

    </div>
  </div>

  <!-- Loading overlay popup -->
  <div id="loginStatus" class="fixed inset-0 z-[300] hidden items-center justify-center bg-slate-950/50 backdrop-blur-sm">
    <div class="bg-white dark:bg-slate-900 rounded-[2rem] p-8 shadow-2xl border border-white dark:border-slate-800 flex flex-col items-center gap-4 min-w-[200px]">
      <div class="relative flex items-center justify-center">
        <div class="absolute w-12 h-12 bg-emerald-100 dark:bg-emerald-900/30 rounded-full animate-ping opacity-75"></div>
        <div class="relative w-10 h-10 rounded-full bg-emerald-500/10 flex items-center justify-center">
          <svg class="w-5 h-5 text-emerald-500 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
        </div>
      </div>
      <p class="text-[10px] font-black text-slate-500 dark:text-slate-400 uppercase tracking-[0.2em]">Memproses...</p>
    </div>
  </div>



</div>
