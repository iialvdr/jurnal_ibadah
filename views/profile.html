<div id="profileView" class="hidden-force flex flex-col h-full absolute inset-0 z-50 transition-all duration-300 overflow-y-auto bg-slate-100 dark:bg-slate-950 no-scrollbar">
    
    <div class="fixed top-0 left-0 right-0 h-64 bg-gradient-to-b from-emerald-500/10 via-emerald-500/5 to-transparent pointer-events-none z-0"></div>

    <div class="sticky top-0 z-50 px-4 pt-[calc(1.5rem+env(safe-area-inset-top))] pb-3 md:px-8 md:pt-6">
        <div class="glass-pill flex items-center justify-between p-2 rounded-full bg-white/70 dark:bg-slate-900/70 backdrop-blur-xl border border-white/40 dark:border-slate-700/50 shadow-sm w-full max-w-7xl mx-auto">
            <button onclick="vibrateSoft(); goBack()" class="w-9 h-9 rounded-full flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-black/5 dark:hover:bg-white/10 transition active:scale-90 group">
                <i data-lucide="arrow-left" class="w-4.5 h-4.5 group-hover:-translate-x-0.5 transition"></i>
            </button>
            <h2 class="text-sm font-bold text-slate-800 dark:text-white tracking-tight">Profil Saya</h2>
            <button onclick="vibrateSoft(); openEditProfile()" class="w-9 h-9 rounded-full flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-black/5 dark:hover:bg-white/10 transition active:scale-90">
                <i data-lucide="settings-2" class="w-4.5 h-4.5"></i>
            </button>
        </div>
    </div>

    <div class="relative z-10 px-4 pt-1 pb-10 w-full max-w-7xl mx-auto md:px-8">
        
        <div class="grid grid-cols-1 md:grid-cols-12 md:gap-6 gap-3">
            
            <div class="md:col-span-4 lg:col-span-3 bento-card relative overflow-hidden rounded-[1.8rem] md:rounded-[2.5rem] bg-white dark:bg-slate-900 p-5 md:p-8 shadow-xl border border-white dark:border-slate-800 flex flex-col items-center text-center">
                <div class="absolute top-0 right-0 w-24 h-24 bg-emerald-500/10 rounded-full blur-3xl -mr-6 -mt-6"></div>
                
                <div class="relative z-10 w-full flex flex-col items-center">
                    <div class="relative mb-3 md:mb-5 group">
                        <div class="absolute -inset-1 bg-gradient-to-br from-emerald-400 to-teal-500 rounded-full blur opacity-20 group-hover:opacity-40 transition duration-500"></div>
                        <img id="profilePhotoLarge" src="" referrerpolicy="no-referrer" class="relative w-16 h-16 md:w-32 md:h-32 rounded-full border-[3px] border-white dark:border-slate-800 shadow-md object-cover bg-slate-100">
                        <div class="absolute bottom-0 right-0 bg-emerald-500 text-white p-1 rounded-full border-[2px] border-white dark:border-slate-800 shadow-sm">
                            <i data-lucide="shield-check" class="w-3 h-3 md:w-4 md:h-4"></i>
                        </div>
                    </div>
                    
                    <h2 id="profileNameLarge" class="text-base md:text-2xl font-black text-slate-800 dark:text-white tracking-tight leading-tight">...</h2>
                    <p id="profileEmail" class="text-[9px] md:text-xs font-medium text-slate-400 mt-0.5 md:mt-1">...</p>
                    
                    <div class="mt-3 md:mt-6 flex flex-wrap justify-center gap-1.5 md:gap-2">
                         <div class="px-2 py-0.5 rounded-full bg-slate-50 dark:bg-slate-800 border border-slate-100 dark:border-slate-700 flex items-center gap-1">
                             <i data-lucide="calendar" class="w-2.5 h-2.5 text-slate-400"></i>
                             <span id="joinDate" class="text-[8px] md:text-[10px] font-bold text-slate-500">...</span>
                         </div>
                         <div class="px-2 py-0.5 rounded-full bg-slate-50 dark:bg-slate-800 border border-slate-100 dark:border-slate-700 flex items-center gap-1">
                             <i data-lucide="map-pin" class="w-2.5 h-2.5 text-slate-400"></i>
                             <span id="lastLocation" class="text-[8px] md:text-[10px] font-bold text-slate-500">...</span>
                         </div>
                    </div>
                </div>
            </div>

            <div class="md:col-span-8 lg:col-span-9 flex flex-col gap-4 mt-3 md:mt-0">
                <div class="grid grid-cols-3 gap-2 md:gap-4 md:h-full">
                    <div class="bento-card bg-white dark:bg-slate-900 py-3 px-2 md:p-6 rounded-[1.2rem] md:rounded-[2rem] border border-white dark:border-slate-800 shadow-sm flex flex-col items-center justify-center gap-1 md:gap-3 group hover:border-blue-500/20 transition-all">
                        <div class="w-7 h-7 md:w-12 md:h-12 rounded-lg md:rounded-2xl bg-blue-50 dark:bg-blue-900/20 text-blue-500 flex items-center justify-center group-hover:scale-110 transition shadow-sm shrink-0">
                            <i data-lucide="hourglass" class="w-3.5 h-3.5 md:w-6 md:h-6"></i>
                        </div>
                        <div class="text-center">
                            <span id="statDays" class="block text-sm md:text-3xl font-black text-slate-800 dark:text-white leading-none">0</span>
                            <span class="text-[7px] md:text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1 block">Hari</span>
                        </div>
                    </div>
                    
                    <div class="bento-card bg-white dark:bg-slate-900 py-3 px-2 md:p-6 rounded-[1.2rem] md:rounded-[2rem] border border-white dark:border-slate-800 shadow-sm flex flex-col items-center justify-center gap-1 md:gap-3 group hover:border-emerald-500/20 transition-all">
                        <div class="w-7 h-7 md:w-12 md:h-12 rounded-lg md:rounded-2xl bg-emerald-50 dark:bg-emerald-900/20 text-emerald-500 flex items-center justify-center group-hover:scale-110 transition shadow-sm shrink-0">
                            <i data-lucide="activity" class="w-3.5 h-3.5 md:w-6 md:h-6"></i>
                        </div>
                        <div class="text-center">
                            <span id="statConsistency" class="block text-sm md:text-3xl font-black text-slate-800 dark:text-white leading-none">0%</span>
                            <span class="text-[7px] md:text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1 block">Konsisten</span>
                        </div>
                    </div>

                    <div class="bento-card bg-white dark:bg-slate-900 py-3 px-2 md:p-6 rounded-[1.2rem] md:rounded-[2rem] border border-white dark:border-slate-800 shadow-sm flex flex-col items-center justify-center gap-1 md:gap-3 group hover:border-amber-500/20 transition-all">
                        <div class="w-7 h-7 md:w-12 md:h-12 rounded-lg md:rounded-2xl bg-amber-50 dark:bg-amber-900/20 text-amber-500 flex items-center justify-center group-hover:scale-110 transition shadow-sm shrink-0">
                            <i data-lucide="check-circle-2" class="w-3.5 h-3.5 md:w-6 md:h-6"></i>
                        </div>
                        <div class="text-center">
                            <span id="statToday" class="block text-sm md:text-3xl font-black text-slate-800 dark:text-white leading-none">0/5</span>
                            <span class="text-[7px] md:text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1 block">Ibadah</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-4 md:mt-6">
            <div class="bento-card bg-white dark:bg-slate-900 p-5 md:p-8 rounded-[1.8rem] md:rounded-[2.5rem] border border-white dark:border-slate-800 shadow-sm flex flex-col min-h-[280px] md:min-h-[400px]">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 mb-5 md:mb-10">
                    <div>
                        <h3 class="font-bold text-slate-800 dark:text-white text-sm md:text-lg">Tren Ibadah</h3>
                        <p class="text-[8px] md:text-[10px] text-slate-400 uppercase tracking-[0.2em] mt-0.5">Grafik ketepatan sholat wajib</p>
                    </div>
                    <div class="flex bg-slate-100 dark:bg-slate-800 p-1 rounded-xl w-full sm:w-auto shadow-inner border border-slate-200 dark:border-slate-700">
                        <button onclick="vibrateSoft(); loadChartData(7)" id="btn7Days" class="flex-1 sm:flex-none px-4 py-1.5 text-[8px] md:text-[10px] rounded-lg font-black uppercase tracking-widest transition-all">7 Hari</button>
                        <button onclick="vibrateSoft(); loadChartData(14)" id="btn14Days" class="flex-1 sm:flex-none px-4 py-1.5 text-[8px] md:text-[10px] rounded-lg font-black uppercase tracking-widest transition-all">14 Hari</button>
                    </div>
                </div>
                <div class="relative flex-1 w-full min-h-[160px]">
                    <canvas id="activityChart"></canvas>
                </div>
            </div>
        </div>

        <div class="mt-4 md:mt-6 grid grid-cols-1 md:grid-cols-3 gap-3 md:gap-6">
            <button onclick="vibrateSoft(); navigateTo('changelog')" class="bento-card bg-white dark:bg-slate-900 p-4 md:p-6 rounded-[1.2rem] md:rounded-[2rem] border border-white dark:border-slate-800 shadow-sm flex items-center justify-between group active:scale-[0.98] transition hover:border-emerald-500/20">
                <div class="flex items-center gap-3 md:gap-4">
                    <div class="w-9 h-9 md:w-12 md:h-12 rounded-xl md:rounded-2xl bg-orange-50 dark:bg-orange-900/20 text-orange-500 flex items-center justify-center shrink-0 shadow-sm">
                        <i data-lucide="history" class="w-4 h-4 md:w-5 md:h-5"></i>
                    </div>
                    <div class="text-left">
                        <p class="font-bold text-slate-800 dark:text-white text-xs md:text-sm">Riwayat Update</p>
                        <p class="text-[9px] md:text-[10px] text-slate-400">Versi Aplikasi</p>
                    </div>
                </div>
                <i data-lucide="chevron-right" class="w-4 h-4 text-slate-300 group-hover:translate-x-1 transition"></i>
            </button>

            <button onclick="vibrateSoft(); window.openCredits()" class="bento-card bg-white dark:bg-slate-900 p-4 md:p-6 rounded-[1.2rem] md:rounded-[2rem] border border-white dark:border-slate-800 shadow-sm flex items-center justify-between group active:scale-[0.98] transition hover:border-emerald-500/20">
                <div class="flex items-center gap-3 md:gap-4">
                    <div class="w-9 h-9 md:w-12 md:h-12 rounded-xl md:rounded-2xl bg-emerald-50 dark:bg-emerald-900/20 text-emerald-600 flex items-center justify-center shrink-0 shadow-sm">
                        <i data-lucide="info" class="w-4 h-4 md:w-5 md:h-5"></i>
                    </div>
                    <div class="text-left">
                        <p class="font-bold text-slate-800 dark:text-white text-xs md:text-sm">Tentang Aplikasi</p>
                        <p class="text-[9px] md:text-[10px] text-slate-400">Credits & Developer</p>
                    </div>
                </div>
                <i data-lucide="chevron-right" class="w-4 h-4 text-slate-300 group-hover:translate-x-1 transition"></i>
            </button>

            <button id="logoutBtnProfile" class="bento-card p-4 md:p-6 rounded-[1.2rem] md:rounded-[2rem] font-bold transition flex items-center justify-center gap-3 bg-red-50 dark:bg-red-900/10 text-red-600 dark:text-red-400 border-red-100 dark:border-red-900/30 hover:bg-red-500 hover:text-white active:scale-95 shadow-sm">
                <i data-lucide="log-out" class="w-4 h-4 md:w-5 md:h-5"></i>
                <span class="text-xs md:text-sm font-black uppercase tracking-widest">Keluar Aplikasi</span>
            </button>
        </div>

        <div class="mt-8 text-center opacity-30">
            <p class="text-[9px] font-black uppercase tracking-[0.4em] text-slate-500">Jurnal Ibadah App • <span id="versionTextProfile">...</span></p>
        </div>
    </div>
    
    <div id="editProfileModal" class="fixed inset-0 z-[200] flex items-end sm:items-center justify-center invisible pointer-events-none">
        <div id="editProfileBackdrop" class="absolute inset-0 bg-slate-950/60 backdrop-blur-md opacity-0 transition-opacity duration-500" onclick="closeEditProfile()"></div>
        <div id="editProfileContent" class="relative w-full sm:w-[90%] sm:max-w-md bg-white dark:bg-slate-950 p-8 rounded-t-[2.5rem] sm:rounded-[2.5rem] shadow-2xl border-t border-white/20 dark:border-slate-800 transform translate-y-full transition-transform duration-500 ease-[cubic-bezier(0.32,0.72,0,1)]">
            <div class="w-12 h-1.5 bg-slate-200 dark:bg-slate-800 rounded-full mx-auto mb-8"></div>
            <div class="flex justify-between items-start mb-8">
                <div>
                    <h3 class="text-2xl font-black text-slate-800 dark:text-white tracking-tight">Pengaturan</h3>
                    <p class="text-xs text-slate-400 font-medium mt-1">Sesuaikan preferensi akun kamu</p>
                </div>
                <button onclick="closeEditProfile()" class="w-10 h-10 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-400 hover:text-slate-600 transition"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="space-y-6">
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest block ml-1 mb-3">Nama Tampilan</label>
                    <div class="relative">
                        <i data-lucide="user" class="absolute left-5 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400"></i>
                        <input type="text" id="editNameInput" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl pl-14 pr-6 py-4 text-sm font-bold text-slate-800 dark:text-white focus:outline-none focus:border-emerald-500 transition shadow-inner" placeholder="Nama Kamu">
                    </div>
                </div>

                <label class="flex items-center justify-between p-5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl cursor-pointer group hover:border-emerald-500/30 transition-colors">
                    <div class="flex items-center gap-4">
                        <div class="w-11 h-11 rounded-2xl bg-white dark:bg-slate-800 flex items-center justify-center text-slate-500 shadow-sm group-hover:scale-110 transition-transform"><i data-lucide="moon" class="w-5 h-5"></i></div>
                        <div><span class="block text-sm font-bold text-slate-700 dark:text-slate-200">Dark Mode</span></div>
                    </div>
                    <div class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="darkModeToggleProfile" class="sr-only peer">
                        <div class="relative w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-emerald-500 shadow-inner"></div>
                    </div>
                </label>
                
                <button id="saveProfileBtn" class="w-full py-4 rounded-2xl bg-emerald-500 text-white font-black text-sm shadow-xl shadow-emerald-500/20 transition-all active:scale-95 flex items-center justify-center gap-2">
                    <i data-lucide="check" class="w-4 h-4"></i> Simpan Perubahan
                </button>
            </div>
        </div>
    </div>

    <div id="logoutModal" class="fixed inset-0 z-[250] flex items-center justify-center invisible pointer-events-none">
        <div id="logoutBackdrop" class="absolute inset-0 bg-slate-950/60 backdrop-blur-sm opacity-0 transition-opacity duration-500"></div>
        <div id="logoutModalContent" class="relative w-[85%] max-w-[320px] bg-white dark:bg-slate-950 p-8 rounded-[3rem] shadow-2xl border border-white/10 dark:border-slate-800 transform scale-90 opacity-0 transition-all duration-300">
            <div class="flex flex-col items-center text-center">
                <div class="relative mb-6">
                    <div class="absolute inset-0 bg-red-500/20 rounded-full blur-xl"></div>
                    <div class="relative w-20 h-20 bg-red-50 text-red-500 rounded-full flex items-center justify-center border border-red-100"><i data-lucide="log-out" class="w-8 h-8 ml-1"></i></div>
                </div>
                <h3 class="text-xl font-black text-slate-800 dark:text-white mb-2">Ingin Keluar?</h3>
                <p class="text-xs text-slate-500 mb-8 leading-relaxed">Data kamu aman, namun kamu harus login kembali nanti.</p>
                <div class="flex flex-col gap-3 w-full">
                    <button id="confirmLogoutBtn" class="w-full py-4 rounded-2xl bg-red-500 text-white font-bold text-xs shadow-lg shadow-red-500/30 active:scale-95">Ya, Keluar Sekarang</button>
                    <button id="cancelLogoutBtn" class="w-full py-4 rounded-2xl bg-slate-100 text-slate-500 font-bold text-xs active:scale-95">Batalkan</button>
                </div>
            </div>
        </div>
    </div>
</div>
