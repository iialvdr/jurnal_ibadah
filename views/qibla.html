<div id="qiblaView" class="hidden-force flex flex-col h-full absolute inset-0 z-50 transition-all duration-300 overflow-hidden bg-slate-100 dark:bg-slate-950">
    
    <div class="fixed top-0 left-0 right-0 h-48 bg-gradient-to-b from-emerald-500/10 via-emerald-500/5 to-transparent pointer-events-none z-0"></div>

    <div class="px-5 pt-[calc(1.5rem+env(safe-area-inset-top))] pb-3 shrink-0 relative z-30 flex justify-between items-center">
        <button onclick="vibrateSoft(); goBack()" class="w-10 h-10 rounded-full bg-white/80 dark:bg-slate-900/80 backdrop-blur-md flex items-center justify-center text-slate-600 dark:text-slate-300 shadow-sm border border-white/50 dark:border-slate-700 active:scale-95 transition hover:text-emerald-600 group">
             <i data-lucide="arrow-left" class="w-5 h-5 group-hover:-translate-x-0.5 transition"></i>
        </button>
        <h2 class="text-lg font-bold text-slate-800 dark:text-white tracking-tight">Arah Kiblat</h2>
        <div class="w-10"></div> 
    </div>

    <div class="flex-1 flex flex-col items-center relative z-10 overflow-y-auto no-scrollbar pt-4 pb-20">
        
        <div id="qiblaSuccessIndicator" class="absolute top-0 left-0 right-0 flex justify-center z-40 opacity-0 pointer-events-none transition-all duration-500 transform -translate-y-4 scale-90">
            <div class="bg-emerald-500 text-white px-5 py-2.5 rounded-full shadow-lg shadow-emerald-500/30 flex items-center gap-2.5 border border-emerald-400/50 backdrop-blur-md">
                <div class="bg-white/20 p-1 rounded-full"><i data-lucide="check" class="w-3.5 h-3.5 text-white font-bold"></i></div>
                <span class="text-xs font-bold tracking-wide uppercase">Arah Tepat</span>
            </div>
        </div>

        <div class="relative w-[320px] h-[320px] flex items-center justify-center mb-8 mt-6">
            
            <div class="absolute inset-0 rounded-full border border-slate-200 dark:border-slate-800 opacity-50"></div>
            
            <div class="absolute -top-5 left-0 right-0 flex justify-center items-end z-20">
                 <div class="text-emerald-500 animate-bounce drop-shadow-sm">
                    <i data-lucide="chevron-down" class="w-8 h-8 fill-current"></i>
                </div>
            </div>
            
            <div id="compassDisc" class="w-[90%] h-[90%] rounded-full bg-white dark:bg-slate-900 shadow-[0_10px_40px_-10px_rgba(0,0,0,0.1)] dark:shadow-[0_10px_40px_-10px_rgba(0,0,0,0.5)] border-[4px] border-slate-100 dark:border-slate-800 relative will-change-transform flex items-center justify-center">
                
                <span class="absolute top-4 left-1/2 -translate-x-1/2 text-sm font-black text-red-500">U</span>
                <span class="absolute bottom-4 left-1/2 -translate-x-1/2 text-xs font-bold text-slate-300 dark:text-slate-600">S</span>
                <span class="absolute left-4 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-300 dark:text-slate-600">B</span>
                <span class="absolute right-4 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-300 dark:text-slate-600">T</span>
                
                <div class="absolute inset-3 rounded-full border-2 border-dashed border-slate-200 dark:border-slate-700/50 opacity-60"></div>
                
                <div id="qiblaPointer" class="absolute inset-0 z-20 transition-transform duration-700 ease-out will-change-transform">
                    <div class="absolute top-6 left-1/2 -translate-x-1/2 flex flex-col items-center w-12" id="kaabaIconContainer">
                        <div class="relative group flex justify-center">
                            <div id="kaabaGlow" class="absolute inset-0 bg-emerald-500 blur-2xl opacity-0 rounded-full transition-opacity duration-500"></div>
                            <img src="https://img.icons8.com/fluency/48/kaaba.png" class="relative w-12 h-12 drop-shadow-md z-10 transition-transform duration-300 object-contain" alt="Kaaba">
                        </div>
                        <div id="pointerLine" class="w-1.5 h-24 bg-gradient-to-b from-emerald-500/40 to-transparent mt-1 rounded-full transition-colors duration-300"></div>
                    </div>
                </div>
                
                <div class="w-4 h-4 bg-slate-100 dark:bg-slate-800 rounded-full z-30 shadow-inner border border-slate-200 dark:border-slate-700 flex items-center justify-center">
                    <div class="w-1.5 h-1.5 bg-emerald-500 rounded-full"></div>
                </div>
            </div>
        </div>

        <div class="w-full max-w-xs space-y-5">
            <div class="text-center">
                <span class="text-[10px] uppercase tracking-[0.2em] text-slate-400 font-bold">Sudut Kiblat</span>
                <h3 id="qiblaDegree" class="text-5xl font-black text-slate-800 dark:text-white font-mono tracking-tighter mt-1">--°</h3>
            </div>

            <div class="grid grid-cols-2 gap-3">
                 <div class="bg-white dark:bg-slate-900 p-3.5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col items-center justify-center group hover:border-emerald-200 dark:hover:border-emerald-900 transition">
                    <div class="w-8 h-8 rounded-full bg-emerald-50 dark:bg-emerald-900/20 text-emerald-600 dark:text-emerald-400 flex items-center justify-center mb-2">
                        <i data-lucide="map-pin" class="w-4 h-4"></i>
                    </div>
                    <span class="text-[9px] text-slate-400 uppercase font-bold tracking-wider mb-0.5">Jarak</span>
                    <span id="qiblaDistance" class="text-xs font-bold text-slate-700 dark:text-slate-200">- km</span>
                 </div>
                 <div class="bg-white dark:bg-slate-900 p-3.5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col items-center justify-center group hover:border-blue-200 dark:hover:border-blue-900 transition">
                    <div class="w-8 h-8 rounded-full bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 flex items-center justify-center mb-2">
                        <i data-lucide="compass" class="w-4 h-4"></i>
                    </div>
                    <span class="text-[9px] text-slate-400 uppercase font-bold tracking-wider mb-0.5">Kompas</span>
                    <span id="compassHeading" class="text-xs font-bold text-slate-700 dark:text-slate-200">--°</span>
                 </div>
            </div>
            
            <div id="compassPermissionBtn" class="hidden pt-4">
                <button onclick="requestCompassPermission()" class="w-full py-3.5 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl text-xs font-bold shadow-lg shadow-emerald-500/30 transition flex items-center justify-center gap-2 active:scale-95">
                    <i data-lucide="compass" class="w-4 h-4"></i> Izinkan Akses Kompas
                </button>
            </div>
        </div>
        
        <div id="calibrationWarning" class="absolute bottom-6 left-0 right-0 px-8 text-center hidden">
            <div class="inline-flex items-center gap-2 px-4 py-2 bg-amber-50 dark:bg-amber-900/40 border border-amber-200 dark:border-amber-800 rounded-full animate-pulse">
                <i data-lucide="alert-circle" class="w-3 h-3 text-amber-500"></i> 
                <span class="text-[10px] font-bold text-amber-600 dark:text-amber-400">Kalibrasi: Putar HP angka 8</span>
            </div>
        </div>
    </div>
</div>
