<div id="qiblaView" class="hidden-force flex flex-col h-full absolute inset-0 z-50 transition-all duration-300 overflow-y-auto bg-slate-100 dark:bg-slate-950 no-scrollbar" style="touch-action: pan-y;">
    
    <div class="fixed top-0 left-0 right-0 h-80 bg-gradient-to-b from-emerald-500/10 via-emerald-500/5 to-transparent pointer-events-none z-0"></div>

    <div class="sticky top-0 z-[100] px-5 pt-[calc(1.5rem+env(safe-area-inset-top))] pb-3 md:px-8 md:pt-6">
        <div class="glass-pill flex items-center justify-between p-2 rounded-full bg-white/70 dark:bg-slate-900/70 backdrop-blur-xl border border-white/40 dark:border-slate-700/50 shadow-sm w-full max-w-7xl mx-auto">
            <button onclick="vibrateSoft(); goBack()" class="w-10 h-10 rounded-full flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-black/5 dark:hover:bg-white/10 transition active:scale-90 group">
                <i data-lucide="arrow-left" class="w-5 h-5 group-hover:-translate-x-0.5 transition"></i>
            </button>
            <h2 class="text-sm font-bold text-slate-800 dark:text-white tracking-tight text-center flex-1 truncate px-2">Arah Kiblat</h2>
            <div class="w-10"></div> 
        </div>
    </div>

    <div class="relative z-10 flex-1 flex flex-col items-center pt-4 pb-20 md:grid md:grid-cols-2 md:gap-10 md:px-12 md:content-center md:h-full md:pb-0 max-w-7xl mx-auto w-full">
        
        <div id="qiblaSuccessIndicator" class="absolute top-0 left-0 right-0 flex justify-center z-40 opacity-0 pointer-events-none transition-all duration-500 transform -translate-y-4 scale-90 md:top-10">
            <div class="bg-emerald-500 text-white px-6 py-3 rounded-full shadow-xl shadow-emerald-500/30 flex items-center gap-3 border border-emerald-400/50 backdrop-blur-md">
                <div class="bg-white/20 p-1.5 rounded-full"><i data-lucide="check" class="w-4 h-4 text-white font-bold"></i></div>
                <span class="text-xs font-black tracking-[0.1em] uppercase">Arah Kiblat Tepat</span>
            </div>
        </div>

        <div class="relative w-full max-w-[320px] md:max-w-[420px] aspect-square flex items-center justify-center mb-10 mt-6 md:mb-0 md:mt-0 touch-none mx-auto">
            <div class="absolute inset-0 rounded-full border-2 border-slate-200/50 dark:border-slate-800/50 opacity-50"></div>
            
            <div class="absolute -top-6 left-0 right-0 flex justify-center items-end z-20">
                 <div class="text-emerald-500 animate-bounce drop-shadow-[0_0_8px_rgba(16,185,129,0.5)]">
                    <i data-lucide="chevron-down" class="w-10 h-10 fill-current"></i>
                </div>
            </div>
            
            <div id="compassDisc" class="w-[92%] aspect-square rounded-full bg-white/80 dark:bg-slate-900/80 backdrop-blur-2xl shadow-2xl border-[6px] border-white dark:border-slate-800 relative will-change-transform flex items-center justify-center transition-colors duration-500">
                <span class="absolute top-5 left-1/2 -translate-x-1/2 text-sm font-black text-rose-500">U</span>
                <span class="absolute bottom-5 left-1/2 -translate-x-1/2 text-xs font-bold text-slate-300 dark:text-slate-600">S</span>
                <span class="absolute left-5 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-300 dark:text-slate-600">B</span>
                <span class="absolute right-5 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-300 dark:text-slate-600">T</span>
                
                <div class="absolute inset-4 rounded-full border border-dashed border-slate-200 dark:border-slate-700/50 opacity-40"></div>
                
                <div id="qiblaPointer" class="absolute inset-0 z-20 will-change-transform">
                    <div id="kaabaIconContainer" class="absolute top-8 left-1/2 -translate-x-1/2 flex flex-col items-center w-14 transition-all duration-500">
                        <div class="relative group flex justify-center">
                            <div id="kaabaGlow" class="absolute inset-[-10px] bg-emerald-500 blur-2xl opacity-0 rounded-full transition-opacity duration-500"></div>
                            <img src="https://img.icons8.com/fluency/48/kaaba.png" class="relative w-14 h-14 drop-shadow-lg z-10 transition-transform duration-300 object-contain" alt="Kaaba">
                        </div>
                        <div id="pointerLine" class="w-2 h-28 bg-gradient-to-b from-emerald-500 to-transparent mt-2 rounded-full opacity-40 transition-all duration-500"></div>
                    </div>
                </div>

                <div class="w-5 h-5 bg-white dark:bg-slate-800 rounded-full z-30 shadow-md border-4 border-slate-100 dark:border-slate-700 flex items-center justify-center">
                    <div class="w-1.5 h-1.5 bg-emerald-500 rounded-full"></div>
                </div>
            </div>
        </div>

        <div class="w-full max-w-xs space-y-6 md:max-w-sm mx-auto px-5">
            <div class="text-center md:text-left bento-card bg-white/40 dark:bg-slate-900/40 backdrop-blur-sm p-6 rounded-[2rem] border border-white dark:border-slate-800">
                <span class="text-[10px] uppercase tracking-[0.3em] text-slate-400 font-bold">Sudut Kiblat Kamu</span>
                <h3 id="qiblaDegree" class="text-4xl md:text-5xl font-black text-slate-800 dark:text-white font-mono tracking-tighter mt-2">--°</h3>
            </div>

            <div class="grid grid-cols-2 gap-4">
                 <div class="bento-card bg-white dark:bg-slate-900 p-5 rounded-[1.8rem] border border-white dark:border-slate-800 shadow-sm flex flex-col items-center justify-center group hover:border-emerald-500/30 transition-all md:items-start md:pl-6">
                    <div class="w-9 h-9 rounded-2xl bg-emerald-50 dark:bg-emerald-900/20 text-emerald-600 dark:text-emerald-400 flex items-center justify-center mb-3 group-hover:scale-110 transition">
                        <i data-lucide="map-pin" class="w-4 h-4"></i>
                    </div>
                    <span class="text-[9px] text-slate-400 uppercase font-black tracking-widest mb-1">Jarak</span>
                    <span id="qiblaDistance" class="text-xs font-bold text-slate-700 dark:text-slate-200">- km</span>
                 </div>
                 
                 <div class="bento-card bg-white dark:bg-slate-900 p-5 rounded-[1.8rem] border border-white dark:border-slate-800 shadow-sm flex flex-col items-center justify-center group hover:border-blue-500/30 transition-all md:items-start md:pl-6">
                    <div class="w-9 h-9 rounded-2xl bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 flex items-center justify-center mb-3 group-hover:scale-110 transition">
                        <i data-lucide="compass" class="w-4 h-4"></i>
                    </div>
                    <span class="text-[9px] text-slate-400 uppercase font-black tracking-widest mb-1">Kompas</span>
                    <span id="compassHeading" class="text-xs font-bold text-slate-700 dark:text-slate-200">--°</span>
                 </div>
            </div>
            
            <div id="compassPermissionBtn" class="hidden">
                <button onclick="vibrateSoft(); requestCompassPermission()" class="w-full py-4 bg-emerald-500 hover:bg-emerald-600 text-white rounded-2xl text-xs font-bold shadow-xl shadow-emerald-500/20 transition-all flex items-center justify-center gap-3 active:scale-95">
                    <i data-lucide="compass" class="w-5 h-5"></i> Izinkan Akses Kompas
                </button>
            </div>

            <div class="bg-amber-500/5 border border-amber-500/10 p-5 rounded-[2rem] md:block">
                <div class="flex items-start gap-4">
                    <div class="w-8 h-8 rounded-xl bg-amber-500/10 text-amber-500 flex items-center justify-center shrink-0">
                        <i data-lucide="info" class="w-4 h-4"></i>
                    </div>
                    <div>
                        <p class="text-[10px] font-black text-amber-600 dark:text-amber-500 uppercase tracking-widest">Tips Akurasi</p>
                        <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-1.5 leading-relaxed">Jauhkan perangkat dari benda logam atau magnet. Putar perangkat membentuk angka 8 jika kompas terasa tidak akurat.</p>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="calibrationWarning" class="absolute bottom-10 left-0 right-0 px-8 text-center hidden">
            <div class="inline-flex items-center gap-3 px-5 py-2.5 bg-white/80 dark:bg-slate-900/80 border border-amber-500/30 rounded-full animate-pulse shadow-lg backdrop-blur-md">
                <i data-lucide="alert-circle" class="w-4 h-4 text-amber-500"></i> 
                <span class="text-[10px] font-bold text-slate-600 dark:text-slate-400 uppercase tracking-widest">Kalibrasi: Gerakkan HP angka 8</span>
            </div>
        </div>
    </div>
</div>
