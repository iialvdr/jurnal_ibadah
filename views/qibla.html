<div id="qiblaView" class="hidden-force flex flex-col h-full absolute inset-0 z-50 transition-all duration-300 overflow-hidden">
    <div class="px-6 pb-4 pt-[calc(2rem+env(safe-area-inset-top))] flex justify-between items-center relative shrink-0 z-20">
        <button onclick="closeQibla()" class="p-2 -ml-2 rounded-xl hover:bg-white/20 transition group">
            <div class="bg-white/40 dark:bg-slate-700/40 p-2 rounded-full backdrop-blur-md shadow-sm border border-white/20 group-hover:border-emerald-500/30 transition">
                <i data-lucide="arrow-left" class="w-5 h-5 text-slate-600 dark:text-slate-300"></i>
            </div>
        </button>
        <h2 class="text-lg font-bold text-slate-800 dark:text-white tracking-tight">Arah Kiblat</h2>
        <div class="w-9"></div>
    </div>
    <div class="flex-1 flex flex-col items-center justify-center p-6 pb-20 relative">
        <div class="relative w-72 h-72 flex items-center justify-center">
            <div class="absolute -top-8 z-20 flex flex-col items-center">
                <div class="w-1.5 h-4 bg-red-500 rounded-full mb-2 shadow-sm"></div>
                <i data-lucide="smartphone" class="w-5 h-5 text-slate-400"></i>
            </div>
            <div id="compassDisc" class="w-full h-full rounded-full bg-white/60 dark:bg-slate-800/60 shadow-2xl border-[6px] border-white/40 dark:border-slate-700/40 backdrop-blur-md relative transition-transform duration-75 ease-linear will-change-transform">
                <span class="absolute top-3 left-1/2 -translate-x-1/2 text-sm font-black text-red-500">U</span>
                <span class="absolute bottom-3 left-1/2 -translate-x-1/2 text-xs font-bold text-slate-400">S</span>
                <span class="absolute left-3 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-400">B</span>
                <span class="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-400">T</span>
                <div id="qiblaPointer" class="absolute inset-0 transition-transform duration-700 ease-out">
                    <div class="absolute top-6 left-1/2 -translate-x-1/2 flex flex-col items-center">
                        <div class="relative group">
                            <div class="absolute inset-0 bg-emerald-500 blur-md opacity-50 rounded-full animate-pulse"></div>
                            <img src="https://img.icons8.com/fluency/48/kaaba.png" class="relative w-12 h-12 drop-shadow-md z-10" alt="Kaaba">
                        </div>
                        <div class="w-1.5 h-16 bg-gradient-to-b from-emerald-500 to-transparent mt-1 rounded-full opacity-80"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="mt-12 text-center space-y-2 z-10">
            <div class="flex flex-col items-center justify-center">
                <span class="text-[10px] uppercase tracking-widest text-slate-500 dark:text-slate-400 font-bold">Sudut Kiblat</span>
                <h3 id="qiblaDegree" class="text-5xl font-black text-slate-800 dark:text-white font-mono tracking-tighter mt-1">--°</h3>
            </div>
            <div class="flex gap-3 justify-center mt-4">
                <p class="text-xs text-slate-600 dark:text-slate-300 bg-white/40 dark:bg-slate-800/40 border border-white/20 px-4 py-2 rounded-xl backdrop-blur-sm">
                    Jarak: <span id="qiblaDistance" class="font-bold text-emerald-600 dark:text-emerald-400">- km</span>
                </p>
                <p class="text-xs text-slate-600 dark:text-slate-300 bg-white/40 dark:bg-slate-800/40 border border-white/20 px-4 py-2 rounded-xl backdrop-blur-sm">
                    Kompas: <span id="compassHeading" class="font-bold text-blue-600 dark:text-blue-400">--°</span>
                </p>
            </div>
            <div id="compassPermissionBtn" class="hidden pt-6">
                <button onclick="requestCompassPermission()" class="px-6 py-3 bg-emerald-600 text-white rounded-xl text-sm font-bold shadow-lg hover:bg-emerald-700 transition flex items-center gap-2 mx-auto">
                    <i data-lucide="compass" class="w-4 h-4"></i> Izinkan Kompas
                </button>
            </div>
        </div>
        <div id="calibrationWarning" class="absolute bottom-8 left-0 right-0 px-8 text-center hidden">
            <p class="text-xs text-amber-600 dark:text-amber-400 bg-amber-100/80 dark:bg-amber-900/50 px-4 py-2 rounded-lg border border-amber-200/50 inline-block animate-pulse backdrop-blur-sm">
                ⚠ Kompas tidak akurat? Gerakkan HP angka 8.
            </p>
        </div>
    </div>
</div>
