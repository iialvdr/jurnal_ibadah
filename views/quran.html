<div id="quranView" class="hidden-force flex flex-col h-full absolute inset-0 z-40 overflow-y-auto bg-slate-100 dark:bg-slate-950 no-scrollbar">
    
    <div class="fixed top-0 left-0 right-0 h-80 bg-gradient-to-b from-emerald-500/10 via-emerald-500/5 to-transparent pointer-events-none z-0"></div>

    <div id="quranHeader" class="sticky top-0 z-[130] px-5 pt-[calc(1.5rem+env(safe-area-inset-top))] pb-3 md:px-8 md:pt-6">
        <div class="glass-pill flex items-center justify-between p-2 rounded-full bg-white/70 dark:bg-slate-900/70 backdrop-blur-xl border border-white/40 dark:border-slate-700/50 shadow-sm w-full max-w-7xl mx-auto">
            <button id="quranBackBtn" onclick="vibrateSoft(); handleQuranBack()" class="w-10 h-10 rounded-full flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-black/5 dark:hover:bg-white/10 transition active:scale-90 group">
                <i data-lucide="arrow-left" class="w-5 h-5 group-hover:-translate-x-0.5 transition"></i>
            </button>
            <h2 id="quranTitle" class="text-sm font-bold text-slate-800 dark:text-white tracking-tight text-center flex-1 truncate px-2">Al-Qur'an</h2>
            <div class="w-10"></div> 
        </div>
    </div>

    <div class="relative z-10 w-full mx-auto">
        
        <div id="quranSearchContainer" class="sticky top-[85px] z-40 px-5 pt-2 pb-4 transition-transform duration-500 ease-in-out will-change-transform md:px-8 max-w-7xl mx-auto">
            <div id="quranSearchWrapper" class="relative group" style="will-change: transform;">
                <div class="relative bg-white/80 dark:bg-slate-900/80 backdrop-blur-md rounded-[1.8rem] border border-white dark:border-slate-800 flex items-center px-5 py-4 transition-all duration-300 group-focus-within:ring-4 group-focus-within:ring-emerald-500/10 shadow-sm">
                    <i data-lucide="search" class="w-5 h-5 text-slate-400 group-focus-within:text-emerald-500 transition-colors"></i>
                    <input type="text" id="quranSearchInput" onkeyup="searchSurah(this.value)" placeholder="Cari surat atau arti..." class="w-full bg-transparent border-none focus:ring-0 text-sm font-bold text-slate-700 dark:text-white placeholder:text-slate-400 ml-4 outline-none">
                </div>
            </div>
        </div>
        
        <div id="quranLoading" class="hidden-force px-5 space-y-3 md:px-8 md:grid md:grid-cols-2 lg:grid-cols-3 md:gap-4 md:space-y-0 max-w-7xl mx-auto"></div>

        <div id="surahListContainer" class="px-5 pb-12 space-y-3 md:px-8 md:grid md:grid-cols-2 lg:grid-cols-3 md:gap-4 md:space-y-0 max-w-7xl mx-auto"></div>
    </div>

    <div id="ayahListContainer" class="fixed inset-0 z-[110] bg-slate-100 dark:bg-slate-950 translate-x-full transition-transform duration-500 overflow-y-auto no-scrollbar">
        <div class="fixed top-0 left-0 right-0 h-96 bg-gradient-to-b from-emerald-500/10 via-emerald-500/5 to-transparent pointer-events-none z-0"></div>
        <div class="relative z-10 w-full max-w-4xl mx-auto pt-24 md:pt-32">
            <div class="text-center py-8 mb-6 px-5 md:py-12">
                <div class="inline-block p-5 rounded-[2rem] bg-white/40 dark:bg-slate-900/40 backdrop-blur-sm border border-white/50 dark:border-slate-800 shadow-sm mb-4 md:p-6 md:rounded-[2.5rem]">
                    <p class="font-quran text-2xl text-emerald-600 dark:text-emerald-400 drop-shadow-sm leading-relaxed">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</p>
                </div>
            </div>
            <div id="ayahsContent" class="px-5 pb-24 space-y-6 md:px-8"></div>
        </div>
    </div>

    <div id="surahNavButtons" class="fixed bottom-8 left-5 right-5 flex justify-between gap-4 z-[120] transition-transform duration-500 translate-y-40 max-w-lg mx-auto">
        <button id="btnPrevSurah" onclick="vibrateSoft(); changeSurah(-1)" class="flex-1 glass-pill bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl p-4 rounded-3xl border border-white/50 dark:border-slate-700 shadow-2xl text-slate-600 dark:text-slate-300 font-bold text-xs flex items-center justify-center gap-3 active:scale-95 transition-all">
            <i data-lucide="chevron-left" class="w-5 h-5 text-emerald-500"></i> Sebelumnya
        </button>
        <button id="btnNextSurah" onclick="vibrateSoft(); changeSurah(1)" class="flex-1 bg-emerald-500 p-4 rounded-3xl shadow-2xl shadow-emerald-500/30 text-white font-bold text-xs flex items-center justify-center gap-3 active:scale-95 hover:bg-emerald-600 transition-all">
            Selanjutnya <i data-lucide="chevron-right" class="w-5 h-5"></i>
        </button>
    </div>

    <div id="stickyAudioPlayer" class="fixed left-4 right-4 bottom-24 z-[125] opacity-0 pointer-events-none translate-y-6 transition-all duration-300 max-w-xl mx-auto">
        <div class="bg-white/70 dark:bg-slate-900/70 backdrop-blur-xl border border-white/40 dark:border-slate-700/60 shadow-2xl rounded-2xl px-3 py-2 flex items-center justify-between gap-2">
            <div class="flex items-center gap-3 min-w-0">
                <div class="w-8 h-8 rounded-lg bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 flex items-center justify-center shrink-0 border border-emerald-500/20">
                    <i data-lucide="volume-2" class="w-4 h-4"></i>
                </div>
                <div class="min-w-0">
                    <p class="text-[9px] font-black text-emerald-600 dark:text-emerald-400 uppercase tracking-widest">Audio Tilawah</p>
                    <p id="stickyAudioTitle" class="text-[11px] font-bold text-slate-800 dark:text-white truncate">QS. -</p>
                    <p id="stickyAudioAyah" class="text-[10px] font-bold text-slate-500 dark:text-slate-400 truncate">Ayat -</p>
                    <p id="stickyAudioStatus" class="text-[9px] font-black text-amber-600 dark:text-amber-400 uppercase tracking-widest hidden">Memuat audio...</p>
                </div>
            </div>
            <div class="flex items-center gap-2 shrink-0">
                <button id="stickyAudioPrevBtn" class="w-8 h-8 rounded-full bg-white/60 dark:bg-slate-800/80 text-slate-500 dark:text-slate-300 flex items-center justify-center border border-white/50 dark:border-slate-700 active:scale-95 transition">
                    <i data-lucide="skip-back" class="w-3.5 h-3.5"></i>
                </button>
                <button id="stickyAudioPlayBtn" class="w-9 h-9 rounded-full bg-emerald-500 text-white flex items-center justify-center shadow-lg shadow-emerald-500/30 active:scale-95 transition">
                    <i data-lucide="play" class="w-4 h-4 fill-current ml-0.5"></i>
                </button>
                <button id="stickyAudioNextBtn" class="w-8 h-8 rounded-full bg-white/60 dark:bg-slate-800/80 text-slate-500 dark:text-slate-300 flex items-center justify-center border border-white/50 dark:border-slate-700 active:scale-95 transition">
                    <i data-lucide="skip-forward" class="w-3.5 h-3.5"></i>
                </button>
                <button id="stickyAudioCloseBtn" class="w-8 h-8 rounded-full bg-white/60 dark:bg-slate-800/80 text-slate-500 dark:text-slate-300 flex items-center justify-center border border-white/50 dark:border-slate-700 active:scale-95 transition">
                    <i data-lucide="x" class="w-3.5 h-3.5"></i>
                </button>
            </div>
        </div>
    </div>
</div>
