<div id="quranView" class="hidden-force flex flex-col h-full absolute inset-0 z-50 transition-all duration-300 overflow-hidden bg-slate-100 dark:bg-slate-950">
    
    <div class="fixed top-0 left-0 right-0 h-48 bg-gradient-to-b from-emerald-500/10 via-emerald-500/5 to-transparent pointer-events-none z-0"></div>

    <div class="px-5 pt-[calc(1.5rem+env(safe-area-inset-top))] pb-3 flex justify-between items-center relative shrink-0 z-30">
        <button id="quranBackBtn" onclick="handleQuranBack()" class="w-10 h-10 rounded-full bg-white/80 dark:bg-slate-900/80 backdrop-blur-md flex items-center justify-center text-slate-600 dark:text-slate-300 shadow-sm border border-white/50 dark:border-slate-700 active:scale-95 transition hover:text-purple-600 group">
            <i data-lucide="arrow-left" class="w-5 h-5 group-hover:-translate-x-0.5 transition"></i>
        </button>
        <h2 id="quranTitle" class="text-lg font-bold text-slate-800 dark:text-white tracking-tight">Al-Qur'an</h2>
        <div class="w-10"></div> 
    </div>

    <div class="flex-1 relative overflow-hidden flex flex-col z-10">
        
        <div id="quranSearchContainer" class="px-5 pb-2 transition-all duration-300">
            <div class="relative group">
                <div class="relative bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 flex items-center px-4 py-3 transition-colors duration-200 group-focus-within:border-emerald-500 hover:border-emerald-300 dark:hover:border-emerald-700">
                    <i data-lucide="search" class="w-4 h-4 text-slate-400 group-focus-within:text-emerald-500 transition-colors"></i>
                    <input type="text" id="quranSearchInput" onkeyup="searchSurah(this.value)" placeholder="Cari surat atau arti..." class="w-full bg-transparent border-none focus:ring-0 text-sm font-bold text-slate-700 dark:text-white placeholder:text-slate-400 ml-3 h-full outline-none">
                </div>
            </div>
        </div>
        
        <div id="quranLoading" class="hidden absolute inset-x-0 bottom-0 top-[4.5rem] z-20 px-5 pt-2 pb-4 space-y-2.5 bg-slate-100 dark:bg-slate-950 overflow-y-auto no-scrollbar">
            <div class="animate-pulse bg-white dark:bg-slate-900 p-3.5 rounded-2xl border border-slate-200 dark:border-slate-800 flex items-center gap-3.5"><div class="w-10 h-10 rounded-xl bg-slate-200 dark:bg-slate-800 shrink-0"></div><div class="flex-1 space-y-1.5"><div class="h-3 bg-slate-200 dark:bg-slate-800 rounded w-24"></div><div class="h-2 bg-slate-200 dark:bg-slate-800 rounded w-16"></div></div></div>
            <div class="animate-pulse bg-white dark:bg-slate-900 p-3.5 rounded-2xl border border-slate-200 dark:border-slate-800 flex items-center gap-3.5"><div class="w-10 h-10 rounded-xl bg-slate-200 dark:bg-slate-800 shrink-0"></div><div class="flex-1 space-y-1.5"><div class="h-3 bg-slate-200 dark:bg-slate-800 rounded w-32"></div><div class="h-2 bg-slate-200 dark:bg-slate-800 rounded w-20"></div></div></div>
            <div class="animate-pulse bg-white dark:bg-slate-900 p-3.5 rounded-2xl border border-slate-200 dark:border-slate-800 flex items-center gap-3.5"><div class="w-10 h-10 rounded-xl bg-slate-200 dark:bg-slate-800 shrink-0"></div><div class="flex-1 space-y-1.5"><div class="h-3 bg-slate-200 dark:bg-slate-800 rounded w-20"></div><div class="h-2 bg-slate-200 dark:bg-slate-800 rounded w-14"></div></div></div>
            <div class="animate-pulse bg-white dark:bg-slate-900 p-3.5 rounded-2xl border border-slate-200 dark:border-slate-800 flex items-center gap-3.5"><div class="w-10 h-10 rounded-xl bg-slate-200 dark:bg-slate-800 shrink-0"></div><div class="flex-1 space-y-1.5"><div class="h-3 bg-slate-200 dark:bg-slate-800 rounded w-28"></div><div class="h-2 bg-slate-200 dark:bg-slate-800 rounded w-12"></div></div></div>
            <div class="animate-pulse bg-white dark:bg-slate-900 p-3.5 rounded-2xl border border-slate-200 dark:border-slate-800 flex items-center gap-3.5"><div class="w-10 h-10 rounded-xl bg-slate-200 dark:bg-slate-800 shrink-0"></div><div class="flex-1 space-y-1.5"><div class="h-3 bg-slate-200 dark:bg-slate-800 rounded w-24"></div><div class="h-2 bg-slate-200 dark:bg-slate-800 rounded w-16"></div></div></div>
            <div class="animate-pulse bg-white dark:bg-slate-900 p-3.5 rounded-2xl border border-slate-200 dark:border-slate-800 flex items-center gap-3.5"><div class="w-10 h-10 rounded-xl bg-slate-200 dark:bg-slate-800 shrink-0"></div><div class="flex-1 space-y-1.5"><div class="h-3 bg-slate-200 dark:bg-slate-800 rounded w-32"></div><div class="h-2 bg-slate-200 dark:bg-slate-800 rounded w-20"></div></div></div>
        </div>

        <div id="surahListContainer" class="flex-1 overflow-y-auto px-5 pt-1 space-y-2.5 scroll-smooth pb-24 no-scrollbar" style="transform: translate3d(0,0,0); will-change: transform;"></div>
            
        <div id="ayahListContainer" class="absolute inset-0 overflow-y-auto px-5 pb-40 space-y-5 bg-slate-100 dark:bg-slate-950 translate-x-full transition-transform duration-300 z-20 scroll-smooth no-scrollbar">
            <div class="text-center py-8 mb-2 relative">
                <div class="absolute inset-x-12 top-1/2 h-px bg-gradient-to-r from-transparent via-slate-300 dark:via-slate-700 to-transparent"></div>
                <span class="relative bg-slate-100 dark:bg-slate-950 px-6 font-quran text-2xl text-emerald-600 dark:text-emerald-400 drop-shadow-sm leading-relaxed pb-2">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</span>
            </div>
            
            <div id="ayahsContent" class="space-y-5"></div>
        </div>
        
        <div id="surahNavButtons" class="absolute bottom-6 left-5 right-5 flex justify-between gap-3 z-40 transition-transform duration-300 translate-y-40">
            <button onclick="vibrateSoft(); changeSurah(-1)" class="flex-1 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md shadow-lg shadow-slate-200/20 dark:shadow-black/20 border border-white/50 dark:border-slate-700/50 text-slate-600 dark:text-slate-300 py-3.5 rounded-2xl font-bold text-xs flex items-center justify-center gap-2 active:scale-95 transition hover:bg-white dark:hover:bg-slate-800 disabled:opacity-50 disabled:cursor-not-allowed">
                <i data-lucide="chevron-left" class="w-4 h-4"></i> Sebelumnya
            </button>
            <button onclick="vibrateSoft(); changeSurah(1)" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white shadow-lg shadow-emerald-500/30 border border-emerald-400/20 py-3.5 rounded-2xl font-bold text-xs flex items-center justify-center gap-2 active:scale-95 transition disabled:opacity-50 disabled:cursor-not-allowed">
                Selanjutnya <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>
        </div>
    </div>
</div>
