<div id="quranView" class="hidden-force flex flex-col h-full absolute inset-0 z-50 transition-all duration-300 overflow-hidden bg-slate-100 dark:bg-slate-950">
    
    <div class="px-6 pb-4 pt-[calc(2rem+env(safe-area-inset-top))] flex justify-between items-center relative shrink-0 z-30 bg-slate-100/90 dark:bg-slate-950/90 backdrop-blur-md border-b border-slate-200/50 dark:border-slate-800/50">

            <i data-lucide="arrow-left" class="w-5 h-5 group-hover:-translate-x-0.5 transition"></i>
        </button>
        <h2 id="quranTitle" class="text-xl font-black text-slate-800 dark:text-white tracking-tight">Al-Qur'an</h2>
        <div class="w-11"></div> 
    </div>

    <div class="flex-1 relative overflow-hidden flex flex-col">
        
        <div id="quranSearchContainer" class="px-6 pt-4 pb-2 z-20 transition-all duration-300">
            <div class="relative group" style="transform: translate3d(0,0,0);">
                <div class="relative bg-white dark:bg-slate-900 rounded-[1.5rem] shadow-sm border border-slate-200 dark:border-slate-800 flex items-center px-4 py-3.5 transition-colors duration-200 ease-out group-focus-within:border-emerald-500 hover:border-emerald-300 dark:hover:border-emerald-700">
                    <i data-lucide="search" class="w-5 h-5 text-slate-400 group-focus-within:text-emerald-500 transition-colors"></i>
                    <input type="text" id="quranSearchInput" onkeyup="searchSurah(this.value)" placeholder="Cari surat..." class="w-full bg-transparent border-none focus:ring-0 text-sm font-bold text-slate-700 dark:text-white placeholder:text-slate-400 ml-3 h-full outline-none">
                </div>
            </div>
        </div>
        
        <div id="quranLoading" class="hidden absolute inset-x-0 bottom-0 top-[8.5rem] z-20 px-6 pt-2 pb-32 space-y-2 bg-slate-100 dark:bg-slate-950 overflow-y-auto no-scrollbar">
            <div class="animate-pulse bg-white dark:bg-slate-900 p-4 rounded-[1.5rem] border border-slate-200 dark:border-slate-800 flex items-center gap-4"><div class="w-12 h-12 rounded-2xl bg-slate-200 dark:bg-slate-800 shrink-0"></div><div class="flex-1 space-y-2"><div class="h-3 bg-slate-200 dark:bg-slate-800 rounded w-24"></div><div class="h-2 bg-slate-200 dark:bg-slate-800 rounded w-16"></div></div></div>

            <div class="animate-pulse bg-white dark:bg-slate-900 p-4 rounded-[1.5rem] border border-slate-200 dark:border-slate-800 flex items-center gap-4"><div class="w-12 h-12 rounded-2xl bg-slate-200 dark:bg-slate-800 shrink-0"></div><div class="flex-1 space-y-2"><div class="h-3 bg-slate-200 dark:bg-slate-800 rounded w-28"></div><div class="h-2 bg-slate-200 dark:bg-slate-800 rounded w-14"></div></div></div>
            <div class="animate-pulse bg-white dark:bg-slate-900 p-4 rounded-[1.5rem] border border-slate-200 dark:border-slate-800 flex items-center gap-4"><div class="w-12 h-12 rounded-2xl bg-slate-200 dark:bg-slate-800 shrink-0"></div><div class="flex-1 space-y-2"><div class="h-3 bg-slate-200 dark:bg-slate-800 rounded w-20"></div><div class="h-2 bg-slate-200 dark:bg-slate-800 rounded w-12"></div></div></div>
            <div class="animate-pulse bg-white dark:bg-slate-900 p-4 rounded-[1.5rem] border border-slate-200 dark:border-slate-800 flex items-center gap-4"><div class="w-12 h-12 rounded-2xl bg-slate-200 dark:bg-slate-800 shrink-0"></div><div class="flex-1 space-y-2"><div class="h-3 bg-slate-200 dark:bg-slate-800 rounded w-24"></div><div class="h-2 bg-slate-200 dark:bg-slate-800 rounded w-16"></div></div></div>
            <div class="animate-pulse bg-white dark:bg-slate-900 p-4 rounded-[1.5rem] border border-slate-200 dark:border-slate-800 flex items-center gap-4"><div class="w-12 h-12 rounded-2xl bg-slate-200 dark:bg-slate-800 shrink-0"></div><div class="flex-1 space-y-2"><div class="h-3 bg-slate-200 dark:bg-slate-800 rounded w-32"></div><div class="h-2 bg-slate-200 dark:bg-slate-800 rounded w-20"></div></div></div>
            <div class="animate-pulse bg-white dark:bg-slate-900 p-4 rounded-[1.5rem] border border-slate-200 dark:border-slate-800 flex items-center gap-4"><div class="w-12 h-12 rounded-2xl bg-slate-200 dark:bg-slate-800 shrink-0"></div><div class="flex-1 space-y-2"><div class="h-3 bg-slate-200 dark:bg-slate-800 rounded w-28"></div><div class="h-2 bg-slate-200 dark:bg-slate-800 rounded w-14"></div></div></div>

        </div>

        <div id="surahListContainer" class="flex-1 overflow-y-auto p-6 pt-2 space-y-2 scroll-smooth pb-32 no-scrollbar" style="transform: translate3d(0,0,0); backface-visibility: hidden; will-change: transform;">
             </div>
            
        <div id="ayahListContainer" class="absolute inset-0 overflow-y-auto p-6 pb-40 space-y-6 bg-slate-100 dark:bg-slate-950 translate-x-full transition-transform duration-300 z-10 scroll-smooth no-scrollbar">
            <div class="text-center py-8 mb-4 relative">
                <div class="absolute inset-x-10 top-1/2 h-px bg-gradient-to-r from-transparent via-slate-300 dark:via-slate-700 to-transparent"></div>

            </div>
            <div id="ayahsContent" class="space-y-6"></div>
        </div>
        
        <div id="surahNavButtons" class="absolute bottom-8 left-6 right-6 flex justify-between gap-4 z-40 transition-transform duration-300 translate-y-40">
            <button onclick="vibrateSoft(); changeSurah(-1)" class="flex-1 bg-white/70 dark:bg-slate-900/60 backdrop-blur-md shadow-lg shadow-slate-200/30 dark:shadow-black/20 border border-white/40 dark:border-slate-700/50 text-slate-700 dark:text-slate-200 py-4 rounded-[1.5rem] font-bold text-sm flex items-center justify-center gap-2 active:scale-95 transition hover:bg-white/90 dark:hover:bg-slate-800/80 disabled:opacity-50 disabled:cursor-not-allowed">

            </button>
            <button onclick="vibrateSoft(); changeSurah(1)" class="flex-1 bg-emerald-500/85 dark:bg-emerald-600/80 backdrop-blur-md border border-emerald-400/30 shadow-lg shadow-emerald-500/30 text-white py-4 rounded-[1.5rem] font-bold text-sm flex items-center justify-center gap-2 active:scale-95 transition hover:bg-emerald-500 dark:hover:bg-emerald-600 disabled:opacity-50 disabled:cursor-not-allowed">
